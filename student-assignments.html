<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Assignments</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.btn{padding:11px 13px;border-radius:10px;border:1px solid #31516f;background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.task{padding:14px;border:1px solid #31516f;border-radius:12px;margin:10px 0;background:#10253a}.pending{border-color:#9b7a2c}.done{border-color:#3d8b64;background:#102c25}.muted{color:#9db4cc}.good{color:#86efac}.warn{color:#fcd34d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1>My Teacher Assignments 老师任务</h1><div id="who" class="muted"></div></div><a class="btn" href="index.html">返回主页</a></div><div class="card"><div id="list" class="muted">Loading…</div></div></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const sid=localStorage.getItem('uasaStudentId')||'';who.textContent=(localStorage.getItem('uasaStudentName')||'Student')+(localStorage.getItem('uasaStudentCode')?' · '+localStorage.getItem('uasaStudentCode'):'');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function actionUrl(x){if(x.task_type==='wrong_retry')return 'wrong-retry.html';if(x.task_type==='boss')return 'boss-test.html';if(x.task_type==='level'&&Number(x.book_no)>0)return 'index.html#book-'+x.book_no;return 'index.html'}async function load(){if(!sid){list.innerHTML='<p>请先登录学生账号。</p>';return}const r=await fetch(API+'/api/assignments/student?student_id='+encodeURIComponent(sid));if(!r.ok){list.innerHTML='<p>无法读取任务。</p>';return}const d=await r.json();list.innerHTML=(d.assignments||[]).map(x=>`<div class="task ${x.status==='completed'?'done':'pending'}"><b>${esc(x.title)}</b><div class="muted">${esc(x.instruction||'')}</div><div class="muted">${x.book_no?`Book ${x.book_no}`:''}${x.level_no?` · Level ${x.level_no}`:''} · ${esc(x.created_at||'')}</div><div class="actions">${x.status==='completed'?'<span class="good">Completed ✓</span>':`<a class="btn" href="${actionUrl(x)}">Start Task</a><button class="btn" onclick="complete(${x.id})">Mark Completed</button>`}</div></div>`).join('')||'<p class="good">目前没有老师任务。</p>'}async function complete(id){const r=await fetch(API+'/api/assignments/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:id,student_id:sid})});if(r.ok)load()}load();</script></body></html>
