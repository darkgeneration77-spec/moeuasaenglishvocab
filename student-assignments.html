<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Assignments</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.btn{padding:11px 13px;border-radius:10px;border:1px solid #31516f;background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.task{padding:16px;border:1px solid #31516f;border-radius:12px;margin:10px 0;background:#10253a}.pending{border-color:#9b7a2c}.done{border-color:#3d8b64;background:#102c25}.muted{color:#9db4cc}.good{color:#86efac}.warn{color:#fcd34d}.bad{color:#fca5a5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#17283b;color:#b7cadc;font-size:12px;margin-right:5px}.progress{height:9px;background:#17314b;border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#60a5fa}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #294b6d;border-radius:12px;background:#10253a}.stat b{display:block;font-size:26px}.auto{color:#86efac;font-size:13px}@media(max-width:700px){.summary{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1>My Teacher Assignments 老师任务</h1><div id="who" class="muted"></div></div><div class="actions"><a class="btn" href="student-dashboard.html">Dashboard</a><a class="btn" href="index.html">返回主页</a></div></div><div class="card"><div class="summary"><div class="stat"><b id="pendingCount">0</b><span class="muted">Pending</span></div><div class="stat"><b id="doneCount">0</b><span class="muted">Completed</span></div><div class="stat"><b id="autoCount">0</b><span class="muted">Auto Completed</span></div></div></div><div class="card"><div class="auto">系统会根据 D1 学习记录自动判断 Level / Wrong Retry / Boss 是否完成。Custom Task 才需要学生手动确认。</div><div id="list" class="muted" style="margin-top:10px">Loading…</div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const sid=localStorage.getItem('uasaStudentId')||'';
who.textContent=(localStorage.getItem('uasaStudentName')||'Student')+(localStorage.getItem('uasaStudentCode')?' · '+localStorage.getItem('uasaStudentCode'):'');
const files={1:'MOE_UASA_English_Vocabulary_Book_1.html',2:'MOE_UASA_English_Vocabulary_Book_2_High_Frequency_Verbs.html',3:'MOE_UASA_English_Vocabulary_Book_3_Confusing_Words.html',4:'MOE_UASA_English_Vocabulary_Book_4_Writing_Vocabulary.html',5:'MOE_UASA_English_Vocabulary_Book_5_Phrasal_Verbs_Collocations.html',6:'MOE_UASA_English_Vocabulary_Book_6_Synonyms_Antonyms.html',7:'MOE_UASA_English_Vocabulary_Book_7_Word_Families_Affixes_Standard_Pronunciation.html',8:'MOE_UASA_English_Vocabulary_Book_8_Prepositions_Time_Direction(1).html',9:'MOE_UASA_English_Vocabulary_Book_9_Homophones_Homonyms.html',10:'MOE_UASA_English_Vocabulary_Book_10_Idioms_Expressions.html',11:'MOE_UASA_English_Vocabulary_Book_11_Confusing_Words_Advanced.html',12:'MOE_UASA_English_Vocabulary_Book_12_Common_Verbs_Master.html',13:'MOE_UASA_English_Vocabulary_Book_13_Adjectives_Adverbs.html',14:'MOE_UASA_English_Book_14_Full_Practice_FIXED.html',15:'MOE_UASA_English_Vocabulary_Book_15_Connectors_Linking_Words.html',16:'MOE_UASA_English_Vocabulary_Book_16_Ultimate_Revision.html',17:'MOE_UASA_English_Vocabulary_Book_17_Practice_1000.html',18:'MOE_UASA_English_Vocabulary_Book_18_Reading_Comprehension_Vocabulary.html',19:'MOE_UASA_English_Vocabulary_Book_19_Spelling_Dictation_Master.html',20:'MOE_UASA_English_Vocabulary_Book_20_Writing_Upgrade_Master.html',21:'MOE_UASA_English_Book_21_Full_240_Questions.html',22:'MOE_UASA_English_Book_22_Full_40_Questions_FIXED.html',23:'MOE_UASA_English_Book_23_Full_36_Questions_FIXED.html',24:'MOE_UASA_English_Book_24_Full_Writing_Practice_FIXED.html',25:'MOE_UASA_English_Book_25_Full_Trial_Papers_DIRECT_FIXED.html',26:'MOE_UASA_English_Book_26_Full_60_Questions_FIXED.html'};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ts(s){const d=new Date(String(s||'').replace(' ','T')+'Z');return Number.isNaN(d.getTime())?0:d.getTime()}
function baseQKey(x){return String(x.question_key||'').replace(/^retry\|/,'').replace(/^boss\|/,'').replace(/\|complete$/,'')||((x.book_no||'')+'|'+(x.question_text||''))}
function actionUrl(x){if(x.task_type==='wrong_retry')return 'wrong-retry.html';if(x.task_type==='boss')return 'boss-test.html';if(x.task_type==='level'&&Number(x.book_no)>0&&files[x.book_no])return 'reader-v2.html?file='+encodeURIComponent(files[x.book_no])+'&level='+Number(x.level_no||1);return 'index.html'}
async function complete(id){const r=await fetch(API+'/api/assignments/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:id,student_id:sid})});return r.ok}
function unresolvedCount(recent,createdAt){const after=ts(createdAt);const relevant=recent.filter(x=>ts(x.created_at)>=after);const recoveredKeys=new Set(relevant.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===1&&Number(x.recovered)===1).map(baseQKey));const wrongMap=new Map();relevant.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===0&&!String(x.quiz_mode||'').includes('Wrong Question Retry')&&!String(x.quiz_mode||'').includes('Boss Test')).forEach(x=>{const k=baseQKey(x);if(!wrongMap.has(k))wrongMap.set(k,x)});return [...wrongMap.keys()].filter(k=>!recoveredKeys.has(k)).length}
async function autoCheck(assignments,summary){let changed=0;for(const x of assignments){if(x.status==='completed')continue;let done=false;if(x.task_type==='level'){const lv=(summary.levels||[]).find(y=>Number(y.book_no)===Number(x.book_no)&&Number(y.level_no)===Number(x.level_no));done=!!lv&&Number(lv.mastery)>=80&&ts(lv.updated_at)>=ts(x.created_at)}else if(x.task_type==='boss'){const b=(summary.bosses||[]).find(y=>Number(y.passed)===1&&ts(y.updated_at)>=ts(x.created_at));done=!!b}else if(x.task_type==='wrong_retry'){const afterRecover=(summary.recent||[]).some(y=>Number(y.recovered)===1&&ts(y.created_at)>=ts(x.created_at));done=afterRecover&&unresolvedCount(summary.recent||[],x.created_at)===0}if(done&&await complete(x.id)){x.status='completed';x.completed_at=new Date().toISOString();x.__auto=true;changed++}}return changed}
async function load(){if(!sid){list.innerHTML='<p class="bad">请先登录学生账号。</p>';return}const [ar,sr]=await Promise.all([fetch(API+'/api/assignments/student?student_id='+encodeURIComponent(sid)),fetch(API+'/api/student/summary?student_id='+encodeURIComponent(sid))]);if(!ar.ok||!sr.ok){list.innerHTML='<p class="bad">无法读取任务或学习资料。</p>';return}const ad=await ar.json(),sd=await sr.json();const arr=ad.assignments||[];const auto=await autoCheck(arr,sd);pendingCount.textContent=arr.filter(x=>x.status!=='completed').length;doneCount.textContent=arr.filter(x=>x.status==='completed').length;autoCount.textContent=auto;list.innerHTML=arr.map(x=>{let evidence='';if(x.task_type==='level'){const lv=(sd.levels||[]).find(y=>Number(y.book_no)===Number(x.book_no)&&Number(y.level_no)===Number(x.level_no));const m=lv?Number(lv.mastery||0):0;evidence=`Cloud Mastery ${m}%`;if(lv&&ts(lv.updated_at)<ts(x.created_at))evidence+=' · 需在派发后重新完成'}else if(x.task_type==='boss'){evidence='Boss Test 必须在任务派发后 Passed'}else if(x.task_type==='wrong_retry'){evidence='需在任务派发后完成错题补救'}else evidence='Custom Task 由学生手动确认';return `<div class="task ${x.status==='completed'?'done':'pending'}"><div><span class="pill">${esc(x.task_type)}</span>${x.book_no?`<span class="pill">Book ${x.book_no}</span>`:''}${x.level_no?`<span class="pill">Level ${x.level_no}</span>`:''}</div><h3 style="margin:10px 0 6px">${esc(x.title)}</h3><div class="muted">${esc(x.instruction||'')}</div><div class="muted" style="margin-top:7px">${esc(evidence)} · Assigned ${esc(x.created_at||'')}</div><div class="actions">${x.status==='completed'?`<span class="good">Completed ✓${x.__auto?' · Auto verified':''}</span>`:`<a class="btn" href="${actionUrl(x)}">Start Task</a>${x.task_type==='custom'?`<button class="btn" onclick="manualComplete(${x.id})">Mark Completed</button>`:'<span class="warn">Waiting for cloud evidence</span>'}`}</div></div>`}).join('')||'<p class="good">目前没有老师任务。</p>'}
async function manualComplete(id){if(await complete(id))load()}
load();
</script></body></html>
