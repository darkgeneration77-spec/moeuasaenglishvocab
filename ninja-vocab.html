<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ninja Vocabulary Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{min-height:100vh;background:#07111f;color:#fff;font-family:Arial,"Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:16px;overflow:auto}.wrap{width:min(100%,560px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.restart{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#163a5f;color:#fff}.restart{background:#ef4444;color:#fff}.title{text-align:center;flex:1}.title b{display:block;font-size:18px}.title small{color:#9fc6e5}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.hud div{background:#10233a;border:1px solid #284866;border-radius:13px;padding:10px;text-align:center;font-weight:800}.hint{background:linear-gradient(135deg,#14263e,#1d3555);border:1px solid #31587c;border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}.hint .label{font-size:12px;color:#9fc6e5}.hint .zh{font-size:28px;font-weight:900;color:#fde047;margin:5px 0}.hint .ms{font-size:14px;color:#bfdbfe}.stage{position:relative;height:540px;background:radial-gradient(circle at 50% 15%,#173455,#07111f 72%);border:1px solid #294966;border-radius:22px;overflow:hidden;touch-action:none;cursor:crosshair}.word{position:absolute;left:50%;bottom:-74px;min-width:100px;max-width:210px;padding:15px 18px;border-radius:18px;border:2px solid #60a5fa;background:#10263a;color:#e0f2fe;font-weight:900;font-size:22px;text-align:center;box-shadow:0 0 18px #38bdf866;transform:translateX(-50%);will-change:transform,bottom;z-index:3}.word.cut{animation:none!important;opacity:0;transform:translateX(-50%) scale(1.35) rotate(8deg);transition:.15s}.slash{position:absolute;width:72px;height:4px;border-radius:99px;background:white;box-shadow:0 0 15px #bae6fd;pointer-events:none;transform:rotate(-35deg);animation:fade .25s forwards;z-index:7}.tip{text-align:center;color:#9fc6e5;font-size:13px;padding:10px 2px 3px}.overlay{position:absolute;inset:0;background:#020617e8;display:none;align-items:center;justify-content:center;text-align:center;padding:26px;z-index:20}.overlay.show{display:flex}.card h2{font-size:34px;margin-bottom:10px}.card p{line-height:1.6;color:#cbd5e1;margin-bottom:14px}.card button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:800;cursor:pointer}@keyframes fade{to{opacity:0;transform:rotate(-35deg) scale(1.5)}}@media(max-width:520px){body{padding:8px}.hint .zh{font-size:23px}.hud{font-size:13px}.title b{font-size:15px}.stage{height:500px}.word{font-size:19px;min-width:90px;padding:13px 15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="back" id="backBtn">← 返回</button><div class="title"><b>忍者词汇 · Ninja Vocabulary</b><small id="bookLabel">Vocabulary Quiz</small></div><button class="restart" id="restartBtn">重来</button></div>
  <div class="hud"><div>❤️ <span id="lives">3</span></div><div>⚡ <span id="score">0</span></div><div>🎯 <span id="round">0</span></div></div>
  <div class="hint"><div class="label">砍掉正确的英文单词</div><div class="zh" id="zhHint">载入词汇中…</div><div class="ms" id="msHint"></div></div>
  <div class="stage" id="stage"><div class="overlay" id="overlay"><div class="card"><h2>GAME OVER</h2><p id="endText"></p><button id="playAgain">再玩一次</button></div></div></div>
  <div class="tip">电脑：点击或按住鼠标划过单词 · 手机：手指滑砍</div>
</div>
<script>
const p=new URLSearchParams(location.search),file=p.get('file')||'MOE_UASA_English_Vocabulary_Book_1.html';
const stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),zhHint=document.getElementById('zhHint'),msHint=document.getElementById('msHint'),livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),roundEl=document.getElementById('round');
let pool=[],spawnTimer=null,cutting=false,game={score:0,lives:3,round:0,target:null,over:false};
const safe=v=>String(v==null?'':v);
function hud(){livesEl.textContent=game.lives;scoreEl.textContent=game.score;roundEl.textContent=game.round}
function chooseTarget(){if(!pool.length)return;game.target=pool[Math.floor(Math.random()*pool.length)];zhHint.textContent=safe(game.target.zh||game.target.ms);msHint.textContent=game.target.ms?'Bahasa Melayu: '+game.target.ms:'';game.round++;hud()}
function clearWords(){stage.querySelectorAll('.word,.slash').forEach(e=>e.remove())}
function reset(){clearInterval(spawnTimer);clearWords();game={score:0,lives:3,round:0,target:null,over:false};overlay.classList.remove('show');chooseTarget();hud();spawnWord(true);spawnTimer=setInterval(()=>spawnWord(false),850)}
function randomWord(forceTarget=false){if(forceTarget||Math.random()<.55)return game.target;const other=pool.filter(x=>x!==game.target);return other[Math.floor(Math.random()*other.length)]||game.target}
function spawnWord(forceTarget=false){if(game.over||!game.target)return;const w=randomWord(forceTarget),el=document.createElement('div');el.className='word';el.textContent=w.en;el.dataset.en=safe(w.en);const left=12+Math.random()*76,dur=3200+Math.random()*1800;el.style.left=left+'%';stage.appendChild(el);requestAnimationFrame(()=>{el.style.transition=`bottom ${dur}ms linear, left ${dur}ms ease-in-out`;el.style.bottom=(stage.clientHeight+90)+'px';el.style.left=Math.max(10,Math.min(90,left+(Math.random()-.5)*18))+'%'});el.addEventListener('pointerdown',e=>{e.preventDefault();cutWord(el,e.clientX,e.clientY)});el.addEventListener('pointerenter',e=>{if(cutting)cutWord(el,e.clientX,e.clientY)});setTimeout(()=>{if(!el.isConnected||game.over)return;if(game.target&&el.dataset.en===safe(game.target.en)){game.lives--;hud();if(game.lives<=0)endGame();else chooseTarget()}el.remove()},dur+180)}
function slashFx(cx,cy){const r=stage.getBoundingClientRect(),s=document.createElement('div');s.className='slash';s.style.left=(cx-r.left-36)+'px';s.style.top=(cy-r.top)+'px';stage.appendChild(s);setTimeout(()=>s.remove(),260)}
function cutWord(el,cx,cy){if(game.over||!el.isConnected||el.classList.contains('cut'))return;slashFx(cx,cy);el.classList.add('cut');const correct=game.target&&el.dataset.en===safe(game.target.en);setTimeout(()=>el.remove(),150);if(correct){game.score+=10;chooseTarget();hud();setTimeout(()=>spawnWord(true),120)}else{game.lives--;hud();if(game.lives<=0)endGame()}}
function endGame(){game.over=true;clearInterval(spawnTimer);document.getElementById('endText').textContent=`得分 ${game.score} 分 · 完成 ${Math.max(0,game.round-1)} 个目标词汇`;overlay.classList.add('show');try{localStorage.setItem('ninjaVocabBest:'+file,String(Math.max(game.score,Number(localStorage.getItem('ninjaVocabBest:'+file)||0))))}catch(e){}}
document.addEventListener('pointerdown',()=>cutting=true);document.addEventListener('pointerup',()=>cutting=false);document.addEventListener('pointercancel',()=>cutting=false);
async function load(){try{let saved=sessionStorage.getItem('ninjaVocabPool'),source=sessionStorage.getItem('ninjaVocabSource');if(saved&&(!source||source===file))pool=JSON.parse(saved);if(!Array.isArray(pool)||pool.length<4){const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+WORDS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('WORDS not found');pool=Function('return '+m[1])().filter(w=>w&&w.en&&(w.zh||w.ms));}if(!pool.length)throw Error('empty pool');document.getElementById('bookLabel').textContent=`${pool.length} Words · Meaning Quiz`;reset()}catch(e){zhHint.textContent='无法读取词汇';msHint.textContent='请返回 Vocabulary Book 后再进入 Meaning Quiz';console.error(e)}}
document.getElementById('restartBtn').onclick=reset;document.getElementById('playAgain').onclick=reset;document.getElementById('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href=file};
load();
</script>
</body>
</html>
