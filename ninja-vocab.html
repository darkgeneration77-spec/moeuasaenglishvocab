<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Ninja Vocabulary Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{min-height:100vh;background:#07111f;color:#fff;font-family:Arial,"Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:16px;overflow:auto}.wrap{width:min(100%,620px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.restart{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#163a5f;color:#fff}.restart{background:#ef4444;color:#fff}.title{text-align:center;flex:1}.title b{display:block;font-size:18px}.title small{color:#9fc6e5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.hud div{background:#10233a;border:1px solid #284866;border-radius:13px;padding:10px 6px;text-align:center;font-weight:800}.hud small{display:block;color:#9fc6e5;font-size:10px;margin-bottom:3px}.hint{background:linear-gradient(135deg,#14263e,#1d3555);border:1px solid #31587c;border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}.hint .label{font-size:12px;color:#9fc6e5}.hint .zh{font-size:28px;font-weight:900;color:#fde047;margin:5px 0}.hint .ms{font-size:14px;color:#bfdbfe}.statusLine{min-height:30px;text-align:center;font-weight:800;color:#bfdbfe;padding:4px}.statusLine.good{color:#86efac}.statusLine.bad{color:#fca5a5}.stage{position:relative;height:520px;background:radial-gradient(circle at 50% 12%,#183858,#07111f 72%);border:1px solid #294966;border-radius:22px;overflow:hidden;touch-action:none;cursor:crosshair}.fruitWord{position:absolute;min-width:100px;max-width:190px;padding:13px 16px;border-radius:50px;border:2px solid #60a5fa;background:#10263a;color:#e0f2fe;font-weight:900;font-size:21px;text-align:center;box-shadow:0 0 18px #38bdf866;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;transform:translate(-50%,-50%)}.fruitWord.cut{opacity:0;transform:translate(-50%,-50%) scale(1.55) rotate(18deg);transition:.16s}.fruitWord.wrong{border-color:#fb7185;background:#4a1720;color:#fecdd3}.slash{position:absolute;width:100px;height:5px;border-radius:99px;background:white;box-shadow:0 0 18px #7dd3fc;pointer-events:none;z-index:12;transform:rotate(-35deg);animation:sf .22s forwards}.burst{position:absolute;width:18px;height:18px;border:3px solid #fde047;border-radius:50%;pointer-events:none;z-index:10;animation:burst .35s forwards}.tip{text-align:center;color:#9fc6e5;font-size:13px;padding:10px 2px 3px}.overlay{position:absolute;inset:0;background:#020617ef;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}.overlay.show{display:flex}.card{max-width:420px}.card h2{font-size:31px;margin-bottom:10px}.card p{line-height:1.75;color:#cbd5e1;margin-bottom:14px}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.resultGrid div{background:#10233a;border:1px solid #284866;border-radius:10px;padding:10px}.card button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}@keyframes sf{to{opacity:0;transform:rotate(-35deg) scale(1.7)}}@keyframes burst{to{opacity:0;transform:scale(4)}}@media(max-width:520px){body{padding:8px}.hint .zh{font-size:23px}.hud{font-size:12px}.stage{height:450px}.fruitWord{font-size:17px;min-width:82px;padding:11px 12px}}
</style></head>
<body><div class="wrap"><div class="top"><button class="back" id="backBtn">← 返回</button><div class="title"><b>忍者词汇 · Fruit Ninja Vocabulary</b><small id="bookLabel">Vocabulary Quiz</small></div><button class="restart" id="restartBtn">重来</button></div><div class="hud"><div><small>LEVEL</small><span id="levelEl">1</span></div><div><small>SCORE</small><span id="scoreEl">0</span></div><div><small>PROGRESS</small><span id="progressEl">0 / 20</span></div><div><small>ACCURACY</small><span id="accuracyEl">100%</span></div></div><div class="hint"><div class="label">看中文，砍掉正确的英文单词</div><div class="zh" id="zhHint">载入词汇中…</div><div class="ms" id="msHint"></div></div><div id="statusLine" class="statusLine">水果忍者模式 · 没砍到不换题 · 砍对 +10 · 砍错 -5</div><div class="stage" id="stage"><div class="overlay" id="overlay"><div class="card"><h2 id="endTitle">LEVEL COMPLETE</h2><div id="endText"></div><button id="playAgain">再玩一次</button></div></div></div><div class="tip">电脑：按住鼠标划过单词 · 手机：手指滑砍。整批掉下去不会扣分，会重新抛出同一题。</div></div>
<script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const p=new URLSearchParams(location.search),file=p.get('file')||'MOE_UASA_English_Vocabulary_Book_1.html',LEVEL=Math.max(1,+(p.get('level')||1));
const bm=file.match(/Book_(\d+)/i),BOOK_NO=bm?+bm[1]:0,BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');
const sid=()=>localStorage.getItem('uasaStudentId')||'',stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),zhHint=document.getElementById('zhHint'),msHint=document.getElementById('msHint'),statusLine=document.getElementById('statusLine'),scoreEl=document.getElementById('scoreEl'),progressEl=document.getElementById('progressEl'),accuracyEl=document.getElementById('accuracyEl'),levelEl=document.getElementById('levelEl');
let fullPool=[],pool=[],CLOUD={total_xp:0,current_streak:0,best_streak:0,books_started:0,books_mastered:0},raf=0,slashing=false,batch=[],respawnTimer=null;
let game={score:0,index:0,cleanCorrect:0,wrongCuts:0,target:null,targetMistake:false,over:false,order:[]};
const safe=v=>String(v==null?'':v);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hud(){scoreEl.textContent=game.score;progressEl.textContent=game.index+' / '+game.order.length;const attempted=game.index+(game.target?1:0),acc=attempted?Math.round(game.cleanCorrect/attempted*100):100;accuracyEl.textContent=acc+'%';levelEl.textContent=LEVEL}
function status(m,t=''){statusLine.textContent=m;statusLine.className='statusLine '+t}function targetKey(){return `B${BOOK_NO}|L${LEVEL}|Q${game.index+1}|${safe(game.target?.en)}`}
async function track(event_type,extra={}){if(!sid())return;try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,quiz_mode:'Fruit Ninja Level '+LEVEL,...extra})})}catch(e){}}
async function loadCloud(){if(!sid())return;try{const d=await(await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid()))).json();CLOUD=Object.assign(CLOUD,d.progress||{})}catch(e){}}
function clearBatch(){clearTimeout(respawnTimer);batch.forEach(o=>o.el?.remove());batch=[]}
function choices(){const d=shuffle(pool.filter(x=>safe(x.en)!==safe(game.target.en))).slice(0,3);return shuffle([game.target,...d])}
function launchBatch(){if(game.over||!game.target)return;clearBatch();const W=stage.clientWidth,H=stage.clientHeight,arr=choices();arr.forEach((w,i)=>{const el=document.createElement('div');el.className='fruitWord';el.textContent=w.en;stage.appendChild(el);const x=W*(.18+.21*i)+((Math.random()-.5)*35),y=H+45,vx=((i-1.5)*.45)+(Math.random()-.5)*.7,vy=-(8.2+Math.random()*1.9),o={el,w,x,y,vx,vy,alive:true,correct:safe(w.en)===safe(game.target.en)};batch.push(o)});status('水果忍者模式：砍正确英文。没砍到会重新抛同一题。','')}
function physics(){if(game.over)return;let active=0;for(const o of batch){if(!o.alive)continue;active++;o.x+=o.vx;o.y+=o.vy;o.vy+=.16;if(o.x<60||o.x>stage.clientWidth-60)o.vx*=-1;o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';if(o.y>stage.clientHeight+80&&o.vy>0){o.alive=false;o.el.remove()}}if(batch.length&&active===0&&!game.over&&!respawnTimer){respawnTimer=setTimeout(()=>{respawnTimer=null;launchBatch()},700)}raf=requestAnimationFrame(physics)}
function slashFx(cx,cy){const r=stage.getBoundingClientRect(),s=document.createElement('div');s.className='slash';s.style.left=(cx-r.left-50)+'px';s.style.top=(cy-r.top)+'px';stage.appendChild(s);setTimeout(()=>s.remove(),240)}function burstFx(x,y){const b=document.createElement('div');b.className='burst';b.style.left=x+'px';b.style.top=y+'px';stage.appendChild(b);setTimeout(()=>b.remove(),360)}
function hitTest(cx,cy){const r=stage.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;for(const o of batch){if(!o.alive)continue;const er=o.el.getBoundingClientRect(),rr=stage.getBoundingClientRect();const l=er.left-rr.left,t=er.top-rr.top;if(x>=l-12&&x<=l+er.width+12&&y>=t-12&&y<=t+er.height+12){cut(o,cx,cy);break}}}
async function resolveCorrect(selected){const t=game.target,key=targetKey(),clean=!game.targetMistake;if(clean)game.cleanCorrect++;await track('answer',{question_key:key,question_text:safe(t.zh||t.ms||t.en),answer_text:selected,is_correct:clean});game.index++;game.target=null;hud();if(game.index>=game.order.length){endGame();return}setTimeout(showTarget,480)}
function cut(o,cx,cy){if(game.over||!game.target||!o.alive)return;slashFx(cx,cy);o.alive=false;o.el.classList.add('cut');setTimeout(()=>o.el.remove(),170);if(o.correct){batch.forEach(x=>{if(x!==o&&x.alive){x.alive=false;x.el.classList.add('cut');setTimeout(()=>x.el.remove(),150)}});burstFx(o.x,o.y);game.score+=10;status(game.targetMistake?'砍对 +10，但本题曾砍错，已记录为需复习。':'漂亮！+10，下一题。','good');hud();resolveCorrect(o.w.en)}else{game.score-=5;game.wrongCuts++;game.targetMistake=true;o.el.classList.add('wrong');status('砍错 '+o.w.en+'，-5。同一题继续。','bad');hud();track('ninja_wrong_cut',{question_key:targetKey(),question_text:safe(game.target.zh||game.target.ms||game.target.en),answer_text:o.w.en,is_correct:false})}}
stage.addEventListener('pointerdown',e=>{slashing=true;stage.setPointerCapture?.(e.pointerId);hitTest(e.clientX,e.clientY)});stage.addEventListener('pointermove',e=>{if(slashing){slashFx(e.clientX,e.clientY);hitTest(e.clientX,e.clientY)}});stage.addEventListener('pointerup',e=>{slashing=false;stage.releasePointerCapture?.(e.pointerId)});stage.addEventListener('pointercancel',()=>slashing=false);
function showTarget(){if(game.index>=game.order.length){endGame();return}clearBatch();game.target=game.order[game.index];game.targetMistake=false;zhHint.textContent=game.target.zh||game.target.ms||game.target.en;msHint.textContent=game.target.ms?'Bahasa Melayu: '+game.target.ms:'';hud();setTimeout(launchBatch,250)}
async function endGame(){if(game.over)return;game.over=true;clearBatch();cancelAnimationFrame(raf);const total=game.order.length,accuracy=Math.round(game.cleanCorrect/Math.max(1,total)*100),mastered=accuracy>=80;const result={book_no:BOOK_NO,level:LEVEL,total,correct:game.cleanCorrect,wrong_cuts:game.wrongCuts,score:game.score,accuracy,mastered,finished_at:new Date().toISOString()};try{localStorage.setItem('ninjaLevelResult:'+sid()+':'+BOOK_NO+':'+LEVEL,JSON.stringify(result))}catch(e){}if(sid()){try{await fetch(API+'/api/progress/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),total_xp:+CLOUD.total_xp||0,current_streak:+CLOUD.current_streak||0,best_streak:+CLOUD.best_streak||0,books_started:+CLOUD.books_started||0,books_mastered:+CLOUD.books_mastered||0,book_no:BOOK_NO,level_no:LEVEL,mastery:accuracy,attempts:total,correct:game.cleanCorrect,unlocked:true,mastered})})}catch(e){}await track('ninja_level_complete',{question_key:`B${BOOK_NO}|L${LEVEL}|SUMMARY`,question_text:'Fruit Ninja Level '+LEVEL,answer_text:`Score ${game.score}; clean ${game.cleanCorrect}/${total}; wrong cuts ${game.wrongCuts}`,is_correct:mastered})}document.getElementById('endTitle').textContent=mastered?'LEVEL MASTERED!':'LEVEL COMPLETE';document.getElementById('endText').innerHTML=`<div class="resultGrid"><div><b>${game.score}</b><br>Score</div><div><b>${accuracy}%</b><br>Accuracy</div><div><b>${game.cleanCorrect} / ${total}</b><br>First-try Correct</div><div><b>${game.wrongCuts}</b><br>Wrong Cuts</div></div><p>${mastered?'达到 80% Mastery，Level 记录已保存。':'未达到 80%，建议重新挑战这一 Level。'}</p>`;overlay.classList.add('show')}
function reset(){clearBatch();cancelAnimationFrame(raf);overlay.classList.remove('show');game={score:0,index:0,cleanCorrect:0,wrongCuts:0,target:null,targetMistake:false,over:false,order:shuffle(pool)};hud();showTarget();raf=requestAnimationFrame(physics);track('ninja_level_start',{question_key:`B${BOOK_NO}|L${LEVEL}|START`,question_text:'Fruit Ninja Level '+LEVEL,answer_text:pool.map(x=>x.en).join(', '),is_correct:true})}
async function load(){try{await loadCloud();let saved=sessionStorage.getItem('ninjaVocabPool'),source=sessionStorage.getItem('ninjaVocabSource');if(saved&&(!source||source===file))fullPool=JSON.parse(saved);if(!Array.isArray(fullPool)||fullPool.length<4){const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+WORDS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('WORDS not found');fullPool=Function('return '+m[1])()}fullPool=fullPool.map(w=>({en:w.en||w.word||'',zh:w.zh||'',ms:w.ms||''})).filter(w=>w.en&&(w.zh||w.ms));const start=(LEVEL-1)*20;pool=fullPool.slice(start,start+20);if(pool.length<4)pool=shuffle(fullPool).slice(0,Math.min(20,fullPool.length));document.getElementById('bookLabel').textContent=`Level ${LEVEL} · ${pool.length} Words · Fruit Ninja Quiz`;reset()}catch(e){zhHint.textContent='无法读取词汇';msHint.textContent='请返回 Vocabulary Book 后再进入 Meaning Quiz';status('词汇载入失败','bad');console.error(e)}}
document.getElementById('restartBtn').onclick=reset;document.getElementById('playAgain').onclick=reset;document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href=file;load();
</script></body></html>
