<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Ninja Vocabulary Quiz</title>
<style>*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{min-height:100vh;background:#07111f;color:#fff;font-family:Arial,"Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:16px;overflow:auto}.wrap{width:min(100%,560px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.restart{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#163a5f;color:#fff}.restart{background:#ef4444;color:#fff}.title{text-align:center;flex:1}.title b{display:block;font-size:18px}.title small{color:#9fc6e5}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.hud div{background:#10233a;border:1px solid #284866;border-radius:13px;padding:10px;text-align:center;font-weight:800}.hint{background:linear-gradient(135deg,#14263e,#1d3555);border:1px solid #31587c;border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}.hint .label{font-size:12px;color:#9fc6e5}.hint .zh{font-size:28px;font-weight:900;color:#fde047;margin:5px 0}.hint .ms{font-size:14px;color:#bfdbfe}.stage{position:relative;background:radial-gradient(circle at 50% 15%,#173455,#07111f 70%);border:1px solid #294966;border-radius:22px;overflow:hidden}.stage canvas{width:100%;height:auto;display:block;aspect-ratio:500/700;touch-action:none;cursor:crosshair}.tip{text-align:center;color:#9fc6e5;font-size:13px;padding:10px 2px 3px}.overlay{position:absolute;inset:0;background:#020617dd;display:none;align-items:center;justify-content:center;text-align:center;padding:26px}.overlay.show{display:flex}.card h2{font-size:34px;margin-bottom:10px}.card p{line-height:1.6;color:#cbd5e1;margin-bottom:14px}.card button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:800;cursor:pointer}@media(max-width:520px){body{padding:8px}.hint .zh{font-size:23px}.hud{font-size:13px}.title b{font-size:15px}}</style></head>
<body><div class="wrap"><div class="top"><button class="back" id="backBtn">← 返回</button><div class="title"><b>忍者词汇 · Ninja Vocabulary</b><small id="bookLabel">Vocabulary Quiz</small></div><button class="restart" id="restartBtn">重来</button></div><div class="hud"><div>❤️ <span id="lives">3</span></div><div>⚡ <span id="score">0</span></div><div>🎯 <span id="round">0</span></div></div><div class="hint"><div class="label">砍掉正确的英文单词</div><div class="zh" id="zhHint">载入词汇中…</div><div class="ms" id="msHint"></div></div><div class="stage"><canvas id="game" width="500" height="700"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="endTitle">GAME OVER</h2><p id="endText"></p><button id="playAgain">再玩一次</button></div></div></div><div class="tip">电脑：点击或按住鼠标划过单词 · 手机：手指滑砍</div></div>
<script>
const p=new URLSearchParams(location.search),file=p.get('file')||'MOE_UASA_English_Vocabulary_Book_1.html';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),roundEl=document.getElementById('round'),zhHint=document.getElementById('zhHint'),msHint=document.getElementById('msHint'),overlay=document.getElementById('overlay');
let pool=[],started=false,game={score:0,lives:3,round:0,items:[],fx:[],timer:0,interval:52,target:null,over:false};
const safe=v=>String(v==null?'':v);
function hud(){livesEl.textContent=game.lives;scoreEl.textContent=game.score;roundEl.textContent=game.round}
function target(){if(!pool.length)return;game.target=pool[Math.floor(Math.random()*pool.length)];zhHint.textContent=safe(game.target.zh||game.target.ms);msHint.textContent=game.target.ms?'Bahasa Melayu: '+game.target.ms:'';game.round++;hud()}
function reset(){game={score:0,lives:3,round:0,items:[],fx:[],timer:0,interval:52,target:null,over:false};overlay.classList.remove('show');target();hud();spawn()}
function spawn(){if(game.over||!game.target||pool.length<1)return;let o;if(Math.random()<.58)o=game.target;else{const others=pool.filter(x=>x!==game.target);o=others[Math.floor(Math.random()*others.length)]||game.target}let r=Math.max(42,Math.min(78,26+safe(o.en).length*3.7));game.items.push({o,x:65+Math.random()*(canvas.width-130),y:canvas.height-10,vx:(Math.random()-.5)*2.2,vy:-7.2-Math.random()*2.4,r,font:Math.max(19,Math.min(30,30-safe(o.en).length*.45)),target:o===game.target})}
function slash(cx,cy){if(game.over)return;let b=canvas.getBoundingClientRect(),x=(cx-b.left)*canvas.width/b.width,y=(cy-b.top)*canvas.height/b.height;game.fx.push({x,y,life:12});for(let i=game.items.length-1;i>=0;i--){let a=game.items[i];if(Math.hypot(x-a.x,y-a.y)<a.r+18){if(a.target){game.score+=10;game.items.splice(i,1);target();game.interval=Math.max(24,52-Math.floor(game.score/70));spawn()}else{game.lives--;game.items.splice(i,1);hud();if(game.lives<=0)end()}break}}}
function end(){game.over=true;document.getElementById('endText').textContent=`得分 ${game.score} 分 · 完成 ${Math.max(0,game.round-1)} 个目标词汇`;overlay.classList.add('show');try{localStorage.setItem('ninjaVocabBest:'+file,String(Math.max(game.score,Number(localStorage.getItem('ninjaVocabBest:'+file)||0))))}catch(e){}}
function update(){if(game.over)return;if(++game.timer>=game.interval){game.timer=0;spawn()}for(let i=game.items.length-1;i>=0;i--){let a=game.items[i];a.x+=a.vx;a.y+=a.vy;a.vy+=.075;if(a.x<55||a.x>canvas.width-55)a.vx*=-1;if(a.y>canvas.height+70){if(a.target){game.lives--;hud();if(game.lives<=0){end();break}else target()}game.items.splice(i,1)}}for(let i=game.fx.length-1;i>=0;i--)if(--game.fx[i].life<=0)game.fx.splice(i,1)}
function drawWord(a){ctx.save();ctx.translate(a.x,a.y);ctx.shadowBlur=12;ctx.shadowColor='#7dd3fc';ctx.fillStyle='#10263a';ctx.fillRect(-a.r,-32,a.r*2,64);ctx.shadowBlur=0;ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.strokeRect(-a.r,-32,a.r*2,64);ctx.fillStyle='#e0f2fe';ctx.font=`800 ${a.font}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.o.en,0,1);ctx.restore()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let y=100;y<700;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(500,y);ctx.stroke()}for(const a of game.items)drawWord(a);for(const f of game.fx){ctx.globalAlpha=f.life/12;ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,18,0,Math.PI*1.3);ctx.stroke();ctx.globalAlpha=1}}
function loop(){try{update();draw()}catch(e){console.error('Ninja loop error',e)}requestAnimationFrame(loop)}
async function load(){try{let saved=sessionStorage.getItem('ninjaVocabPool'),source=sessionStorage.getItem('ninjaVocabSource');if(saved&&(!source||source===file))pool=JSON.parse(saved);if(!Array.isArray(pool)||pool.length<4){const html=await fetch(file,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.text()}),m=html.match(/const\s+WORDS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('WORDS not found');pool=Function('return '+m[1])().filter(w=>w&&w.en&&(w.zh||w.ms));}if(!pool.length)throw Error('empty pool');document.getElementById('bookLabel').textContent=`${pool.length} Words · Meaning Quiz`;reset();if(!started){started=true;loop()}}catch(e){zhHint.textContent='无法读取词汇';msHint.textContent='请返回 Vocabulary Book 后再进入 Meaning Quiz';console.error(e)}}
document.getElementById('restartBtn').onclick=reset;document.getElementById('playAgain').onclick=reset;document.getElementById('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href=file};canvas.addEventListener('mousedown',e=>slash(e.clientX,e.clientY));canvas.addEventListener('mousemove',e=>{if(e.buttons===1)slash(e.clientX,e.clientY)});canvas.addEventListener('touchstart',e=>{e.preventDefault();let t=e.touches[0];if(t)slash(t.clientX,t.clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];if(t)slash(t.clientX,t.clientY)},{passive:false});
load();
</script></body></html>
