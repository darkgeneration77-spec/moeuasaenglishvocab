<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ninja Vocabulary Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{min-height:100vh;background:#07111f;color:#fff;font-family:Arial,"Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:16px;overflow:auto}.wrap{width:min(100%,620px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.restart{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#163a5f;color:#fff}.restart{background:#ef4444;color:#fff}.title{text-align:center;flex:1}.title b{display:block;font-size:18px}.title small{color:#9fc6e5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.hud div{background:#10233a;border:1px solid #284866;border-radius:13px;padding:10px 6px;text-align:center;font-weight:800}.hud small{display:block;color:#9fc6e5;font-size:10px;margin-bottom:3px}.hint{background:linear-gradient(135deg,#14263e,#1d3555);border:1px solid #31587c;border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}.hint .label{font-size:12px;color:#9fc6e5}.hint .zh{font-size:28px;font-weight:900;color:#fde047;margin:5px 0}.hint .ms{font-size:14px;color:#bfdbfe}.statusLine{min-height:30px;text-align:center;font-weight:800;color:#bfdbfe;padding:4px}.statusLine.good{color:#86efac}.statusLine.bad{color:#fca5a5}.stage{position:relative;min-height:420px;background:radial-gradient(circle at 50% 15%,#173455,#07111f 72%);border:1px solid #294966;border-radius:22px;padding:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:center}.flyingWord{min-height:82px;padding:16px 14px;border-radius:18px;border:2px solid #60a5fa;background:#10263a;color:#e0f2fe;font-weight:900;font-size:22px;text-align:center;box-shadow:0 0 18px #38bdf844;cursor:pointer;transition:.12s;word-break:break-word}.flyingWord:hover{transform:scale(1.03);border-color:#93c5fd}.flyingWord.cut{opacity:.15;transform:scale(.92)}.flyingWord.wrong{border-color:#f87171;background:#3a151b;color:#fecaca}.tip{text-align:center;color:#9fc6e5;font-size:13px;padding:10px 2px 3px}.overlay{position:absolute;inset:0;background:#020617ef;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;border-radius:22px}.overlay.show{display:flex}.card{max-width:420px}.card h2{font-size:31px;margin-bottom:10px}.card p{line-height:1.75;color:#cbd5e1;margin-bottom:14px}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.resultGrid div{background:#10233a;border:1px solid #284866;border-radius:10px;padding:10px}.card button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:800;cursor:pointer}@media(max-width:520px){body{padding:8px}.hint .zh{font-size:23px}.hud{font-size:12px}.title b{font-size:15px}.stage{min-height:390px;gap:12px;padding:14px}.flyingWord{font-size:18px;min-height:72px;padding:12px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="back" id="backBtn">← 返回</button><div class="title"><b>忍者词汇 · Ninja Vocabulary</b><small id="bookLabel">Vocabulary Quiz</small></div><button class="restart" id="restartBtn">重来</button></div>
  <div class="hud"><div><small>LEVEL</small><span id="levelEl">1</span></div><div><small>SCORE</small><span id="scoreEl">0</span></div><div><small>PROGRESS</small><span id="progressEl">0 / 20</span></div><div><small>ACCURACY</small><span id="accuracyEl">100%</span></div></div>
  <div class="hint"><div class="label">砍掉正确的英文单词</div><div class="zh" id="zhHint">载入词汇中…</div><div class="ms" id="msHint"></div></div>
  <div id="statusLine" class="statusLine">不限时间 · 砍对 +10 · 砍错 -5 · 砍对后才进入下一题</div>
  <div class="stage" id="stage">
    <button class="flyingWord" id="w0"></button><button class="flyingWord" id="w1"></button><button class="flyingWord" id="w2"></button><button class="flyingWord" id="w3"></button>
    <div class="overlay" id="overlay"><div class="card"><h2 id="endTitle">LEVEL COMPLETE</h2><div id="endText"></div><button id="playAgain">再玩一次</button></div></div>
  </div>
  <div class="tip">没有时间限制。选错会扣分，但这一题不会消失；选对后才进入下一题。</div>
</div>
<script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const p=new URLSearchParams(location.search),file=p.get('file')||'MOE_UASA_English_Vocabulary_Book_1.html',LEVEL=Math.max(1,+(p.get('level')||1));
const bm=file.match(/Book_(\d+)/i),BOOK_NO=bm?+bm[1]:0,BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');
const sid=()=>localStorage.getItem('uasaStudentId')||'';
const overlay=document.getElementById('overlay'),zhHint=document.getElementById('zhHint'),msHint=document.getElementById('msHint'),statusLine=document.getElementById('statusLine'),scoreEl=document.getElementById('scoreEl'),progressEl=document.getElementById('progressEl'),accuracyEl=document.getElementById('accuracyEl'),levelEl=document.getElementById('levelEl');
const slots=[0,1,2,3].map(i=>document.getElementById('w'+i));
let fullPool=[],pool=[],CLOUD={total_xp:0,current_streak:0,best_streak:0,books_started:0,books_mastered:0};
let game={score:0,index:0,cleanCorrect:0,wrongCuts:0,target:null,targetMistake:false,over:false,order:[]};
const safe=v=>String(v==null?'':v);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hud(){scoreEl.textContent=game.score;progressEl.textContent=game.index+' / '+game.order.length;const attempted=game.index+(game.target?1:0),clean=game.cleanCorrect,acc=attempted?Math.round(clean/attempted*100):100;accuracyEl.textContent=acc+'%';levelEl.textContent=LEVEL}
function status(msg,type=''){statusLine.textContent=msg;statusLine.className='statusLine '+type}
function targetKey(){return `B${BOOK_NO}|L${LEVEL}|Q${game.index+1}|${safe(game.target?.en)}`}
async function track(event_type,extra={}){if(!sid())return;try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,quiz_mode:'Ninja Level '+LEVEL,...extra})})}catch(e){}}
async function loadCloud(){if(!sid())return;try{const d=await(await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid()))).json();CLOUD=Object.assign(CLOUD,d.progress||{})}catch(e){}}
function makeChoices(){const distractors=shuffle(pool.filter(x=>safe(x.en)!==safe(game.target.en))).slice(0,3);const choices=shuffle([game.target,...distractors]);while(choices.length<4)choices.push(game.target);return choices}
function showTarget(){if(game.index>=game.order.length){endGame();return}game.target=game.order[game.index];game.targetMistake=false;zhHint.textContent=safe(game.target.zh||game.target.ms||game.target.en);msHint.textContent=game.target.ms?'Bahasa Melayu: '+game.target.ms:'';const choices=makeChoices();slots.forEach((s,i)=>{const w=choices[i];s.textContent=safe(w.en);s.dataset.en=safe(w.en);s.dataset.correct=safe(w.en)===safe(game.target.en)?'1':'0';s.disabled=false;s.className='flyingWord'});status('请选择正确英文。没有时间限制。','');hud()}
async function resolveCorrect(selected){const t=game.target,key=targetKey(),clean=!game.targetMistake;if(clean)game.cleanCorrect++;await track('answer',{question_key:key,question_text:safe(t.zh||t.ms||t.en),answer_text:selected,is_correct:clean});game.index++;game.target=null;hud();if(game.index>=game.order.length){endGame();return}setTimeout(showTarget,450)}
function cutSlot(s){if(game.over||!game.target||s.disabled)return;const selected=s.dataset.en,correct=s.dataset.correct==='1';if(correct){slots.forEach(x=>x.disabled=true);s.classList.add('cut');game.score+=10;status(game.targetMistake?'正确！+10。本题曾经选错，已记录为需复习。':'正确！+10，进入下一题。','good');hud();resolveCorrect(selected)}else{game.score-=5;game.wrongCuts++;game.targetMistake=true;s.classList.add('wrong');s.disabled=true;status('选错 '+selected+'，-5。继续同一题，直到选对。','bad');hud();track('ninja_wrong_cut',{question_key:targetKey(),question_text:safe(game.target.zh||game.target.ms||game.target.en),answer_text:selected,is_correct:false})}}
slots.forEach(s=>{s.addEventListener('click',e=>{e.preventDefault();cutSlot(s)});s.addEventListener('touchstart',e=>{e.preventDefault();cutSlot(s)},{passive:false})});
async function endGame(){if(game.over)return;game.over=true;const total=game.order.length,accuracy=Math.round(game.cleanCorrect/Math.max(1,total)*100),mastered=accuracy>=80;const result={book_no:BOOK_NO,level:LEVEL,total,correct:game.cleanCorrect,wrong_cuts:game.wrongCuts,score:game.score,accuracy,mastered,finished_at:new Date().toISOString()};try{localStorage.setItem('ninjaLevelResult:'+sid()+':'+BOOK_NO+':'+LEVEL,JSON.stringify(result))}catch(e){}if(sid()){try{await fetch(API+'/api/progress/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),total_xp:+CLOUD.total_xp||0,current_streak:+CLOUD.current_streak||0,best_streak:+CLOUD.best_streak||0,books_started:+CLOUD.books_started||0,books_mastered:+CLOUD.books_mastered||0,book_no:BOOK_NO,level_no:LEVEL,mastery:accuracy,attempts:total,correct:game.cleanCorrect,unlocked:true,mastered})})}catch(e){}await track('ninja_level_complete',{question_key:`B${BOOK_NO}|L${LEVEL}|SUMMARY`,question_text:'Ninja Level '+LEVEL,answer_text:`Score ${game.score}; clean ${game.cleanCorrect}/${total}; wrong cuts ${game.wrongCuts}`,is_correct:mastered})}document.getElementById('endTitle').textContent=mastered?'LEVEL MASTERED!':'LEVEL COMPLETE';document.getElementById('endText').innerHTML=`<div class="resultGrid"><div><b>${game.score}</b><br>Score</div><div><b>${accuracy}%</b><br>Accuracy</div><div><b>${game.cleanCorrect} / ${total}</b><br>First-try Correct</div><div><b>${game.wrongCuts}</b><br>Wrong Cuts</div></div><p>${mastered?'达到 80% Mastery，Level 记录已保存。':'未达到 80%，建议重新挑战这一 Level。'}</p>`;overlay.classList.add('show')}
function reset(){overlay.classList.remove('show');game={score:0,index:0,cleanCorrect:0,wrongCuts:0,target:null,targetMistake:false,over:false,order:shuffle(pool)};hud();showTarget();track('ninja_level_start',{question_key:`B${BOOK_NO}|L${LEVEL}|START`,question_text:'Ninja Level '+LEVEL,answer_text:pool.map(x=>x.en).join(', '),is_correct:true})}
async function load(){try{await loadCloud();let saved=sessionStorage.getItem('ninjaVocabPool'),source=sessionStorage.getItem('ninjaVocabSource');if(saved&&(!source||source===file))fullPool=JSON.parse(saved);if(!Array.isArray(fullPool)||fullPool.length<4){const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+WORDS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('WORDS not found');fullPool=Function('return '+m[1])()}fullPool=fullPool.map(w=>({en:w.en||w.word||'',zh:w.zh||'',ms:w.ms||''})).filter(w=>w.en&&(w.zh||w.ms));if(!fullPool.length)throw Error('empty pool');const start=(LEVEL-1)*20;pool=fullPool.slice(start,start+20);if(pool.length<4)pool=shuffle(fullPool).slice(0,Math.min(20,fullPool.length));document.getElementById('bookLabel').textContent=`Level ${LEVEL} · ${pool.length} Words · Meaning Quiz`;reset()}catch(e){zhHint.textContent='无法读取词汇';msHint.textContent='请返回 Vocabulary Book 后再进入 Meaning Quiz';status('词汇载入失败','bad');console.error(e)}}
document.getElementById('restartBtn').onclick=reset;document.getElementById('playAgain').onclick=reset;document.getElementById('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href=file};load();
</script>
</body>
</html>
