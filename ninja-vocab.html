<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ninja Vocabulary Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{min-height:100vh;background:#07111f;color:#fff;font-family:Arial,"Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:16px;overflow:auto}.wrap{width:min(100%,560px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.restart{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#163a5f;color:#fff}.restart{background:#ef4444;color:#fff}.title{text-align:center;flex:1}.title b{display:block;font-size:18px}.title small{color:#9fc6e5}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.hud div{background:#10233a;border:1px solid #284866;border-radius:13px;padding:10px;text-align:center;font-weight:800}.hint{background:linear-gradient(135deg,#14263e,#1d3555);border:1px solid #31587c;border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}.hint .label{font-size:12px;color:#9fc6e5}.hint .zh{font-size:28px;font-weight:900;color:#fde047;margin:5px 0}.hint .ms{font-size:14px;color:#bfdbfe}.stage{position:relative;background:radial-gradient(circle at 50% 15%,#173455,#07111f 70%);border:1px solid #294966;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 70px #0008}.stage canvas{width:100%;height:auto;display:block;aspect-ratio:500/700;touch-action:none;cursor:crosshair}.tip{text-align:center;color:#9fc6e5;font-size:13px;padding:10px 2px 3px}.overlay{position:absolute;inset:0;background:#020617dd;display:none;align-items:center;justify-content:center;text-align:center;padding:26px}.overlay.show{display:flex}.card{max-width:360px}.card h2{font-size:34px;margin-bottom:10px}.card p{line-height:1.6;color:#cbd5e1;margin-bottom:14px}.card button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:800;cursor:pointer}@media(max-width:520px){body{padding:8px}.hint .zh{font-size:23px}.hud{font-size:13px}.top{align-items:flex-start}.title b{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" id="backBtn">← 返回</button>
    <div class="title"><b>忍者词汇 · Ninja Vocabulary</b><small id="bookLabel">Vocabulary Quiz</small></div>
    <button class="restart" id="restartBtn">重来</button>
  </div>
  <div class="hud">
    <div>❤️ <span id="lives">3</span></div>
    <div>⚡ <span id="score">0</span></div>
    <div>🎯 <span id="round">0</span></div>
  </div>
  <div class="hint"><div class="label">砍掉正确的英文单词</div><div class="zh" id="zhHint">载入词汇中…</div><div class="ms" id="msHint"></div></div>
  <div class="stage">
    <canvas id="game" width="500" height="700"></canvas>
    <div class="overlay" id="overlay"><div class="card"><h2 id="endTitle">GAME OVER</h2><p id="endText"></p><button id="playAgain">再玩一次</button></div></div>
  </div>
  <div class="tip">电脑：点击或按住鼠标划过单词 · 手机：手指滑砍</div>
</div>
<script>
const p=new URLSearchParams(location.search);
const file=p.get('file')||'MOE_UASA_English_Vocabulary_Book_1.html';
const level=Math.max(1,Number(p.get('level')||1));
const LEVEL_SIZE=20;
const sourceUrl=file;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),roundEl=document.getElementById('round');
const zhHint=document.getElementById('zhHint'),msHint=document.getElementById('msHint'),overlay=document.getElementById('overlay');
let words=[],pool=[],game={score:0,lives:3,round:0,items:[],trails:[],spawnTimer:0,spawnInterval:52,target:null,over:false,lastTs:0};
function safeText(v){return String(v==null?'':v)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function updateHud(){livesEl.textContent=game.lives;scoreEl.textContent=game.score;roundEl.textContent=game.round}
function chooseTarget(){if(!pool.length)return;game.target=pool[Math.floor(Math.random()*pool.length)];zhHint.textContent=safeText(game.target.zh||game.target.ms||game.target.en);msHint.textContent=game.target.ms?'Bahasa Melayu: '+game.target.ms:'';game.round++;updateHud()}
function reset(){game={score:0,lives:3,round:0,items:[],trails:[],spawnTimer:0,spawnInterval:52,target:null,over:false,lastTs:0};overlay.classList.remove('show');chooseTarget();updateHud()}
function spawn(){if(game.over||!game.target||!pool.length)return;let obj;if(Math.random()<.58)obj=game.target;else{const others=pool.filter(w=>w!==game.target);obj=others[Math.floor(Math.random()*others.length)]||game.target}const size=Math.max(19,Math.min(30,30-safeText(obj.en).length*.45));game.items.push({obj,x:65+Math.random()*(canvas.width-130),y:canvas.height+35,vx:(Math.random()-.5)*2.6,vy:-6.2-Math.random()*3.8,r:Math.max(42,Math.min(78,26+safeText(obj.en).length*3.7)),font:size,rot:(Math.random()-.5)*.08,rotSpeed:(Math.random()-.5)*.025,target:obj===game.target})}
function particles(x,y,color){for(let i=0;i<12;i++)game.trails.push({x:x+(Math.random()-.5)*48,y:y+(Math.random()-.5)*48,life:10+Math.random()*8,color,particle:true})}
function slash(cx,cy){if(game.over)return;const rect=canvas.getBoundingClientRect(),x=(cx-rect.left)*canvas.width/rect.width,y=(cy-rect.top)*canvas.height/rect.height;game.trails.push({x,y,life:12});for(let i=game.items.length-1;i>=0;i--){const it=game.items[i];if(Math.hypot(x-it.x,y-it.y)<it.r+14){if(it.target){game.score+=10;particles(it.x,it.y,'#fde047');game.items.splice(i,1);chooseTarget();game.spawnInterval=Math.max(24,52-Math.floor(game.score/70));}else{game.lives--;particles(it.x,it.y,'#fb7185');game.items.splice(i,1);updateHud();if(game.lives<=0)endGame();}break}}}
function endGame(){game.over=true;document.getElementById('endTitle').textContent='挑战结束';document.getElementById('endText').textContent=`得分 ${game.score} 分 · 完成 ${Math.max(0,game.round-1)} 个目标词汇`;overlay.classList.add('show');saveResult()}
function saveResult(){try{const key='ninjaVocabBest:'+file+':'+level;const old=Number(localStorage.getItem(key)||0);if(game.score>old)localStorage.setItem(key,String(game.score));window.parent?.postMessage({type:'ninja-vocab-complete',file,level,score:game.score,round:game.round-1},'*')}catch(e){}}
function update(){if(game.over)return;game.spawnTimer++;if(game.spawnTimer>=game.spawnInterval){game.spawnTimer=0;spawn()}for(let i=game.items.length-1;i>=0;i--){const it=game.items[i];it.x+=it.vx;it.y+=it.vy;it.vy+=.075;it.rot+=it.rotSpeed;if(it.x<30||it.x>canvas.width-30)it.vx*=-.85;if(it.y>canvas.height+80){if(it.target){game.lives--;updateHud();if(game.lives<=0){endGame();break}else chooseTarget()}game.items.splice(i,1)}}for(let i=game.trails.length-1;i>=0;i--){game.trails[i].life--;if(game.trails[i].life<=0)game.trails.splice(i,1)}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}for(const it of game.items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);const g=ctx.createRadialGradient(0,0,8,0,0,it.r+14);g.addColorStop(0,it.target?'#3b2f09':'#132b43');g.addColorStop(1,'#07111f00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,it.r+14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=it.target?22:12;ctx.shadowColor=it.target?'#fde047':'#7dd3fc';ctx.fillStyle=it.target?'#2b250f':'#10263a';ctx.beginPath();ctx.roundRect(-it.r,-34,it.r*2,68,22);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=it.target?'#fde047':'#60a5fa';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=it.target?'#fde047':'#e0f2fe';ctx.font=`800 ${it.font}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.obj.en,0,2);ctx.restore()}for(const t of game.trails){const a=Math.max(0,t.life/12);ctx.globalAlpha=a;if(t.particle){ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,4+4*a,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle='#fff';ctx.lineWidth=3+5*a;ctx.shadowBlur=18;ctx.shadowColor='#bae6fd';ctx.beginPath();ctx.arc(t.x,t.y,18,0,Math.PI*1.3);ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1}}
function loop(){update();draw();requestAnimationFrame(loop)}
async function loadWords(){try{const html=await fetch(sourceUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load');return r.text()});const m=html.match(/const\s+WORDS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw new Error('WORDS not found');words=Function('return '+m[1])().filter(w=>w&&w.en&&(w.zh||w.ms));const start=(level-1)*LEVEL_SIZE;pool=words.slice(start,start+LEVEL_SIZE);if(pool.length<4)pool=words.slice(0,Math.min(LEVEL_SIZE,words.length));document.getElementById('bookLabel').textContent=`Level ${level} · Words ${start+1}-${Math.min(start+LEVEL_SIZE,words.length)}`;reset()}catch(e){zhHint.textContent='无法读取词汇';msHint.textContent='请从 Vocabulary Book 的 Quiz 按钮进入';console.error(e)}}
document.getElementById('restartBtn').onclick=reset;document.getElementById('playAgain').onclick=reset;document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href='reader.html?file='+encodeURIComponent(file);
canvas.addEventListener('mousedown',e=>{e.preventDefault();slash(e.clientX,e.clientY)});canvas.addEventListener('mousemove',e=>{if(e.buttons===1){e.preventDefault();slash(e.clientX,e.clientY)}});canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];if(t)slash(t.clientX,t.clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(t)slash(t.clientX,t.clientY)},{passive:false});
loadWords();loop();
</script>
</body>
</html>
