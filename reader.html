<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOE UASA English Reader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#071522}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:linear-gradient(90deg,#081a2c,#12375b);border-bottom:1px solid #2e5778;color:white}.home,.dash{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:white;background:#1b5f96;border:1px solid #6fc8e5;padding:10px 14px;border-radius:11px;font-weight:800}.links{display:flex;gap:8px}.title{font-size:14px;color:#c9deef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{width:100%;height:calc(100% - 58px);border:0;background:white}@media(max-width:600px){.bar{height:54px}.frame{height:calc(100% - 54px)}.title{display:none}.dash{display:none}}
</style>
</head>
<body>
<div class="bar"><div class="links"><a class="home" href="index.html">← Home</a><a class="dash" href="student-dashboard.html">Dashboard</a></div><div class="title" id="label">MOE UASA English Learning Module</div></div>
<iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>
<script>
const params=new URLSearchParams(location.search);const file=params.get('file')||'';
const allowed=/^[A-Za-z0-9_().%\-]+\.html$/;
const frame=document.getElementById('frame');
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
localStorage.setItem('uasaApiBase',API);
const studentId=()=>localStorage.getItem('uasaStudentId')||'';
const bookMatch=file.match(/Book_(\d+)/i);const BOOK_NO=bookMatch?Number(bookMatch[1]):0;
const BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');
async function track(event_type,extra={}){const sid=studentId();if(!sid||!BOOK_NO)return;const payload={student_id:sid,book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,...extra};try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){}}
if(!allowed.test(file)||file==='index.html'||file==='reader.html'){document.getElementById('label').textContent='Invalid module';frame.srcdoc='<h2 style="font-family:Arial;padding:30px">Invalid learning module.</h2>';}else{frame.src=file;document.getElementById('label').textContent=BOOK_TITLE;}
frame.addEventListener('load',()=>{
 track('book_open');
 try{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(typeof w.startQuiz==='function'&&typeof w.WORDS!=='undefined'){
   const originalStartQuiz=w.startQuiz;
   w.startQuiz=function(mode){
    if(mode==='meaning'){
     let pool=(typeof w.getFiltered==='function')?w.getFiltered():w.WORDS;
     if(!pool||!pool.length)pool=w.WORDS;
     try{sessionStorage.setItem('ninjaVocabPool',JSON.stringify(pool));sessionStorage.setItem('ninjaVocabSource',file);}catch(e){}
     location.href='ninja-vocab.html?file='+encodeURIComponent(file)+'&mode=meaning';return;
    }
    return originalStartQuiz.apply(this,arguments);
   };
  }
 }catch(err){console.warn('Quiz bridge could not be attached.',err);}
});
</script>
</body></html>
