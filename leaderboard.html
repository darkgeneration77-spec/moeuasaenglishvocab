<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UASA Social Leaderboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;color:#fff;background:#1b5f96;border:1px solid #6fc8e5;padding:10px 13px;border-radius:10px;font-weight:900}.hero{margin-top:18px;padding:20px;border:1px solid #3d6487;border-radius:18px;background:linear-gradient(135deg,#10243b,#231b45)}.heroGrid{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center}.avatar{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:1000;background:#173b5d;border:4px solid #7dd3fc}.name{font-size:25px;font-weight:1000}.title{color:#fde68a;font-weight:900;margin-top:4px}.muted{color:#9db4cc;font-size:13px}.rankBig{font-size:33px;font-weight:1000;color:#fde68a;text-align:right}.card{margin-top:14px;background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:14px}.row{display:grid;grid-template-columns:55px 62px 1fr auto;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid #294b6d}.row:last-child{border:0}.row.me{background:#173b5d;border-radius:12px;color:#fde68a}.miniAvatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#17314b;border:3px solid #6fc8e5;font-size:22px;font-weight:1000}.rank{font-size:20px;font-weight:1000}.playerName{font-size:17px;font-weight:900}.playerTitle{color:#f8c65c;font-size:12px;margin-top:3px}.xp{font-size:17px;font-weight:1000;text-align:right}.coins{color:#fde68a;font-size:12px;margin-top:3px}.rival{border-color:#c99b43;background:#211c10}.rival h2{color:#fde68a}.gap{font-size:22px;font-weight:1000}.bar{height:10px;background:#17314b;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#38bdf8,#facc15)}.status{margin-top:12px;color:#86efac;font-weight:800}@media(max-width:650px){.heroGrid{grid-template-columns:70px 1fr}.rankBig{grid-column:1/-1;text-align:left}.row{grid-template-columns:40px 50px 1fr}.xp{grid-column:3;text-align:left}.avatar{width:62px;height:62px}.miniAvatar{width:44px;height:44px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Social Leaderboard</h1><div class="muted">Avatar · Title · Rival · XP</div></div><div><a class="btn" href="index.html">Home</a> <a class="btn" href="shop.html">Shop</a> <a class="btn" href="student-dashboard.html">Dashboard</a></div></div><div id="hero" class="hero"><div class="muted">Loading your player card…</div></div><div id="rivalCard" class="card rival" style="display:none"></div><div class="card"><h2>Near-Me Leaderboard</h2><div id="list" class="muted">Loading nearby players…</div></div><div id="status" class="status"></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const sid=localStorage.getItem('uasaStudentId')||'';const ICONS={'rookie-blue':'A','fox-orange':'F','owl-purple':'O','tiger-gold':'T','dragon-red':'D','crown-black':'K'};if(!sid)location.replace('index.html?login=1');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function icon(k){return ICONS[k]||'A'}async function game(id){try{const r=await fetch(API+'/api/game/profile?student_id='+encodeURIComponent(id));if(!r.ok)return null;const d=await r.json();return d.profile||null}catch(e){return null}}async function load(){try{const r=await fetch(API+'/api/leaderboard?student_id='+encodeURIComponent(sid));if(!r.ok)throw new Error('Leaderboard API error');const d=await r.json();const players=d.near_me||d.leaderboard||[];const enriched=await Promise.all(players.map(async p=>({...p,game:await game(p.id)})));const me=enriched.find(x=>x.is_me)||enriched.find(x=>String(x.id)===sid)||d.me;let myGame=me?.game||await game(sid);hero.innerHTML=`<div class="heroGrid"><div class="avatar">${icon(myGame?.equipped_avatar)}</div><div><div class="name">${esc(me?.name||localStorage.getItem('uasaStudentName')||'Student')}</div><div class="title">${esc(myGame?.equipped_title||'Vocabulary Rookie')}</div><div class="muted">${Number(me?.total_xp||0)} XP · ${Number(myGame?.coins||0)} Coins · Best Streak ${Number(me?.best_streak||0)}</div></div><div class="rankBig">#${Number(d.my_rank||0)||'?'}</div></div>`;list.innerHTML=enriched.length?enriched.map(p=>{const g=p.game||{};return `<div class="row ${p.is_me?'me':''}"><div class="rank">#${p.rank}</div><div class="miniAvatar">${icon(g.equipped_avatar)}</div><div><div class="playerName">${p.is_me?'YOU':esc(p.name||'Student')}</div><div class="playerTitle">${esc(g.equipped_title||'Vocabulary Rookie')}</div><div class="coins">${Number(g.coins||0)} Coins</div></div><div class="xp">${Number(p.total_xp||0)} XP</div></div>`}).join(''):'No ranking data yet.';if(d.rival){const rg=await game(d.rival.id),gap=Number(d.rival.total_xp||0)-Number(d.me?.total_xp||0);rivalCard.style.display='block';rivalCard.innerHTML=`<h2>Your Rival</h2><div style="display:flex;align-items:center;gap:14px"><div class="miniAvatar">${icon(rg?.equipped_avatar)}</div><div style="flex:1"><div class="playerName">${esc(d.rival.name||'Rival')}</div><div class="playerTitle">${esc(rg?.equipped_title||'Vocabulary Rookie')}</div><div class="gap">${Math.abs(gap)} XP ${gap>=0?'ahead of you':'behind you'}</div><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(8,Number(d.me?.total_xp||0)/Math.max(Number(d.rival.total_xp||0),Number(d.me?.total_xp||0),1)*100))}%"></div></div></div></div>`}status.textContent='V2.9 Social Identity synced ✓'}catch(e){status.textContent='Unable to load social leaderboard: '+e.message;status.style.color='#fca5a5'}}load();</script></body></html>
