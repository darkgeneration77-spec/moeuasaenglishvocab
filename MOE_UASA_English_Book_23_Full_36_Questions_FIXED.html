 Eating Article", "type": "Article", "level": "B1", "text": "Healthy eating does not mean avoiding all snacks. It means choosing food wisely and controlling portions. Fruit, yoghurt and nuts are better choices than sweets and fried food. Drinking enough water is also important because it helps the body function well.", "questions": [{"q": "What does healthy eating mean?", "options": ["Choosing food wisely and controlling portions", "Never eating snacks", "Eating only fruit", "Avoiding water"], "answer": "Choosing food wisely and controlling portions", "explain": "文章直接定义健康饮食是明智选择食物并控制份量。"}, {"q": "Which is a better snack choice?", "options": ["Yoghurt", "Fried food", "Sweets", "Sugary drinks"], "answer": "Yoghurt", "explain": "Yoghurt 被列为较健康的选择。"}, {"q": "Why is water important?", "options": ["It helps the body function well", "It makes food sweeter", "It replaces sleep", "It prevents exercise"], "answer": "It helps the body function well", "explain": "最后一句说明水帮助身体正常运作。"}]}, {"title": "9. Community Clean-up", "type": "News Report", "level": "B1", "text": "More than fifty residents joined a community clean-up last weekend. They collected rubbish, cleared drains and planted flowers near the playground. The activity improved the area and encouraged neighbours to work together. The organiser hopes to make it a monthly event.", "questions": [{"q": "How many residents joined?", "options": ["More than fifty", "Exactly twenty", "Less than ten", "One hundred"], "answer": "More than fifty", "explain": "报道说明超过50名居民参加。"}, {"q": "What did the activity encourage?", "options": ["Neighbours to work together", "Residents to move away", "Children to stay indoors", "People to stop gardening"], "answer": "Neighbours to work together", "explain": "活动鼓励邻居一起合作。"}, {"q": "What may happen next?", "options": ["The event may be held monthly", "The playground will close", "No one will join again", "The drains will be covered"], "answer": "The event may be held monthly", "explain": "主办者希望把活动变成每月一 . Drinking enough water is also important because it helps the body function well.", "q": "Which is a better snack choice?", "options": ["Yoghurt", "Fried food", "Sweets", "Sugary drinks"], "answer": "Yoghurt", "explain": "Yoghurt 被列为较健康的选择。"}, {"id": 24, "setIndex": 7, "setTitle": "8. Healthy Eating Article", "type": "Article", "level": "B1", "text": "Healthy eating does not mean avoiding all snacks. It means choosing food wisely and controlling portions. Fruit, yoghurt and nuts are better choices than sweets and fried food. Drinking enough water is also important because it helps the body function well.", "q": "Why is water important?", "options": ["It helps the body function well", "It makes food sweeter", "It replaces sleep", "It prevents exercise"], "answer": "It helps the body function well", "explain": "最后一句说明水帮助身体正常运作。"}, {"id": 25, "setIndex": 8, "setTitle": "9. Community Clean-up", "type": "News Report", "level": "B1", "text": "More than fifty residents joined a community clean-up last weekend. They collected rubbish, cleared drains and planted flowers near the playground. The activity improved the area and encouraged neighbours to work together. The organiser hopes to make it a monthly event.", "q": "How many residents joined?", "options": ["More than fifty", "Exactly twenty", "Less than ten", "One hundred"], "answer": "More than fifty", "explain": "报道说明超过50名居民参加。"}, {"id": 26, "setIndex": 8, "setTitle": "9. Community Clean-up", "type": "News Report", "level": "B1", "text": "More than fifty residents joined a community clean-up last weekend. They collected rubbish, cleared drains and planted flowers near the playground. The activity improved the area and encouraged neighbours to work together. The organiser hopes to make it a monthly event.", "q": "What did the activity encourage?", "options": ["Neighbours to work together", "Residents to move away", "Children to stay indoors", "People to stop gardening"], "answer": "Neighbours to work together", "explain": "活动鼓励邻居一起合作。"}, {"id": 27, "setIndex": 8, "setTitle": "9. Community Clean-up", "type": "News Report", "level": "B1", "text": "More than fifty residents joined a community clean-up last weekend. They collected rubbish, cleared drains and planted flowers near the playground. The activity improved the area and encouraged neighbours to work together. The organiser hopes to make it a monthly event.", "q": "What may happen next?", "options": ["The event may be held monthly", "The playground will close", "No one will join again", "The drains will be covered"], "answer": "The event may be held monthly", "explain": "主办者希望把活动变成每月一次。"}, {"id": 28, "setIndex": 9, "setTitle": "10. Bookshop Advertisement", "type": "Advertisement", "level": "B1", "text": "BACK-TO-SCHOOL SALE\n20% off exercise books and stationery\nBuy two storybooks and get one free\nFree reusable bag for purchases above RM50\nSale ends 31 December", "q": "What items have a 20% discount?", "options": ["Exercise books and stationery", "School uniforms", "Shoes", "Lunch boxes"], "answer": "Exercise books and stationery", "explain": "广告直接说明练习簿和文具有20%折扣。"}, {"id": 29, "setIndex": 9, "setTitle": "10. Bookshop Advertisement", "type": "Advertisement", "level": "B1", "text": "BACK-TO-SCHOOL SALE\n20% off exercise books and stationery\nBuy two storybooks and get one free\nFree reusable bag for purchases above RM50\nSale ends 31 December", "q": "How can a customer get a free storybook?", "options": ["Buy two storybooks", "Spend RM50", "Buy stationery", "Visit on 31 December"], "answer": "Buy two storybooks", "explain": "买两本故事书可免费获得一本。"}, {"id": 30, "setIndex": 9, "setTitle": "10. Bookshop Advertisement", "type": "Advertisement", "level": "B1", "text": "BACK-TO-SCHOOL SALE\n20% off exercise books and stationery\nBuy two storybooks and get one free\nFree reusable bag for purchases above RM50\nSale ends 31 December", "q": "What is needed to receive a reusable bag?", "options": ["Spend above RM50", "Buy one book", "Visit before school", "Use cash only"], "answer": "Spend above RM50", "explain": "消费超过RM50可获得环保袋。"}, {"id": 31, "setIndex": 10, "setTitle": "11. Science Fair Schedule", "type": "Schedule", "level": "B1", "text": "SCIENCE FAIR\n8.30 a.m. Opening Ceremony\n9.00 a.m. Experiment Demonstration\n10.30 a.m. Robotics Show\n12.00 p.m. Lunch Break\n1.30 p.m. Quiz Competition\n3.00 p.m. Prize-Giving Ceremony", "q": "What happens before the Robotics Show?", "options": ["Experiment Demonstration", "Lunch Break", "Quiz Competition", "Prize-Giving Ceremony"], "answer": "Experiment Demonstration", "explain": "9.00 a.m. 的 Experiment Demonstration 在 Robotics Show 之前。"}, {"id": 32, "setIndex": 10, "setTitle": "11. Science Fair Schedule", "type": "Schedule", "level": "B1", "text": "SCIENCE FAIR\n8.30 a.m. Opening Ceremony\n9.00 a.m. Experiment Demonstration\n10.30 a.m. Robotics Show\n12.00 p.m. Lunch Break\n1.30 p.m. Quiz Competition\n3.00 p.m. Prize-Giving Ceremony", "q": "What starts at 1.30 p.m.?", "options": ["Quiz Competition", "Lunch Break", "Opening Ceremony", "Robotics Show"], "answer": "Quiz Competition", "explain": "时间表显示1.30 p.m. 是 Quiz Competition。"}, {"id": 33, "setIndex": 10, "setTitle": "11. Science Fair Schedule", "type": "Schedule", "level": "B1", "text": "SCIENCE FAIR\n8.30 a.m. Opening Ceremony\n9.00 a.m. Experiment Demonstration\n10.30 a.m. Robotics Show\n12.00 p.m. Lunch Break\n1.30 p.m. Quiz Competition\n3.00 p.m. Prize-Giving Ceremony", "q": "How long after lunch does the quiz begin?", "options": ["One and a half hours", "Thirty minutes", "Two hours", "Three hours"], "answer": "One and a half hours", "explain": "午餐12时开始，问答比赛1时30分开始，相隔1小时30分钟。"}, {"id": 34, "setIndex": 11, "setTitle": "12. The Responsible Prefect", "type": "Story", "level": "B1", "text": "Nadia noticed that several pupils were running along the corridor during recess. Instead of shouting, she calmly reminded them about the safety rules. She then guided them back to the playground. Her teacher praised her for handling the situation responsibly.", "q": "How did Nadia respond?", "options": ["She calmly reminded the pupils", "She shouted angrily", "She ignored them", "She called their parents"], "answer": "She calmly reminded the pupils", "explain": "Nadia 冷静地提醒学生遵守安全规则。"}, {"id": 35, "setIndex": 11, "setTitle": "12. The Responsible Prefect", "type": "Story", "level": "B1", "text": "Nadia noticed that several pupils were running along the corridor during recess. Instead of shouting, she calmly reminded them about the safety rules. She then guided them back to the playground. Her teacher praised her for handling the situation responsibly.", "q": "Why did the teacher praise Nadia?", "options": ["She handled the situation responsibly", "She ran quickly", "She left the corridor", "She won a prize"], "answer": "She handled the situation responsibly", "explain": "老师称赞她负责任地处理情况。"}, {"id": 36, "setIndex": 11, "setTitle": "12. The Responsible Prefect", "type": "Story", "level": "B1", "text": "Nadia noticed that several pupils were running along the corridor during recess. Instead of shouting, she calmly reminded them about the safety rules. She then guided them back to the playground. Her teacher praised her for handling the situation responsibly.", "q": "Which quality best describes Nadia?", "options": ["Responsible", "Careless", "Impatient", "Dishonest"], "answer": "Responsible", "explain": "她冷静并重视安全，因此最适合的品质是 Responsible。"}];
const TYPES=[...new Set(SETS.map(s=>s.type))];
let progress=JSON.parse(localStorage.getItem("uasa23fullProgress")||'{"done":[],"correct":[],"wrong":[]}');
questionCount.textContent=QUESTIONS.length;
TYPES.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;typeFilter.appendChild(o)});
function save(){localStorage.setItem("uasa23fullProgress",JSON.stringify(progress))}
function render(){
 const lv=levelFilter.value,tp=typeFilter.value;content.innerHTML="";
 SETS.forEach((s,i)=>{
   if(lv&&s.level!==lv)return;if(tp&&s.type!==tp)return;
   const sec=document.createElement("section");sec.className="set";
   sec.innerHTML=`<span class="badge">${s.level}</span><span class="badge">${s.type}</span><h2>${s.title}</h2><div class="text">${s.text}</div>`;
   QUESTIONS.filter(q=>q.setIndex===i).forEach(q=>{
     const number=QUESTIONS.indexOf(q)+1;
     const card=document.createElement("div");card.className="question";
     card.innerHTML=`<h3>Q${number}. ${q.q}</h3><div class="choices"></div><div class="explain"></div>`;
     const box=card.querySelector(".choices");
     q.options.forEach((opt,idx)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+idx)+". "+opt;b.onclick=()=>answer(q,b,opt,card);box.appendChild(b)});
     sec.appendChild(card)
   });
   content.appendChild(sec)
 });
 renderStats()
}
function answer(q,btn,val,card){
 if(card.dataset.answered==="1")return;card.dataset.answered="1";
 card.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.answer)b.classList.add("correct")});
 const ok=val===q.answer;if(!ok)btn.classList.add("wrong");
 if(!progress.done.includes(q.id))progress.done.push(q.id);
 if(ok){if(!progress.correct.includes(q.id))progress.correct.push(q.id);progress.wrong=progress.wrong.filter(id=>id!==q.id)}
 else{progress.correct=progress.correct.filter(id=>id!==q.id);if(!progress.wrong.includes(q.id))progress.wrong.push(q.id)}
 const ex=card.querySelector(".explain");ex.style.display="block";ex.innerHTML=`<b>${ok?"Correct! 答对了。":"Incorrect. 答错了。"}</b><br>Correct answer: ${q.answer}<br>${q.explain}`;
 save();renderStats()
}
function renderStats(){
 const done=progress.done.length,correct=progress.correct.length,wrong=progress.wrong.length,pct=done?Math.round(correct/done*100):0;
 doneCount.textContent=done;wrongCount.textContent=wrong;accuracy.textContent=pct+"%";overall.style.width=Math.round(done/QUESTIONS.length*100)+"%";
 progressText.textContent=`${done}/${QUESTIONS.length} completed · ${correct} correct · ${wrong} wrong`;
 const arr=QUESTIONS.filter(q=>progress.wrong.includes(q.id));
 wrongList.innerHTML=arr.length?arr.map(q=>`<div class="wrongitem"><b>${q.setTitle}</b><br>${q.q}<br><small>Answer: ${q.answer}<br>${q.explain}</small></div>`).join(""):"<p>No wrong answers yet.</p>"
}
function showAll(){levelFilter.value="";typeFilter.value="";render()}
function showWrongOnly(){
 const arr=QUESTIONS.filter(q=>progress.wrong.includes(q.id));content.innerHTML="<section class='set'><h2>Wrong Book Practice</h2></section>";const sec=content.querySelector("section");
 arr.forEach(q=>{const card=document.createElement("div");card.className="question";card.innerHTML=`<div class="text">${q.text}</div><h3>${q.q}</h3><div class="choices"></div><div class="explain"></div>`;const box=card.querySelector(".choices");q.options.forEach((opt,idx)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+idx)+". "+opt;b.onclick=()=>answer(q,b,opt,card);box.appendChild(b)});sec.appendChild(card)})
}
function resetProgress(){progress={done:[],correct:[],wrong:[]};save();render()}
levelFilter.addEventListener("change",render);typeFilter.addEventListener("change",render);render();
</script></body></html>
