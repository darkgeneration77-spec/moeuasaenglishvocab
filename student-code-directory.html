<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Code Directory</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.btn,input{padding:11px 13px;border-radius:10px;border:1px solid #31516f}.btn{background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input{background:#081827;color:#fff}.row{display:grid;grid-template-columns:1.5fr 1fr 1.2fr .8fr;gap:10px;padding:12px 0;border-bottom:1px solid #294b6d;align-items:center}.head{font-weight:900;color:#9fdcff}.code{font-family:monospace;font-size:16px;color:#f8c65c;font-weight:900}.muted{color:#9db4cc}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.head{display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>Student Code Directory</h1><div class="muted">老师查看学生跨设备登录 Code</div></div><a class="btn" href="teacher-dashboard.html">返回 Teacher Dashboard</a></div><div class="card"><input id="key" type="password" placeholder="Teacher Key"><button class="btn" onclick="load()">Load Codes</button></div><div id="box" class="card"><div class="muted">输入 Teacher Key 读取。</div></div></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const k=key.value.trim();if(!k)return;const r=await fetch(API+'/api/teacher/students?key='+encodeURIComponent(k));const text=await r.text();if(!r.ok){box.innerHTML='<div style="color:#fca5a5">'+esc(text)+'</div>';return}const d=JSON.parse(text),arr=d.students||[];box.innerHTML=`<div class="row head"><div>Student</div><div>Class</div><div>Student Code</div><div>Copy</div></div>`+arr.map(x=>`<div class="row"><div><b>${esc(x.name)}</b></div><div>${esc(x.class_name||'')}</div><div class="code">${esc(x.student_code||'No code')}</div><div><button class="btn" ${x.student_code?'':'disabled'} onclick="navigator.clipboard.writeText('${String(x.student_code||'').replace(/'/g,"\\'")}')">Copy</button></div></div>`).join('')}key.addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
