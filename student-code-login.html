<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Code Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,"Noto Sans SC",sans-serif;background:radial-gradient(circle at top,#12385d,#06111f 55%,#02070d);color:#eef6ff}.card{width:min(480px,100%);background:#0d2237;border:1px solid #376182;border-radius:22px;padding:26px;box-shadow:0 30px 80px #0008}h1{margin:0 0 10px}.muted{color:#9db4cc;line-height:1.6}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #31577b;background:#081827;color:#fff;font-size:18px;text-transform:uppercase;margin:12px 0}.btn{width:100%;padding:13px;border-radius:12px;border:1px solid #72cde4;background:linear-gradient(90deg,#1d67a4,#2d8ea9);color:#fff;font-weight:900;cursor:pointer}.link{display:block;text-align:center;margin-top:12px;color:#b9eaff;text-decoration:none}.error{color:#fca5a5;min-height:22px;margin:8px 0}.good{color:#86efac}</style></head><body><div class="card"><h1>Student Code Login</h1><p class="muted">换电脑或同班有同名学生时，用 Student Code 精准恢复原来的学习进度。</p><input id="code" class="input" placeholder="例如 UASA-A1B2C3" autocomplete="off"><div id="msg" class="error"></div><button class="btn" onclick="login()">Restore My Progress 恢复学习进度</button><a class="link" href="index.html">← 使用姓名 + 班级登录</a></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';async function login(){const studentCode=code.value.trim().toUpperCase();if(!studentCode){msg.textContent='请输入 Student Code。';return}msg.className='error';msg.textContent='Checking…';try{const r=await fetch(API+'/api/student/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_code:studentCode})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Student Code not found';return}localStorage.setItem('uasaStudentId',d.id);localStorage.setItem('uasaStudentName',d.name);localStorage.setItem('uasaStudentClass',d.class_name||'');localStorage.setItem('uasaStudentCode',d.student_code||studentCode);sessionStorage.setItem('uasaCodeLogin','1');msg.className='good';msg.textContent='Progress restored ✓';setTimeout(()=>location.href='student-dashboard.html',350)}catch(e){msg.textContent='Connection error: '+e.message}}code.addEventListener('keydown',e=>{if(e.key==='Enter')login()});setTimeout(()=>code.focus(),100);</script></body></html>
