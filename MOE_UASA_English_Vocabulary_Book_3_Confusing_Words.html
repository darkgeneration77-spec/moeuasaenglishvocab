<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOE UASA English Vocabulary Book 3</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#bookFrame{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="bookFrame" src="MOE_UASA_English_Vocabulary_Book_3_Confusing_Words_original.html" allow="autoplay"></iframe>
<script>
(()=>{
const frame=document.getElementById('bookFrame');
const ORIGINAL='MOE_UASA_English_Vocabulary_Book_3_Confusing_Words_original.html';
function openBattle(){frame.src='book3-battle-arena.html?v=20260815-1515&file='+encodeURIComponent(ORIGINAL);return false}
function hook(){
 try{
  const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;
  const src=frame.getAttribute('src')||'';
  if(/book3-battle-arena\.html/i.test(src)){
    if(!d.getElementById('gameMusicLoader')){const s=d.createElement('script');s.id='gameMusicLoader';s.src='game-music.js?v=20260815-1452';d.head.appendChild(s)}
    return;
  }
  if(typeof w.startQuiz==='function')w.startQuiz=openBattle;
  d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const text=(b.textContent||'').trim(),oc=b.getAttribute('onclick')||'';if(/Start Quiz|开始辨析/i.test(text)||/startQuiz\s*\(/i.test(oc)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openBattle()}},true);
 }catch(e){}
}
frame.addEventListener('load',hook);
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;try{parent.postMessage(e.data,location.origin)}catch(err){}});
})();
</script>
</body></html>
