<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Book 3 Confusing Words Battle Arena V2</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#071522,#17355c);color:#fff}body{padding:8px;display:flex;justify-content:center}.game{width:min(100%,920px);background:#0e2943;border:1px solid #416d8b;border-radius:24px;padding:12px;box-shadow:0 20px 45px #0008}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer;background:#1b5f96;color:#fff}.btn.active{background:#f59e0b;color:#172033}.title{flex:1;text-align:center;min-width:260px}.title b{font-size:20px}.title small{display:block;color:#a9cee8}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}.score{border-radius:14px;padding:9px 12px;font-weight:900;background:#10253a;border:1px solid #31516f}.score.red{color:#fecaca}.score.blue{color:#bfdbfe;text-align:right}.left{font-weight:1000;color:#fde68a;background:#10253a;border:1px solid #31516f;padding:8px 14px;border-radius:999px}.question{background:#162b46;border:1px solid #31587c;border-radius:15px;padding:9px 12px;text-align:center}.question .type{font-size:11px;color:#9fc6e5;font-weight:900}.question .clue{font-size:18px;font-weight:900;margin-top:4px}.question .sub{font-size:12px;color:#bfdbfe;margin-top:4px}.status{min-height:24px;text-align:center;padding:4px;font-weight:900;color:#bfdbfe}.status.good{color:#86efac}.status.bad{color:#fca5a5}.arena{display:block;width:100%;height:auto;aspect-ratio:800/500;background:#234a61;border:2px solid #3f7191;border-radius:18px;touch-action:none;outline:none}.arena:focus{box-shadow:0 0 0 3px #60a5fa66}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px;font-size:12px;color:#b6d6ed}.pill{background:#173141;border:1px solid #3f7193;border-radius:999px;padding:7px 12px}.mobile{display:none;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center;margin-top:8px}.mobile button{height:46px;border:0;border-radius:10px;background:#1b5f96;color:#fff;font-weight:900}.mobile .blank{visibility:hidden}.overlay{position:fixed;inset:0;background:#020617ee;display:none;align-items:center;justify-content:center;z-index:20}.overlay.show{display:flex}.card{background:#10253a;border:1px solid #4f7390;border-radius:18px;padding:22px;max-width:480px;text-align:center}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:13px 0}.resultGrid div{background:#071522;border-radius:10px;padding:10px}@media(max-width:700px){.mobile{display:grid}.scorebar{grid-template-columns:1fr 1fr}.left{grid-column:1/-1;grid-row:2;text-align:center}.question .clue{font-size:16px}}
</style></head>
<body><div class="game">
<div class="top"><button class="btn" id="backBtn">← 返回</button><div class="title"><b>Book 3 · Confusing Words Battle Arena</b><small>127 Words · 1P VS CPU · 2P Local Battle</small></div><button class="btn active" id="oneBtn">1P VS CPU</button><button class="btn" id="twoBtn">2 Players</button></div>
<div class="scorebar"><div class="score red">YOU / P1 <span id="scoreRed">0</span></div><div class="left"><span id="claimed">0</span>/<span id="total">127</span> · <span id="remain">127</span> LEFT</div><div class="score blue"><span id="blueName">CPU</span> <span id="scoreBlue">0</span></div></div>
<div class="question"><div class="type" id="qType">CONTEXT</div><div class="clue" id="clue">Loading…</div><div class="sub" id="sub"></div></div><div class="status" id="status">P1 用 WASD，自由移动。CPU 不会影响你的控制。</div>
<canvas class="arena" id="arena" width="800" height="500" tabindex="0"></canvas>
<div class="controls"><span class="pill">P1: W A S D</span><span class="pill" id="cpuInfo">CPU 每题等 3 秒才启动</span><span class="pill">撞错冻结 1.2 秒</span></div>
<div class="mobile"><button class="blank"></button><button data-m="w">▲</button><button class="blank"></button><button data-m="a">◀</button><button data-m="s">▼</button><button data-m="d">▶</button></div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 id="endTitle"></h2><div id="endText"></div><button class="btn" id="againBtn">再战一次</button></div></div>
<script>
(()=>{
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const qs=new URLSearchParams(location.search),file=qs.get('file')||'MOE_UASA_English_Vocabulary_Book_3_Confusing_Words_original.html';
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=800,H=500;
const $=id=>document.getElementById(id);let groups=[],words=[],queue=[],target=null,options=[],mode=1,roundLocked=false,over=false,scoreRed=0,scoreBlue=0,wrongRed=0,attemptRed=0,cleanRed=0,raf=0;
const red={x:95,y:250,w:34,h:23,s:5.2,freeze:0},blue={x:705,y:250,w:34,h:23,s:2.7,freeze:0};
const keys={w:0,a:0,s:0,d:0,up:0,down:0,left:0,right:0};let cpuStartAt=0,cpuGoal=null,cpuRetargetAt=0,nextRoundTimer=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function safe(v){return String(v??'')}function rect(a,b){return !(b.x>a.x+a.w||b.x+b.w<a.x||b.y>a.y+a.h||b.y+b.h<a.y)}
function msg(type,data={}){try{parent.postMessage({source:'uasa-ninja',game:'book3-battle',type,book_no:3,level:1,...data},location.origin)}catch(e){}}
async function track(event_type,extra={}){const sid=localStorage.getItem('uasaStudentId')||'';if(!sid)return;try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,book_no:3,book_title:'Book 3 Confusing Words',event_type,quiz_mode:'Book 3 Battle V2',...extra})})}catch(e){}}
function makeWords(){words=[];groups.forEach((g,gi)=>g.items.forEach((it,ii)=>words.push({word:it.word,use:it.use||'',example:it.example||'',group:g.title,zh:g.zh||'',ms:g.ms||'',rule:g.rule||'',gi,ii})))}
function buildQuestion(t){const types=['example','use','meaning'],type=types[Math.floor(Math.random()*types.length)];if(type==='example'&&t.example){let re=new RegExp('\\b'+safe(t.word).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');let x=t.example.replace(re,'_____');$('qType').textContent='SENTENCE CLUE';$('clue').textContent=x;$('sub').textContent=t.group}else if(type==='use'&&t.use){$('qType').textContent='USE / 用法';$('clue').textContent=t.use;$('sub').textContent=t.group}else{$('qType').textContent='MEANING CLUE';$('clue').textContent=(t.zh?'华语：'+t.zh:'')+(t.ms?' · BM：'+t.ms:'');$('sub').textContent=t.use||t.group}}
function spot(existing){for(let i=0;i<50;i++){const p={x:100+Math.random()*600,y:80+Math.random()*340};if(existing.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>120))return p}return{x:120+Math.random()*560,y:100+Math.random()*300}}
function makeOptions(){let same=words.filter(x=>x.gi===target.gi&&x.word!==target.word),others=words.filter(x=>x.gi!==target.gi&&x.word!==target.word),picks=[];for(const x of [...shuffle(same),...shuffle(others)]){if(!picks.some(p=>p.word===x.word)){picks.push(x);if(picks.length===3)break}}options=[];for(const x of shuffle([target,...picks])){const p=spot(options),a=Math.random()*Math.PI*2,sp=.28+Math.random()*.25;options.push({...x,x:p.x,y:p.y,w:88,h:31,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,correct:x.word===target.word})}}
function focusGame(){try{canvas.focus({preventScroll:true})}catch(e){canvas.focus()}}
function newRound(){clearTimeout(nextRoundTimer);if(!queue.length)return finish();roundLocked=false;target=queue.shift();makeOptions();buildQuestion(target);red.x=95;red.y=250;blue.x=705;blue.y=250;red.freeze=blue.freeze=0;cpuGoal=null;cpuStartAt=performance.now()+3000;cpuRetargetAt=cpuStartAt;$('status').textContent='你先有 3 秒自由抢词，CPU 之后才启动。';focusGame()}
function complete(side){if(roundLocked)return;roundLocked=true;const mine=side==='red';if(mine){scoreRed++;cleanRed++;attemptRed++;msg('answer',{ok:true,delta:10,question_key:'B3|'+target.group+'|'+target.word,word:target.word});track('answer',{question_key:'B3|'+target.group+'|'+target.word,question_text:$('clue').textContent,answer_text:target.word,is_correct:true})}else scoreBlue++;$('scoreRed').textContent=scoreRed;$('scoreBlue').textContent=scoreBlue;const done=scoreRed+scoreBlue;$('claimed').textContent=done;$('remain').textContent=Math.max(0,words.length-done);$('status').textContent=(mine?'YOU':'CPU/P2')+' 抢到 '+target.word+'！下一题 1.2 秒后开始。';nextRoundTimer=setTimeout(newRound,1200)}
function wrong(side,word){if(roundLocked)return;if(side==='red'){red.freeze=72;wrongRed++;attemptRed++;msg('answer',{ok:false,delta:-5,question_key:'B3|'+target.group+'|'+target.word,word});track('book3_battle_wrong',{question_key:'B3|'+target.group+'|'+target.word,question_text:$('clue').textContent,answer_text:word,is_correct:false})}else blue.freeze=72;$('status').textContent=(side==='red'?'YOU':'CPU/P2')+' 撞错 '+word+'，冻结 1.2 秒。'}
function hit(car,side){if(roundLocked)return;const cr={x:car.x-car.w/2,y:car.y-car.h/2,w:car.w,h:car.h};for(const o of options){if(rect(cr,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})){o.correct?complete(side):wrong(side,o.word);car.x=side==='red'?95:705;car.y=250;break}}}
function move(car,dx,dy){if(car.freeze>0)return;const m=Math.max(1,Math.hypot(dx,dy));car.x=Math.max(22,Math.min(W-22,car.x+dx/m*car.s));car.y=Math.max(22,Math.min(H-22,car.y+dy/m*car.s))}
function updatePlayer(){if(red.freeze>0)red.freeze--;move(red,(keys.d?1:0)-(keys.a?1:0),(keys.s?1:0)-(keys.w?1:0));hit(red,'red')}
function moveTargets(){for(const o of options){o.x+=o.vx;o.y+=o.vy;if(o.x-o.w/2<15||o.x+o.w/2>W-15)o.vx*=-1;if(o.y-o.h/2<45||o.y+o.h/2>H-15)o.vy*=-1;o.x=Math.max(15+o.w/2,Math.min(W-15-o.w/2,o.x));o.y=Math.max(45+o.h/2,Math.min(H-15-o.h/2,o.y))}}
function chooseCpu(){const correct=options.find(o=>o.correct),dec=options.filter(o=>!o.correct);cpuGoal=Math.random()<.22?dec[Math.floor(Math.random()*dec.length)]||correct:correct;cpuRetargetAt=performance.now()+1400+Math.random()*1000}
function updateCpu(){if(blue.freeze>0)blue.freeze--;if(mode===2){move(blue,(keys.right?1:0)-(keys.left?1:0),(keys.down?1:0)-(keys.up?1:0));hit(blue,'blue');return}if(roundLocked||performance.now()<cpuStartAt)return;if(!cpuGoal||performance.now()>cpuRetargetAt)chooseCpu();if(!cpuGoal)return;const dx=cpuGoal.x-blue.x,dy=cpuGoal.y-blue.y,d=Math.hypot(dx,dy)||1;move(blue,dx/d,dy/d);hit(blue,'blue')}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function car(c,label,color){ctx.save();ctx.translate(c.x,c.y);ctx.fillStyle=c.freeze>0?'#64748b':color;rr(-17,-11.5,34,23,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,2);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#234a61';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff18';ctx.setLineDash([12,18]);for(let x=100;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.setLineDash([]);for(const o of options){ctx.fillStyle='#f5c542';ctx.strokeStyle='#b37b1a';ctx.lineWidth=2;rr(o.x-o.w/2,o.y-o.h/2,o.w,o.h,8);ctx.fill();ctx.stroke();ctx.fillStyle='#172531';ctx.font='bold 14px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.word.length>12?o.word.slice(0,12)+'…':o.word,o.x,o.y)}car(red,'YOU','#e63e3e');car(blue,mode===1?'CPU':'P2','#3a7bd5')}
function loop(){if(!over){moveTargets();updatePlayer();updateCpu();draw()}raf=requestAnimationFrame(loop)}
function finish(){over=true;const acc=Math.round(cleanRed/Math.max(1,attemptRed)*100),win=scoreRed>scoreBlue;$('endTitle').textContent=win?'YOU WIN!':scoreRed===scoreBlue?'DRAW!':(mode===1?'CPU WINS':'P2 WINS');$('endText').innerHTML=`<div class="resultGrid"><div><b>${scoreRed}</b><br>YOU</div><div><b>${scoreBlue}</b><br>${mode===1?'CPU':'P2'}</div><div><b>${acc}%</b><br>Accuracy</div><div><b>${wrongRed}</b><br>Wrong Hits</div></div>`;$('overlay').classList.add('show');msg('level_complete',{total:words.length,correct:scoreRed,accuracy:acc,score:scoreRed*10})}
function reset(){scoreRed=scoreBlue=wrongRed=attemptRed=cleanRed=0;over=false;$('overlay').classList.remove('show');$('scoreRed').textContent=$('scoreBlue').textContent='0';queue=shuffle(words);$('claimed').textContent='0';$('remain').textContent=words.length;$('total').textContent=words.length;newRound()}
async function load(){try{const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+GROUPS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw 0;groups=Function('return '+m[1])();makeWords();reset()}catch(e){$('clue').textContent='无法读取 Book 3 词汇';$('status').textContent='Battle Arena 载入失败'}}
function setMode(n){mode=n;$('oneBtn').classList.toggle('active',n===1);$('twoBtn').classList.toggle('active',n===2);$('blueName').textContent=n===1?'CPU':'P2';$('cpuInfo').textContent=n===1?'CPU 每题等 3 秒才启动':'P2: 方向键';if(words.length)reset();focusGame()}
function kd(e){const k=e.key.toLowerCase();if(['w','a','s','d'].includes(k)){keys[k]=1;e.preventDefault()}if(e.key==='ArrowUp'){keys.up=1;e.preventDefault()}if(e.key==='ArrowDown'){keys.down=1;e.preventDefault()}if(e.key==='ArrowLeft'){keys.left=1;e.preventDefault()}if(e.key==='ArrowRight'){keys.right=1;e.preventDefault()}}function ku(e){const k=e.key.toLowerCase();if(k in keys)keys[k]=0;if(e.key==='ArrowUp')keys.up=0;if(e.key==='ArrowDown')keys.down=0;if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0}
window.addEventListener('keydown',kd,true);window.addEventListener('keyup',ku,true);canvas.addEventListener('pointerdown',focusGame);document.querySelectorAll('[data-m]').forEach(b=>{const k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=()=>keys[k]=0});$('oneBtn').onclick=()=>setMode(1);$('twoBtn').onclick=()=>setMode(2);$('againBtn').onclick=reset;$('backBtn').onclick=()=>history.back();
load();raf=requestAnimationFrame(loop);setTimeout(focusGame,300);
})();
</script></body></html>
