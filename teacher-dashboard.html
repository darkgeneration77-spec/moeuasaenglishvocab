<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn,input{padding:11px 13px;border-radius:10px;border:1px solid #31516f}.btn{background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input{background:#0d2237;color:#fff}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:28px;display:block}.muted{color:#9db4cc}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.2fr;gap:10px;padding:12px 0;border-bottom:1px solid #294b6d;align-items:center}.row.head{font-weight:800;color:#9fdcff}.nameBtn{background:none;border:0;color:#fff;font-weight:800;text-align:left;cursor:pointer}.good{color:#86efac}.bad{color:#fca5a5}.detail{padding:12px 0;border-bottom:1px solid #294b6d}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.row.head{display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>老师 Dashboard</h1><div class="muted">查看学生学习位置、作答数量、对错、正确率与错题</div></div><a class="btn" href="index.html">返回主页</a></div><div class="card"><input id="key" type="password" placeholder="Teacher Key"><button class="btn" onclick="loadStudents()">进入老师 Dashboard</button></div><div id="main" style="display:none"><div class="stats"><div class="card stat"><b id="studentCount">0</b><span class="muted">Students</span></div><div class="card stat"><b id="totalAttempts">0</b><span class="muted">Attempts</span></div><div class="card stat"><b id="totalCorrect">0</b><span class="muted">Correct</span></div><div class="card stat"><b id="overallAcc">0%</b><span class="muted">Accuracy</span></div></div><div class="card"><h2>全部学生</h2><div class="row head"><div>学生</div><div>Books</div><div>作答</div><div>正确</div><div>错误</div><div>正确率</div></div><div id="students"></div></div><div class="card" id="detailCard" style="display:none"><h2 id="detailTitle">学生详情</h2><div id="bookDetail"></div><h3>最近错题</h3><div id="wrongDetail"></div></div></div></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';let teacherKey='';async function loadStudents(){teacherKey=document.getElementById('key').value.trim();if(!teacherKey)return alert('请输入 Teacher Key');const r=await fetch(API+'/api/teacher/students?key='+encodeURIComponent(teacherKey));if(!r.ok){const e=await r.text();return alert('无法读取老师资料：'+e)}const d=await r.json(),arr=d.students||[];document.getElementById('main').style.display='block';document.getElementById('studentCount').textContent=arr.length;let a=0,c=0;arr.forEach(x=>{a+=Number(x.attempts||0);c+=Number(x.correct||0)});document.getElementById('totalAttempts').textContent=a;document.getElementById('totalCorrect').textContent=c;document.getElementById('overallAcc').textContent=a?Math.round(c/a*100)+'%':'0%';document.getElementById('students').innerHTML=arr.length?arr.map(x=>{const at=Number(x.attempts||0),co=Number(x.correct||0),wr=Number(x.wrong||0),pc=at?Math.round(co/at*100):0;return `<div class="row"><button class="nameBtn" onclick="loadStudent('${x.id.replace(/'/g,"\\'")}')">${escapeHtml(x.name)}<div class="muted">${escapeHtml(x.class_name||'')}</div></button><div>${x.books_started||0}</div><div>${at}</div><div class="good">${co}</div><div class="bad">${wr}</div><div>${pc}%</div></div>`}).join(''):'<p class="muted">还没有学生资料。</p>'}async function loadStudent(id){const r=await fetch(API+'/api/teacher/student?student_id='+encodeURIComponent(id)+'&key='+encodeURIComponent(teacherKey));if(!r.ok){const e=await r.text();return alert('无法读取学生详情：'+e)}const d=await r.json();document.getElementById('detailCard').style.display='block';document.getElementById('detailTitle').textContent=(d.student?.name||'学生')+' · 学习详情';document.getElementById('bookDetail').innerHTML=(d.books||[]).map(x=>{const at=Number(x.attempts||0),co=Number(x.correct||0),wr=Number(x.wrong||0),pc=at?Math.round(co/at*100):0;return `<div class="detail"><b>Book ${x.book_no} ${escapeHtml(x.book_title||'')}</b><div class="muted">作答 ${at} · <span class="good">对 ${co}</span> · <span class="bad">错 ${wr}</span> · 正确率 ${pc}% · Quiz完成 ${x.quizzes_completed||0}</div></div>`}).join('')||'<p class="muted">没有学习记录。</p>';document.getElementById('wrongDetail').innerHTML=(d.wrong_items||[]).map(x=>`<div class="detail"><b>Book ${x.book_no}</b> ${escapeHtml(x.question_text||'')}<div class="bad">学生答案：${escapeHtml(x.answer_text||'')}</div><div class="muted">${x.created_at||''}</div></div>`).join('')||'<p class="muted">没有错题。</p>';document.getElementById('detailCard').scrollIntoView({behavior:'smooth'})}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
