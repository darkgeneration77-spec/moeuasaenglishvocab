<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn,input{padding:11px 13px;border-radius:10px;border:1px solid #31516f}.btn{background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input{background:#0d2237;color:#fff}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.stat b{font-size:28px;display:block}.muted{color:#9db4cc}.good{color:#86efac}.bad{color:#fca5a5}.warn{color:#fcd34d}.row{display:grid;grid-template-columns:2fr .8fr .8fr .8fr .8fr 1fr 1.4fr;gap:10px;padding:12px 0;border-bottom:1px solid #294b6d;align-items:center}.row.head{font-weight:800;color:#9fdcff}.nameBtn{background:none;border:0;color:#fff;font-weight:800;text-align:left;cursor:pointer}.detail{padding:14px 0;border-bottom:1px solid #294b6d}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.level{padding:10px;border:1px solid #31516f;border-radius:10px;background:#0a1b2d}.level.master{border-color:#2f855a}.level.current{border-color:#d69e2e}.level.lock{opacity:.55}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#17283b;color:#b7cadc;font-size:12px}.recommend{padding:14px;border:1px solid #5b4a1d;background:#241f12;border-radius:12px;margin-top:10px}.wrongItem{padding:12px;border:1px solid #5b2b35;background:#241922;border-radius:10px;margin:8px 0}.bar{height:8px;background:#17314b;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#60a5fa}@media(max-width:1000px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.row{grid-template-columns:1fr 1fr}.row.head{display:none}.levels{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div><h1>老师 Dashboard</h1><div class="muted">学生进度 · Level 1–4 · Mastery · 错题 · Recovered · 弱点 · 补救建议</div></div><a class="btn" href="index.html">返回主页</a></div><div class="card"><input id="key" type="password" placeholder="Teacher Key"><button class="btn" onclick="loadStudents()">进入老师 Dashboard</button></div><div id="main" style="display:none"><div class="stats"><div class="card stat"><b id="studentCount">0</b><span class="muted">Students</span></div><div class="card stat"><b id="totalAttempts">0</b><span class="muted">Attempts</span></div><div class="card stat"><b id="totalCorrect">0</b><span class="muted">Correct</span></div><div class="card stat"><b id="overallAcc">0%</b><span class="muted">Accuracy</span></div><div class="card stat"><b id="totalRecovered" class="good">0</b><span class="muted">Recovered</span></div><div class="card stat"><b id="totalUnresolved" class="bad">0</b><span class="muted">Unresolved</span></div><div class="card stat"><b id="needHelp">0</b><span class="muted">Need Support</span></div></div><div class="card"><h2>全部学生</h2><div class="row head"><div>学生</div><div>Books</div><div>作答</div><div>正确</div><div>错误</div><div>正确率</div><div>状态</div></div><div id="students"></div></div><div class="card" id="detailCard" style="display:none"><h2 id="detailTitle">学生详情</h2><div id="summary"></div><div id="recommendation"></div><h3>Book / Level Mastery</h3><div id="bookDetail"></div><h3>未解决错题</h3><div id="wrongDetail"></div></div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';let teacherKey='';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function levelFromMode(s){const m=String(s||'').match(/Level\s*([1-4])/i);return m?Number(m[1]):1}function baseQKey(x){return String(x.question_key||'').replace(/^retry\|/,'').replace(/\|complete$/,'')||((x.book_no||'')+'|'+(x.question_text||''))}
async function loadStudents(){teacherKey=key.value.trim();if(!teacherKey)return alert('请输入 Teacher Key');const r=await fetch(API+'/api/teacher/students?key='+encodeURIComponent(teacherKey));if(!r.ok){const e=await r.text();return alert('无法读取老师资料：'+e)}const d=await r.json(),arr=d.students||[];main.style.display='block';studentCount.textContent=arr.length;let a=0,c=0,nh=0;arr.forEach(x=>{a+=Number(x.attempts||0);c+=Number(x.correct||0);const at=Number(x.attempts||0),pc=at?Number(x.correct||0)/at*100:0;if(at>=5&&pc<60)nh++});totalAttempts.textContent=a;totalCorrect.textContent=c;overallAcc.textContent=a?Math.round(c/a*100)+'%':'0%';needHelp.textContent=nh;totalRecovered.textContent='—';totalUnresolved.textContent='—';students.innerHTML=arr.length?arr.map(x=>{const at=Number(x.attempts||0),co=Number(x.correct||0),wr=Number(x.wrong||0),pc=at?Math.round(co/at*100):0;let status=at<5?'<span class="muted">Not enough data</span>':pc>=80?'<span class="good">Strong</span>':pc>=60?'<span class="warn">Developing</span>':'<span class="bad">Needs Support</span>';return `<div class="row"><button class="nameBtn" onclick="loadStudent('${x.id.replace(/'/g,"\\'")}')">${esc(x.name)}<div class="muted">${esc(x.class_name||'')}</div></button><div>${x.books_started||0}</div><div>${at}</div><div class="good">${co}</div><div class="bad">${wr}</div><div>${pc}%</div><div>${status}</div></div>`}).join(''):'<p class="muted">还没有学生资料。</p>'}
async function loadStudent(id){const r=await fetch(API+'/api/teacher/student?student_id='+encodeURIComponent(id)+'&key='+encodeURIComponent(teacherKey));if(!r.ok){const e=await r.text();return alert('无法读取学生详情：'+e)}const d=await r.json();detailCard.style.display='block';detailTitle.textContent=(d.student?.name||'学生')+' · 学习详情';const books=d.books||[];let totalA=0,totalC=0;books.forEach(x=>{totalA+=Number(x.attempts||0);totalC+=Number(x.correct||0)});const detailResp=await fetch(API+'/api/student/summary?student_id='+encodeURIComponent(id));const recentData=detailResp.ok?await detailResp.json():{recent:[]};const recent=recentData.recent||[];const recoveredKeys=new Set(recent.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===1&&Number(x.recovered)===1).map(baseQKey));const wrongMap=new Map();recent.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===0&&!String(x.quiz_mode||'').includes('Wrong Question Retry')).forEach(x=>{const k=baseQKey(x);if(!wrongMap.has(k))wrongMap.set(k,x)});const allWrong=[...wrongMap.values()],unresolvedWrong=allWrong.filter(x=>!recoveredKeys.has(baseQKey(x))),recoveredCount=[...recoveredKeys].filter(k=>wrongMap.has(k)).length;const acc=totalA?Math.round(totalC/totalA*100):0;summary.innerHTML=`<div class="muted">班级：${esc(d.student?.class_name||'')} · 作答 ${totalA} · 正确 ${totalC} · 历史错题 ${allWrong.length} · <span class="good">Recovered ${recoveredCount}</span> · <span class="bad">Unresolved ${unresolvedWrong.length}</span> · 正确率 ${acc}%</div>`;totalRecovered.textContent=recoveredCount;totalUnresolved.textContent=unresolvedWrong.length;const byBook={};for(const w of unresolvedWrong){const b=Number(w.book_no||0);byBook[b]=(byBook[b]||0)+1}let weakest=null;Object.entries(byBook).forEach(([b,n])=>{if(!weakest||n>weakest.n)weakest={book:Number(b),n}});recommendation.innerHTML=weakest?`<div class="recommend"><b>推荐补救</b><div style="margin-top:6px">Book ${weakest.book} 有最多未解决错题（${weakest.n} 题）。建议先完成 Wrong Question Retry，再继续下一 Level。</div></div>`:`<div class="recommend"><b>推荐补救</b><div style="margin-top:6px">当前错题已补救完成，继续当前未掌握 Level。</div></div>`;const grouped={};for(const b of books)grouped[b.book_no]={title:b.book_title||'',levels:{1:{a:0,c:0},2:{a:0,c:0},3:{a:0,c:0},4:{a:0,c:0}}};for(const e of recent){if(e.event_type!=='answer')continue;const b=Number(e.book_no||0),lv=levelFromMode(e.quiz_mode);if(!grouped[b])grouped[b]={title:e.book_title||'',levels:{1:{a:0,c:0},2:{a:0,c:0},3:{a:0,c:0},4:{a:0,c:0}}};grouped[b].levels[lv].a++;if(Number(e.is_correct)===1)grouped[b].levels[lv].c++}bookDetail.innerHTML=Object.keys(grouped).sort((a,b)=>a-b).map(bn=>{const g=grouped[bn];let unlocked=1;for(let l=1;l<=4;l++){const x=g.levels[l],pc=x.a?Math.round(x.c/x.a*100):0;if(x.a>=5&&pc>=80)unlocked=Math.min(4,l+1);else if(l===unlocked)break}const levels=[1,2,3,4].map(l=>{const x=g.levels[l],pc=x.a?Math.round(x.c/x.a*100):0;let cls='level lock',state='🔒 Locked';if(l<unlocked){cls='level master';state='✓ Mastered'}else if(l===unlocked){cls='level current';state='Current'}if(x.a>=5&&pc>=80){cls='level master';state='✓ Mastered'}return `<div class="${cls}"><b>Level ${l}</b><div>${x.a} attempts · ${pc}%</div><div class="tag">${state}</div><div class="bar"><div class="fill" style="width:${pc}%"></div></div></div>`}).join('');return `<div class="detail"><b>Book ${bn} ${esc(g.title)}</b><div class="levels">${levels}</div></div>`}).join('')||'<p class="muted">没有学习记录。</p>';wrongDetail.innerHTML=unresolvedWrong.length?unresolvedWrong.map(x=>`<div class="wrongItem"><b>Book ${x.book_no}</b> ${esc(x.question_text||'题目资料未记录')}<div class="bad">学生答案：${esc(x.answer_text||'')}</div>${x.correct_answer?`<div class="good">正确答案：${esc(x.correct_answer)}</div>`:''}${x.quiz_mode?`<div class="tag">${esc(x.quiz_mode)}</div>`:''}<div class="muted">${esc(x.created_at||'')}</div></div>`).join(''):'<p class="good">没有未解决错题。</p>';detailCard.scrollIntoView({behavior:'smooth'})}
</script></body></html>
