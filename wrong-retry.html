<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wrong Question Retry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:850px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{padding:11px 15px;border:1px solid #3c6b91;border-radius:11px;background:#1b5f96;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.card{background:#0d2237;border:1px solid #294b6d;border-radius:18px;padding:20px;margin-top:16px}.muted{color:#9db4cc}.good{color:#86efac}.bad{color:#fca5a5}.question{font-size:22px;font-weight:900;line-height:1.55;margin:18px 0}.answer{width:100%;padding:14px;border-radius:12px;border:1px solid #416685;background:#081827;color:#fff;font-size:17px}.progress{height:10px;background:#17314b;border-radius:999px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#60a5fa}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#162d44;color:#b9d4ea;font-size:12px}.result{padding:12px;border-radius:12px;margin-top:12px}.result.good{background:#102c25}.result.bad{background:#2d1820}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}</style></head><body><div class="wrap"><div class="top"><div><h1>Wrong Question Retry 错题重练</h1><div id="student" class="muted"></div></div><a class="btn" href="student-dashboard.html">返回 Dashboard</a></div><div id="box" class="card"><div class="muted">正在读取错题…</div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const sid=localStorage.getItem('uasaStudentId')||'';const sname=localStorage.getItem('uasaStudentName')||'';student.textContent=sname||'Student';let items=[],i=0,recovered=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function recoveredKey(x){return 'uasaRecovered:'+sid+':'+x.book_no+':'+btoa(unescape(encodeURIComponent((x.question_text||'')+'|'+(x.answer_text||'')))).slice(0,40)}
async function track(x,correct,answer){await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,book_no:Number(x.book_no),book_title:x.book_title||'',event_type:'answer',question_key:'retry|'+i,question_text:x.question_text||'',answer_text:answer,is_correct:correct,quiz_mode:'Wrong Question Retry'})}).catch(()=>{})}
async function load(){if(!sid){box.innerHTML='<h2>请先从主页登记学生。</h2><a class="btn" href="index.html">返回主页</a>';return}const r=await fetch(API+'/api/student/summary?student_id='+encodeURIComponent(sid));if(!r.ok){box.innerHTML='<p class="bad">无法读取错题。</p>';return}const d=await r.json();const recent=d.recent||[];const wrongs=recent.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===0&&x.question_text&&!String(x.quiz_mode||'').includes('Wrong Question Retry'));const seen=new Set();items=wrongs.filter(x=>{const k=x.book_no+'|'+x.question_text;if(seen.has(k)||localStorage.getItem(recoveredKey(x))==='1')return false;seen.add(k);return true});render()}
function render(){if(!items.length){box.innerHTML='<h2 class="good">目前没有需要重练的错题 ✓</h2><p class="muted">继续学习新的 Level。</p><a class="btn" href="index.html">继续学习</a>';return}if(i>=items.length){box.innerHTML=`<h2 class="good">Retry Complete</h2><p>本轮成功补救 <b>${recovered}</b> / ${items.length} 题。</p><div class="actions"><a class="btn" href="student-dashboard.html">查看 Dashboard</a><button class="btn" onclick="location.reload()">再练未掌握题</button></div>`;return}const x=items[i],pc=Math.round(i/items.length*100);box.innerHTML=`<div class="tag">Book ${x.book_no}${x.quiz_mode?' · '+esc(x.quiz_mode):''}</div><div class="progress"><div class="fill" style="width:${pc}%"></div></div><div class="muted">${i+1} / ${items.length}</div><div class="question">${esc(x.question_text)}</div><input id="ans" class="answer" placeholder="Type your answer and press Enter" autocomplete="off"><div id="result"></div><div class="actions"><button class="btn" onclick="check()">Check Answer</button><button class="btn" onclick="skip()">Skip</button></div>`;ans.focus();ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
async function check(){const x=items[i],a=ans.value.trim();if(!a)return;/* Original wrong answer is not the answer key, so retry uses the source book for final validation. We record the attempt and mark recovered only when student self-confirms after checking source. */result.innerHTML=`<div class="result"><div>你的答案：<b>${esc(a)}</b></div><p class="muted">请对照原 Book 的正确答案/反馈。若已答对，按“已掌握”；仍错误则按“继续练习”。</p><div class="actions"><button class="btn" onclick="master('${encodeURIComponent(a)}')">✓ 已掌握</button><button class="btn" onclick="again('${encodeURIComponent(a)}')">继续练习</button></div></div>`;ans.disabled=true}
async function master(a){const x=items[i],answer=decodeURIComponent(a);localStorage.setItem(recoveredKey(x),'1');recovered++;await track(x,true,answer);i++;render()}
async function again(a){const x=items[i],answer=decodeURIComponent(a);await track(x,false,answer);items.push(x);i++;render()}
function skip(){items.push(items[i]);i++;render()}
load();
</script></body></html>
