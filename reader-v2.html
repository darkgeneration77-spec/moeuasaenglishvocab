<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOE UASA English Reader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#071522}.bar{min-height:108px;color:#fff;background:#0b2944;padding:9px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.links{display:flex;gap:7px;flex-wrap:wrap}.btn{color:#fff;background:#1b5f96;border:1px solid #6fc8e5;padding:8px 11px;border-radius:9px;font-weight:800;text-decoration:none;cursor:pointer}.level-btn.locked{opacity:.45}.level-btn.active{background:#2563eb}.meta{text-align:right;font-size:12px}.status{color:#ffd166}.game{margin-top:4px}.combo{background:#351b09;color:#fdba74;padding:2px 6px;border-radius:99px;font-weight:900}.coin{color:#fde68a;font-weight:900}.identityLine{margin-top:5px;color:#c4b5fd;font-weight:800}.frame{width:100%;height:calc(100% - 108px);border:0;background:#fff}.panel{position:fixed;z-index:8000;right:12px;top:122px;width:305px;background:#081a2cf7;color:#fff;border:1px solid #3d6487;border-radius:15px;box-shadow:0 15px 40px #0008;overflow:hidden}.panel.closed{width:48px}.head{padding:10px;background:#102c46;display:flex;justify-content:space-between;font-weight:900}.panel.closed .body,.panel.closed .pt{display:none}.toggle{background:#1b5f96;color:#fff;border:0;border-radius:7px;padding:5px 8px}.body{padding:9px}.card{background:#10253a;border:1px solid #31516f;border-radius:11px;padding:9px;margin-bottom:8px}.daily{background:linear-gradient(135deg,#16213b,#2d2251);border-color:#7c3aed}.dailyTitle{font-weight:900;color:#ddd6fe;font-size:12px}.mission{font-size:11px;padding:7px 0;border-bottom:1px solid #ffffff18}.mission:last-child{border:0}.missionLine{display:flex;justify-content:space-between;gap:7px}.mission.done{color:#86efac}.barMini{height:6px;background:#26364b;border-radius:99px;overflow:hidden;margin-top:5px}.fillMini{height:100%;background:linear-gradient(90deg,#8b5cf6,#facc15)}.socialRow{display:grid;grid-template-columns:34px 31px 1fr auto;gap:6px;align-items:center;padding:7px 5px;border-bottom:1px solid #ffffff12;font-size:11px}.socialRow.me{color:#fde68a;background:#173b5d;border-radius:9px;font-weight:900}.miniAvatar{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#173b5d;border:2px solid #7dd3fc;font-size:12px;font-weight:1000}.socialName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.socialTitle{display:block;color:#c4b5fd;font-size:9px;font-weight:700;margin-top:2px}.rivalIdentity{display:flex;align-items:center;gap:8px;margin-bottom:5px}.rivalAvatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#173b5d;border:3px solid #facc15;font-weight:1000}.rivalTitle{font-size:10px;color:#c4b5fd;margin-top:2px}.toast{position:fixed;z-index:9999;left:50%;top:125px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;min-width:290px;max-width:90vw;padding:17px 21px;border-radius:16px;text-align:center;color:#fff;font-size:20px;font-weight:900;background:#065f46;border:2px solid #6ee7b7;box-shadow:0 18px 50px #0009;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:#7f1d1d;border-color:#fca5a5}.toast.rank{background:#854d0e;border-color:#fde68a}.toast.lucky{background:#6b21a8;border-color:#fde68a}.small{display:block;font-size:12px;margin-top:5px}.xpPop{position:fixed;z-index:10000;right:30px;top:110px;color:#fde047;font-size:25px;font-weight:900;animation:fly 1.1s forwards}.revenge{display:none;background:#4c1010;border:1px solid #f87171}.revenge.active{display:block}.dots{display:flex;gap:5px;margin-top:5px}.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.on{background:#facc15}.rivalBar{height:7px;background:#26364b;border-radius:99px;overflow:hidden;margin:6px 0}.rivalFill{height:100%;background:linear-gradient(90deg,#38bdf8,#facc15)}@keyframes fly{to{opacity:0;transform:translateY(-60px)}}@media(max-width:760px){.bar{min-height:178px}.frame{height:calc(100% - 178px)}.panel{top:auto;bottom:8px;right:8px;width:270px}.meta{text-align:left;width:100%}.toast{top:185px}}
</style>
</head>
<body>
<div class="bar">
  <div class="links">
    <a class="btn" href="index.html">← Home</a>
    <a class="btn" href="student-dashboard.html">Dashboard</a>
    <a class="btn" href="leaderboard.html">Leaderboard</a>
    <a class="btn" href="shop.html">Shop</a>
    <button class="btn level-btn" data-level="1">Level 1</button>
    <button class="btn level-btn" data-level="2">Level 2</button>
    <button class="btn level-btn" data-level="3">Level 3</button>
    <button class="btn level-btn" data-level="4">Level 4</button>
  </div>
  <div class="meta">
    <div id="label">Learning Module</div>
    <div id="sync" class="status">Loading…</div>
    <div class="game"><b id="xp">0 XP</b> · <span id="coin" class="coin">0 Coins</span> · Streak <b id="streak">0</b> · <span id="combo" class="combo">COMBO ×0</span> · <span id="mastery">Mastery 0%</span></div>
    <div id="identityLine" class="identityLine">A · Vocabulary Rookie</div>
    <div id="rival">Finding rival…</div>
  </div>
</div>
<div id="toast" class="toast"><span id="toastMain"></span><span id="toastSub" class="small"></span></div>
<aside id="panel" class="panel">
  <div class="head"><span class="pt">Game Center</span><button id="toggle" class="toggle">−</button></div>
  <div class="body">
    <div class="card daily"><div class="dailyTitle">TODAY'S CHALLENGES</div><div id="dailyList"></div></div>
    <div id="revengeBox" class="card revenge"><b>REVENGE CHALLENGE</b><div id="revengeText" style="font-size:11px;margin-top:4px"></div><div id="revengeDots" class="dots"></div></div>
    <div class="card">
      <div class="rivalIdentity"><div id="rivalAvatar" class="rivalAvatar">A</div><div><b id="rivalName">Rival</b><div id="rivalTitle" class="rivalTitle">Vocabulary Rookie</div></div></div>
      <div style="display:flex;justify-content:space-between"><span>Rival Chase</span><span id="rivalGap">—</span></div>
      <div class="rivalBar"><div id="rivalFill" class="rivalFill"></div></div>
      <div id="questionsAway" style="font-size:11px;color:#fbbf24"></div>
    </div>
    <div class="card"><div class="dailyTitle">NEAR-ME LEADERBOARD</div><div id="nearList"></div></div>
  </div>
</aside>
<iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>
<script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const p=new URLSearchParams(location.search),file=p.get('file')||'',frame=document.getElementById('frame');
const sid=()=>localStorage.getItem('uasaStudentId')||'',sname=()=>localStorage.getItem('uasaStudentName')||'';
const m=file.match(/Book_(\d+)/i),BOOK_NO=m?+m[1]:0,BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');
let CURRENT_LEVEL=+(p.get('level')||sessionStorage.getItem('uasaCurrentLevel')||1),CLOUD={total_xp:0,current_streak:0,best_streak:0,books_started:0,books_mastered:0},GAME={coins:0,lifetime_coins:0,equipped_avatar:'rookie-blue',equipped_title:'Vocabulary Rookie'},LEVELS={},COMBO=0,MY_RANK=0,RIVAL=null,NEAR=[],SOCIAL={},REVENGE={active:false,targetRank:0,need:3,done:0,opponent:''};
if(CURRENT_LEVEL<1||CURRENT_LEVEL>4)CURRENT_LEVEL=1;
const AVATAR_ICON={'rookie-blue':'A','fox-orange':'F','owl-purple':'O','tiger-gold':'T','dragon-red':'D','crown-black':'K'};
const avatarIcon=k=>AVATAR_ICON[k]||'A';
const DAY=new Date().toLocaleDateString('en-CA'),DK='uasaDaily:'+sid()+':'+DAY;
let DAILY=JSON.parse(localStorage.getItem(DK)||'null')||{correct:0,bestCombo:0,levels:0,passes:0,claimed:{}};
const MISSIONS=[{id:'correct10',name:'Answer 10 correctly',target:10,reward:100,get:()=>DAILY.correct},{id:'combo5',name:'Reach a 5 Combo',target:5,reward:75,get:()=>DAILY.bestCombo},{id:'level2',name:'Complete 2 Levels',target:2,reward:150,get:()=>DAILY.levels},{id:'pass1',name:'Pass 1 rival',target:1,reward:100,get:()=>DAILY.passes}];
const PRAISE=['Correct! Nice hit.','Clean answer. Keep moving.','That one had no chance.','Sharp. Another one.','Easy XP. Keep going.'];
const TAUNTS=['Nope. That question stole your combo.','The correct answer watched you walk past it.','Wrong. The question wins this round.','Combo destroyed. Win it back.'];
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveDaily(){localStorage.setItem(DK,JSON.stringify(DAILY))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function levelObj(l){return LEVELS[BOOK_NO+'-'+l]||{mastery:0,unlocked:l===1?1:0}}
function unlocked(l){return l===1||+levelObj(l).unlocked===1||+levelObj(l-1).mastery>=80}
function perQ(){return COMBO>=10?20:COMBO>=5?15:COMBO>=3?12:10}
function showToast(a,b='',type='',ms=1600){toastMain.textContent=a;toastSub.textContent=b;toast.className='toast '+type+' show';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),ms)}
function xpPop(n){const e=document.createElement('div');e.className='xpPop';e.textContent='+'+n+' XP';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
async function earnCoins(amount,reason,ref){try{const r=await fetch(API+'/api/game/earn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),amount,reason,reference_key:ref})});const d=await r.json();if(r.ok&&d.profile){GAME=d.profile;refresh()}return r.ok}catch(e){return false}}
async function loadGame(){try{const r=await fetch(API+'/api/game/profile?student_id='+encodeURIComponent(sid()));const d=await r.json();if(r.ok&&d.profile)GAME=d.profile}catch(e){}}
async function loadSocialProfiles(){const ids=[...new Set([...NEAR.map(x=>x.id),RIVAL?.id].filter(Boolean))].slice(0,6);await Promise.all(ids.map(async id=>{try{const r=await fetch(API+'/api/game/profile?student_id='+encodeURIComponent(id));const d=await r.json();if(r.ok&&d.profile)SOCIAL[id]=d.profile}catch(e){}}));renderRank()}
async function claimMissions(){for(const q of MISSIONS){if(!DAILY.claimed[q.id]&&q.get()>=q.target){DAILY.claimed[q.id]=true;CLOUD.total_xp=+CLOUD.total_xp+q.reward;saveDaily();xpPop(q.reward);showToast('DAILY CHALLENGE COMPLETE!',q.name+' · +'+q.reward+' XP · +20 Coins','lucky',2600);await saveCloud();await earnCoins(20,'daily challenge','daily:'+DAY+':'+q.id)}}renderDaily()}
function renderDaily(){dailyList.innerHTML=MISSIONS.map(q=>{const v=Math.min(q.target,q.get()),done=!!DAILY.claimed[q.id];return `<div class="mission ${done?'done':''}"><div class="missionLine"><span>${done?'✓ ':''}${esc(q.name)}</span><b>${v}/${q.target} · +${q.reward}</b></div><div class="barMini"><div class="fillMini" style="width:${Math.min(100,v/q.target*100)}%"></div></div></div>`}).join('')}
function refresh(){xp.textContent=+CLOUD.total_xp+' XP';coin.textContent=(+GAME.coins||0)+' Coins';streak.textContent=+CLOUD.current_streak;combo.textContent='COMBO ×'+COMBO;mastery.textContent='Level '+CURRENT_LEVEL+' Mastery '+(+levelObj(CURRENT_LEVEL).mastery||0)+'%';identityLine.textContent=avatarIcon(GAME.equipped_avatar)+' · '+(GAME.equipped_title||'Vocabulary Rookie');document.querySelectorAll('.level-btn').forEach(b=>{let n=+b.dataset.level;b.classList.toggle('active',n===CURRENT_LEVEL);b.classList.toggle('locked',!unlocked(n));b.textContent='Level '+n+(unlocked(n)?(+levelObj(n).mastery>=80?' ✓':''):' 🔒')});renderDaily();renderRank();renderRevenge()}
toggle.onclick=()=>{panel.classList.toggle('closed');toggle.textContent=panel.classList.contains('closed')?'+':'−'};
async function saveCloud(extra={}){if(!sid())return;try{await fetch(API+'/api/progress/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),total_xp:+CLOUD.total_xp,current_streak:+CLOUD.current_streak,best_streak:+CLOUD.best_streak,books_started:+CLOUD.books_started,books_mastered:+CLOUD.books_mastered,...extra})})}catch(e){}}
async function track(event_type,extra={}){try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,...extra,quiz_mode:'Level '+CURRENT_LEVEL})})}catch(e){}}
async function loadCloud(){try{const d=await(await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid()))).json();CLOUD=Object.assign(CLOUD,d.progress||{});(d.levels||[]).forEach(x=>LEVELS[x.book_no+'-'+x.level_no]=x);await loadGame();refresh();sync.textContent='V2.9 · Social Identity · Coins · Rival Mode ON';await loadRanking()}catch(e){sync.textContent='Cloud unavailable'}}
function renderRank(){if(RIVAL){const rp=SOCIAL[RIVAL.id]||{},rx=+RIVAL.total_xp||0,me=+CLOUD.total_xp||0,g=rx-me;rivalAvatar.textContent=avatarIcon(rp.equipped_avatar);rivalName.textContent=RIVAL.name||'Rival';rivalTitle.textContent=rp.equipped_title||'Vocabulary Rookie';rivalGap.textContent=Math.abs(g)+' XP '+(g>=0?'ahead':'behind');rivalFill.style.width=Math.min(100,Math.max(8,me/Math.max(rx,me,1)*100))+'%';questionsAway.textContent=g>0?'About '+Math.max(1,Math.ceil((g+1)/perQ()))+' correct answers to pass.':'You are ahead. Keep the lead.';rival.textContent='Rank #'+(MY_RANK||'?')+' · '+Math.abs(g)+' XP '+(g>=0?'behind ':'ahead of ')+(RIVAL.name||'Rival')}else{rival.textContent='Rank #'+(MY_RANK||'?')+' · No nearby rival yet.';rivalName.textContent='No Rival';rivalTitle.textContent='Keep learning';rivalAvatar.textContent='A';rivalGap.textContent='—';questionsAway.textContent=''}nearList.innerHTML=NEAR.map(x=>{const gp=SOCIAL[x.id]||{},isMe=x.is_me||x.id===sid();return `<div class="socialRow ${isMe?'me':''}"><span>#${x.rank}</span><span class="miniAvatar">${avatarIcon(isMe?GAME.equipped_avatar:gp.equipped_avatar)}</span><span class="socialName">${isMe?'YOU':esc(x.name||'Student')}<span class="socialTitle">${esc(isMe?(GAME.equipped_title||'Vocabulary Rookie'):(gp.equipped_title||'Vocabulary Rookie'))}</span></span><b>${+x.total_xp||0} XP</b></div>`}).join('')}
async function loadRanking(){try{const d=await(await fetch(API+'/api/leaderboard?student_id='+encodeURIComponent(sid()))).json(),before=MY_RANK,old=[...NEAR];MY_RANK=+d.my_rank||0;RIVAL=d.rival||null;NEAR=d.near_me||d.leaderboard||[];renderRank();loadSocialProfiles();if(before&&MY_RANK>before&&!REVENGE.active){let a=NEAR.find(x=>+x.rank===MY_RANK-1);startRevenge(before,a?.name||RIVAL?.name||'Someone')}if(before&&MY_RANK<before){DAILY.passes++;saveDaily();let a=old.find(x=>+x.rank===MY_RANK);showToast('YOU PASSED '+String(a?.name||'SOMEONE').toUpperCase()+'!','Rank #'+before+' → #'+MY_RANK,'rank',2300);await claimMissions()}}catch(e){}}
function startRevenge(rank,name){REVENGE={active:true,targetRank:rank,need:3,done:0,opponent:name};panel.classList.remove('closed');showToast(String(name).toUpperCase()+' PASSED YOU!','Get 3 correct answers and take Rank #'+rank+' back.','bad',3000);renderRevenge()}
function renderRevenge(){revengeBox.classList.toggle('active',REVENGE.active);if(!REVENGE.active)return;revengeText.textContent='Take Rank #'+REVENGE.targetRank+' back · '+REVENGE.done+'/3 correct';revengeDots.innerHTML=[0,1,2].map(i=>`<span class="dot ${i<REVENGE.done?'on':''}"></span>`).join('')}
function revengeAnswer(ok){if(!REVENGE.active)return;if(ok){REVENGE.done++;if(REVENGE.done>=3)setTimeout(checkRevenge,300)}else{REVENGE.done=0;showToast('REVENGE RESET','Build 3 correct answers again.','bad')}renderRevenge()}
async function checkRevenge(){await loadRanking();if(MY_RANK<=REVENGE.targetRank){REVENGE.active=false;showToast('REVENGE COMPLETE!','Rank #'+REVENGE.targetRank+' reclaimed.','rank',2700)}else{REVENGE.done=0;showToast('Still behind.','Keep attacking.','bad')}renderRevenge()}
async function lucky(){let chance=COMBO>=10?.12:COMBO>=5?.08:.05;if(Math.random()>chance)return;let a=[20,20,20,35,35,50,100],n=pick(a);CLOUD.total_xp+=n;xpPop(n);showToast('LUCKY QUESTION!','Mystery Box · +'+n+' XP','lucky',2400);await saveCloud();setTimeout(loadRanking,350)}
function chooseLevel(n){if(!unlocked(n)){showToast('LEVEL LOCKED','Master Level '+(n-1)+' with 80% first.','bad');return}CURRENT_LEVEL=n;sessionStorage.setItem('uasaCurrentLevel',n);refresh()}
document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>chooseLevel(+b.dataset.level));
async function boot(){if(!sid()){sessionStorage.setItem('uasaPendingBook',file);location.replace('index.html?login=1');return}if(!/^[A-Za-z0-9_().%\-]+\.html$/.test(file))return;await loadCloud();frame.src=file;label.textContent=BOOK_TITLE}
boot();refresh();
frame.addEventListener('load',()=>{track('book_open');try{const d=frame.contentDocument;let lastKey='',correctN=0,attemptN=0;
  d.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const text=(b.textContent||'').trim();const oc=b.getAttribute('onclick')||'';
    if(/Meaning Quiz|词义测验/i.test(text)||/startQuiz\s*\(\s*['\"]meaning['\"]\s*\)/i.test(oc)){
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
      try{sessionStorage.removeItem('ninjaVocabPool');sessionStorage.setItem('ninjaVocabSource',file)}catch(err){}
      frame.src='ninja-vocab.html?v=static20-20260815-1220&file='+encodeURIComponent(file)+'&level='+CURRENT_LEVEL+'&from=reader-v2';
      return false;
    }
  },true);
  function txt(s){let e=d.querySelector(s);return e?(e.textContent||'').trim():''}function inspect(ans=''){let counter=txt('#counter'),result=txt('#result,.result'),question=txt('#prompt,#qPrompt,.prompt,.qprompt')||txt('#instruction'),ok=null;if(/Incorrect|答错了|Correct answer:/i.test(result))ok=false;else if(/Correct spelling|拼写正确|Correct!|答对了/i.test(result))ok=true;if(ok===null)return;let key=BOOK_NO+'|L'+CURRENT_LEVEL+'|'+counter+'|'+question;if(key===lastKey)return;lastKey=key;reward(ok,key);track('answer',{question_key:key,question_text:question,answer_text:String(ans),is_correct:ok});let mm=counter.match(/(\d+)\s*\/\s*(\d+)/);if(mm&&+mm[1]===+mm[2])finish(+mm[2])}async function reward(ok,key){attemptN++;revengeAnswer(ok);if(ok){correctN++;COMBO++;DAILY.correct++;DAILY.bestCombo=Math.max(DAILY.bestCombo,COMBO);CLOUD.current_streak++;CLOUD.best_streak=Math.max(+CLOUD.best_streak,+CLOUD.current_streak);let gain=perQ();CLOUD.total_xp+=gain;saveDaily();xpPop(gain);showToast(COMBO===10?'UNSTOPPABLE ×10':COMBO===5?'5 COMBO!':COMBO===3?'3 COMBO!':pick(PRAISE),'+'+gain+' XP · +2 Coins');refresh();await saveCloud();await earnCoins(2,'correct answer','answer:'+DAY+':'+key);await claimMissions();await lucky();setTimeout(loadRanking,400)}else{let lost=COMBO;COMBO=0;CLOUD.current_streak=0;showToast(pick(TAUNTS),lost?'Your ×'+lost+' combo is gone.':'Try the next one.','bad');refresh();await saveCloud()}}async function finish(total){let pct=Math.round(correctN/Math.max(attemptN,total)*100),old=levelObj(CURRENT_LEVEL),best=Math.max(+old.mastery||0,pct),mastered=best>=80;LEVELS[BOOK_NO+'-'+CURRENT_LEVEL]={...old,mastery:best,unlocked:1,mastered:mastered?1:0};DAILY.levels++;saveDaily();await saveCloud({book_no:BOOK_NO,level_no:CURRENT_LEVEL,mastery:best,attempts:attemptN,correct:correctN,unlocked:true,mastered});await claimMissions();if(mastered){let c=pct===100?35:20;await earnCoins(c,pct===100?'perfect clear':'level mastered',(pct===100?'perfect:':'mastery:')+BOOK_NO+':'+CURRENT_LEVEL);showToast(pct===100?'PERFECT CLEAR!':'LEVEL MASTERED!','Mastery '+best+'% · +'+c+' Coins · Next level unlocked','rank',2700)}else showToast('LEVEL COMPLETE','Mastery '+best+'% · Reach 80% to unlock next level','bad',2700);refresh()}d.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let i=d.querySelector('#spellInput,#answerArea input,.textanswer,input.answer');setTimeout(()=>inspect(i?i.value:(b.textContent||'').trim()),180)},true);d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat){let a=d.activeElement;setTimeout(()=>inspect(a&&'value'in a?a.value:''),180)}},true);let r=d.querySelector('#result,.result');if(r)new MutationObserver(()=>setTimeout(()=>inspect(''),50)).observe(r,{childList:true,subtree:true,characterData:true})}catch(e){sync.textContent='Reader hook error'}});
</script>
</body>
</html>
