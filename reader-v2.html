<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOE UASA English Reader</title><style>html,body{margin:0;height:100%;font-family:Arial;background:#071522}.bar{min-height:105px;color:white;background:#0b2944;padding:9px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.links{display:flex;gap:7px;flex-wrap:wrap}.btn{color:white;background:#1b5f96;border:1px solid #6fc8e5;padding:8px 11px;border-radius:9px;font-weight:800;text-decoration:none;cursor:pointer}.level-btn.locked{opacity:.45}.level-btn.active{background:#2563eb}.meta{text-align:right;font-size:12px}.status{color:#ffd166}.game{margin-top:4px}.combo{background:#351b09;color:#fdba74;padding:2px 6px;border-radius:99px;font-weight:900}.frame{width:100%;height:calc(100% - 105px);border:0;background:white}.panel{position:fixed;z-index:8000;right:12px;top:120px;width:280px;background:#081a2cf5;color:white;border:1px solid #3d6487;border-radius:15px;box-shadow:0 15px 40px #0008;overflow:hidden}.panel.closed{width:48px}.head{padding:10px;background:#102c46;display:flex;justify-content:space-between;font-weight:900}.panel.closed .body,.panel.closed .pt{display:none}.toggle{background:#1b5f96;color:white;border:0;border-radius:7px;padding:5px 8px}.body{padding:9px}.card{background:#10253a;border:1px solid #31516f;border-radius:11px;padding:9px;margin-bottom:8px}.daily{background:linear-gradient(135deg,#16213b,#2d2251);border-color:#7c3aed}.dailyTitle{font-weight:900;color:#ddd6fe;font-size:12px}.mission{font-size:11px;padding:7px 0;border-bottom:1px solid #ffffff18}.mission:last-child{border:0}.missionLine{display:flex;justify-content:space-between;gap:7px}.mission.done{color:#86efac}.barMini{height:6px;background:#26364b;border-radius:99px;overflow:hidden;margin-top:5px}.fillMini{height:100%;background:linear-gradient(90deg,#8b5cf6,#facc15)}.near{display:grid;grid-template-columns:34px 1fr auto;gap:5px;padding:6px;font-size:11px;border-bottom:1px solid #ffffff12}.near.me{color:#fde68a;background:#173b5d;border-radius:8px;font-weight:900}.toast{position:fixed;z-index:9999;left:50%;top:125px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;min-width:290px;max-width:90vw;padding:17px 21px;border-radius:16px;text-align:center;color:white;font-size:20px;font-weight:900;background:#065f46;border:2px solid #6ee7b7;box-shadow:0 18px 50px #0009;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:#7f1d1d;border-color:#fca5a5}.toast.rank{background:#854d0e;border-color:#fde68a}.toast.lucky{background:#6b21a8;border-color:#fde68a}.small{display:block;font-size:12px;margin-top:5px}.xpPop{position:fixed;z-index:10000;right:30px;top:110px;color:#fde047;font-size:25px;font-weight:900;animation:fly 1.1s forwards}.revenge{display:none;background:#4c1010;border:1px solid #f87171}.revenge.active{display:block}.dots{display:flex;gap:5px;margin-top:5px}.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.on{background:#facc15}.rivalBar{height:7px;background:#26364b;border-radius:99px;overflow:hidden;margin:6px 0}.rivalFill{height:100%;background:linear-gradient(90deg,#38bdf8,#facc15)}@keyframes fly{to{opacity:0;transform:translateY(-60px)}}@media(max-width:760px){.bar{min-height:170px}.frame{height:calc(100% - 170px)}.panel{top:auto;bottom:8px;right:8px;width:245px}.meta{text-align:left;width:100%}.toast{top:180px}}</style></head><body><div class="bar"><div class="links"><a class="btn" href="index.html">← Home</a><a class="btn" href="student-dashboard.html">Dashboard</a><button class="btn level-btn" data-level="1">Level 1</button><button class="btn level-btn" data-level="2">Level 2</button><button class="btn level-btn" data-level="3">Level 3</button><button class="btn level-btn" data-level="4">Level 4</button></div><div class="meta"><div id="label">Learning Module</div><div id="sync" class="status">Loading…</div><div class="game"><b id="xp">0 XP</b> · Streak <b id="streak">0</b> · <span id="combo" class="combo">COMBO ×0</span> · <span id="mastery">Mastery 0%</span></div><div id="rival">Finding rival…</div></div></div><div id="toast" class="toast"><span id="toastMain"></span><span id="toastSub" class="small"></span></div><aside id="panel" class="panel"><div class="head"><span class="pt">Game Center</span><button id="toggle" class="toggle">−</button></div><div class="body"><div class="card daily"><div class="dailyTitle">TODAY'S CHALLENGES</div><div id="dailyList"></div></div><div id="revengeBox" class="card revenge"><b>REVENGE CHALLENGE</b><div id="revengeText" style="font-size:11px;margin-top:4px"></div><div id="revengeDots" class="dots"></div></div><div class="card"><div style="display:flex;justify-content:space-between"><b id="rivalName">Rival</b><span id="rivalGap">—</span></div><div class="rivalBar"><div id="rivalFill" class="rivalFill"></div></div><div id="questionsAway" style="font-size:11px;color:#fbbf24"></div></div><div id="nearList"></div></div></aside><iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev',p=new URLSearchParams(location.search),file=p.get('file')||'',frame=document.getElementById('frame'),sid=()=>localStorage.getItem('uasaStudentId')||'',sname=()=>localStorage.getItem('uasaStudentName')||'',m=file.match(/Book_(\d+)/i),BOOK_NO=m?+m[1]:0,BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');let CURRENT_LEVEL=+(p.get('level')||sessionStorage.getItem('uasaCurrentLevel')||1),CLOUD={total_xp:0,current_streak:0,best_streak:0,books_started:0,books_mastered:0},LEVELS={},COMBO=0,MY_RANK=0,RIVAL=null,NEAR=[],REVENGE={active:false,targetRank:0,need:3,done:0,opponent:''};if(CURRENT_LEVEL<1||CURRENT_LEVEL>4)CURRENT_LEVEL=1;const DAY=new Date().toLocaleDateString('en-CA'),DK='uasaDaily:'+sid()+':'+DAY;let DAILY=JSON.parse(localStorage.getItem(DK)||'null')||{correct:0,bestCombo:0,levels:0,passes:0,claimed:{}};const MISSIONS=[{id:'correct10',name:'Answer 10 correctly',target:10,reward:100,get:()=>DAILY.correct},{id:'combo5',name:'Reach a 5 Combo',target:5,reward:75,get:()=>DAILY.bestCombo},{id:'level2',name:'Complete 2 Levels',target:2,reward:150,get:()=>DAILY.levels},{id:'pass1',name:'Pass 1 rival',target:1,reward:100,get:()=>DAILY.passes}];const PRAISE=['Correct! Nice hit.','Clean answer. Keep moving.','That one had no chance.','Sharp. Another one.','Easy XP. Keep going.'],TAUNTS=['Nope. That question stole your combo.','The correct answer watched you walk past it.','Wrong. The question wins this round.','Combo destroyed. Win it back.'];function saveDaily(){localStorage.setItem(DK,JSON.stringify(DAILY))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function levelObj(l){return LEVELS[BOOK_NO+'-'+l]||{mastery:0,unlocked:l===1?1:0}}function unlocked(l){return l===1||+levelObj(l).unlocked===1||+levelObj(l-1).mastery>=80}function perQ(){return COMBO>=10?20:COMBO>=5?15:COMBO>=3?12:10}function showToast(a,b='',type='',ms=1600){toastMain.textContent=a;toastSub.textContent=b;toast.className='toast '+type+' show';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),ms)}function xpPop(n){const e=document.createElement('div');e.className='xpPop';e.textContent='+'+n+' XP';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}async function claimMissions(){for(const q of MISSIONS){if(!DAILY.claimed[q.id]&&q.get()>=q.target){DAILY.claimed[q.id]=true;CLOUD.total_xp=+CLOUD.total_xp+q.reward;saveDaily();xpPop(q.reward);showToast('DAILY CHALLENGE COMPLETE!',q.name+' · +'+q.reward+' XP','lucky',2600);await saveCloud()}}renderDaily()}function renderDaily(){dailyList.innerHTML=MISSIONS.map(q=>{const v=Math.min(q.target,q.get()),done=!!DAILY.claimed[q.id];return `<div class="mission ${done?'done':''}"><div class="missionLine"><span>${done?'✓ ':''}${q.name}</span><b>${v}/${q.target} · +${q.reward}</b></div><div class="barMini"><div class="fillMini" style="width:${Math.min(100,v/q.target*100)}%"></div></div></div>`}).join('')}function refresh(){xp.textContent=+CLOUD.total_xp+' XP';streak.textContent=+CLOUD.current_streak;combo.textContent='COMBO ×'+COMBO;mastery.textContent='Level '+CURRENT_LEVEL+' Mastery '+(+levelObj(CURRENT_LEVEL).mastery||0)+'%';document.querySelectorAll('.level-btn').forEach(b=>{let n=+b.dataset.level;b.classList.toggle('active',n===CURRENT_LEVEL);b.classList.toggle('locked',!unlocked(n));b.textContent='Level '+n+(unlocked(n)?(+levelObj(n).mastery>=80?' ✓':''):' 🔒')});renderDaily();renderRank();renderRevenge()}toggle.onclick=()=>{panel.classList.toggle('closed');toggle.textContent=panel.classList.contains('closed')?'+':'−'};
async function saveCloud(extra={}){if(!sid())return;try{await fetch(API+'/api/progress/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),total_xp:+CLOUD.total_xp,current_streak:+CLOUD.current_streak,best_streak:+CLOUD.best_streak,books_started:+CLOUD.books_started,books_mastered:+CLOUD.books_mastered,...extra})})}catch(e){}}async function track(event_type,extra={}){try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,...extra,quiz_mode:'Level '+CURRENT_LEVEL})})}catch(e){}}async function loadCloud(){try{const d=await(await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid()))).json();CLOUD=Object.assign(CLOUD,d.progress||{});(d.levels||[]).forEach(x=>LEVELS[x.book_no+'-'+x.level_no]=x);refresh();sync.textContent='V2.7 · Daily Challenge · Rival Mode ON';await loadRanking()}catch(e){sync.textContent='Cloud unavailable'}}
function renderRank(){if(RIVAL){let rx=+RIVAL.total_xp||0,me=+CLOUD.total_xp||0,g=rx-me;rivalName.textContent=RIVAL.name||'Rival';rivalGap.textContent=Math.abs(g)+' XP '+(g>=0?'ahead':'behind');rivalFill.style.width=Math.min(100,Math.max(8,me/Math.max(rx,me,1)*100))+'%';questionsAway.textContent=g>0?'About '+Math.max(1,Math.ceil((g+1)/perQ()))+' correct answers to pass.':'You are ahead. Keep the lead.';rival.textContent='Rank #'+(MY_RANK||'?')+' · '+Math.abs(g)+' XP '+(g>=0?'behind ':'ahead of ')+(RIVAL.name||'Rival')}nearList.innerHTML=NEAR.map(x=>`<div class="near ${x.is_me?'me':''}"><span>#${x.rank}</span><span>${x.is_me?'YOU':String(x.name||'Student')}</span><b>${+x.total_xp||0} XP</b></div>`).join('')}async function loadRanking(){try{const d=await(await fetch(API+'/api/leaderboard?student_id='+encodeURIComponent(sid()))).json(),before=MY_RANK,old=[...NEAR];MY_RANK=+d.my_rank||0;RIVAL=d.rival||null;NEAR=d.near_me||d.leaderboard||[];if(before&&MY_RANK>before&&!REVENGE.active){let a=NEAR.find(x=>+x.rank===MY_RANK-1);startRevenge(before,a?.name||RIVAL?.name||'Someone')}if(before&&MY_RANK<before){DAILY.passes++;saveDaily();let a=old.find(x=>+x.rank===MY_RANK);showToast('YOU PASSED '+String(a?.name||'SOMEONE').toUpperCase()+'!','Rank #'+before+' → #'+MY_RANK,'rank',2300);await claimMissions()}renderRank()}catch(e){}}
function startRevenge(rank,name){REVENGE={active:true,targetRank:rank,need:3,done:0,opponent:name};panel.classList.remove('closed');showToast(String(name).toUpperCase()+' PASSED YOU!','Get 3 correct answers and take Rank #'+rank+' back.','bad',3000);renderRevenge()}function renderRevenge(){revengeBox.classList.toggle('active',REVENGE.active);if(!REVENGE.active)return;revengeText.textContent='Take Rank #'+REVENGE.targetRank+' back · '+REVENGE.done+'/3 correct';revengeDots.innerHTML=[0,1,2].map(i=>`<span class="dot ${i<REVENGE.done?'on':''}"></span>`).join('')}function revengeAnswer(ok){if(!REVENGE.active)return;if(ok){REVENGE.done++;if(REVENGE.done>=3)setTimeout(checkRevenge,300)}else{REVENGE.done=0;showToast('REVENGE RESET','Build 3 correct answers again.','bad')}renderRevenge()}async function checkRevenge(){await loadRanking();if(MY_RANK<=REVENGE.targetRank){REVENGE.active=false;showToast('REVENGE COMPLETE!','Rank #'+REVENGE.targetRank+' reclaimed.','rank',2700)}else{REVENGE.done=0;showToast('Still behind.','Keep attacking.','bad')}renderRevenge()}
async function lucky(){let chance=COMBO>=10?.12:COMBO>=5?.08:.05;if(Math.random()>chance)return;let a=[20,20,20,35,35,50,100],n=pick(a);CLOUD.total_xp+=n;xpPop(n);showToast('LUCKY QUESTION!','Mystery Box · +'+n+' XP','lucky',2400);await saveCloud();setTimeout(loadRanking,350)}function chooseLevel(n){if(!unlocked(n)){showToast('LEVEL LOCKED','Master Level '+(n-1)+' with 80% first.','bad');return}CURRENT_LEVEL=n;sessionStorage.setItem('uasaCurrentLevel',n);refresh()}document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>chooseLevel(+b.dataset.level));async function boot(){if(!sid()){sessionStorage.setItem('uasaPendingBook',file);location.replace('index.html?login=1');return}if(!/^[A-Za-z0-9_().%\-]+\.html$/.test(file))return;await loadCloud();frame.src=file;label.textContent=BOOK_TITLE}boot();refresh();
frame.addEventListener('load',()=>{track('book_open');try{const w=frame.contentWindow,d=frame.contentDocument;let lastKey='',correctN=0,attemptN=0;function txt(s){let e=d.querySelector(s);return e?(e.textContent||'').trim():''}function inspect(ans=''){let counter=txt('#counter'),result=txt('#result,.result'),question=txt('#prompt,#qPrompt,.prompt,.qprompt')||txt('#instruction'),ok=null;if(/Incorrect|答错了|Correct answer:/i.test(result))ok=false;else if(/Correct spelling|拼写正确|Correct!|答对了/i.test(result))ok=true;if(ok===null)return;let key=BOOK_NO+'|L'+CURRENT_LEVEL+'|'+counter+'|'+question;if(key===lastKey)return;lastKey=key;reward(ok);track('answer',{question_key:key,question_text:question,answer_text:String(ans),is_correct:ok});let mm=counter.match(/(\d+)\s*\/\s*(\d+)/);if(mm&&+mm[1]===+mm[2])finish(+mm[2])}async function reward(ok){attemptN++;revengeAnswer(ok);if(ok){correctN++;COMBO++;DAILY.correct++;DAILY.bestCombo=Math.max(DAILY.bestCombo,COMBO);CLOUD.current_streak++;CLOUD.best_streak=Math.max(+CLOUD.best_streak,+CLOUD.current_streak);let gain=perQ();CLOUD.total_xp+=gain;saveDaily();xpPop(gain);showToast(COMBO===10?'UNSTOPPABLE ×10':COMBO===5?'5 COMBO!':COMBO===3?'3 COMBO!':pick(PRAISE),'+'+gain+' XP');refresh();await saveCloud();await claimMissions();await lucky();setTimeout(loadRanking,400)}else{let lost=COMBO;COMBO=0;CLOUD.current_streak=0;showToast(pick(TAUNTS),lost?'Your ×'+lost+' combo is gone.':'Try the next one.','bad');refresh();await saveCloud()}}async function finish(total){let pct=Math.round(correctN/Math.max(attemptN,total)*100),old=levelObj(CURRENT_LEVEL),best=Math.max(+old.mastery||0,pct),mastered=best>=80;LEVELS[BOOK_NO+'-'+CURRENT_LEVEL]={...old,mastery:best,unlocked:1,mastered:mastered?1:0};DAILY.levels++;saveDaily();await saveCloud({book_no:BOOK_NO,level_no:CURRENT_LEVEL,mastery:best,attempts:attemptN,correct:correctN,unlocked:true,mastered});await claimMissions();showToast(pct===100?'PERFECT CLEAR!':mastered?'LEVEL MASTERED!':'LEVEL COMPLETE','Mastery '+best+'%'+(mastered?' · Next level unlocked':''),mastered?'rank':'bad',2700);refresh()}d.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let i=d.querySelector('#spellInput,#answerArea input,.textanswer,input.answer');setTimeout(()=>inspect(i?i.value:(b.textContent||'').trim()),180)},true);d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat){let a=d.activeElement;setTimeout(()=>inspect(a&&'value'in a?a.value:''),180)}},true);let r=d.querySelector('#result,.result');if(r)new MutationObserver(()=>setTimeout(()=>inspect(''),50)).observe(r,{childList:true,subtree:true,characterData:true})}catch(e){sync.textContent='Reader hook error'}});</script></body></html>
