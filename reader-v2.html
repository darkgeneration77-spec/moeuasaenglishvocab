<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOE UASA English Reader</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#071522}.bar{min-height:102px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#081a2c,#12375b);border-bottom:1px solid #2e5778;color:#fff;flex-wrap:wrap}.links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;text-decoration:none;color:#fff;background:#1b5f96;border:1px solid #6fc8e5;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.level-btn{background:#17324e;border-color:#3d6487}.level-btn.active{background:#2563eb;border-color:#93c5fd}.level-btn.locked{opacity:.45;cursor:not-allowed}.meta{text-align:right;min-width:320px}.title{font-size:13px;color:#c9deef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}.status{font-size:12px;margin-top:4px;color:#ffd166}.status.ok{color:#86efac}.status.bad{color:#fca5a5}.game{font-size:12px;margin-top:4px;color:#dbeafe}.game b{color:#fde68a}.rival{margin-top:5px;font-size:12px;color:#bfdbfe}.rival strong{color:#fbbf24}.combo{display:inline-block;padding:2px 7px;border-radius:999px;background:#351b09;color:#fdba74;font-weight:900}.frame{width:100%;height:calc(100% - 102px);border:0;background:#fff}.toast{position:fixed;z-index:9999;left:50%;top:120px;transform:translate(-50%,-20px) scale(.94);opacity:0;pointer-events:none;min-width:290px;max-width:min(590px,92vw);padding:18px 22px;border-radius:18px;text-align:center;color:#fff;font-weight:900;font-size:21px;box-shadow:0 18px 60px #0008;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.toast.good{background:linear-gradient(135deg,#065f46,#047857);border:2px solid #6ee7b7}.toast.bad{background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid #fca5a5}.toast.rank{background:linear-gradient(135deg,#713f12,#a16207);border:2px solid #fde68a}.toast.lucky{background:linear-gradient(135deg,#4c1d95,#7e22ce,#b45309);border:2px solid #fef08a;box-shadow:0 0 35px #facc1566,0 18px 60px #0009}.toast .small{display:block;font-size:13px;font-weight:700;margin-top:6px;color:#e5e7eb}.xp-pop{position:fixed;z-index:10000;right:30px;top:110px;font-size:26px;font-weight:1000;color:#fde047;text-shadow:0 3px 10px #000;animation:xpFly 1.1s ease forwards;pointer-events:none}.reward-burst{position:fixed;z-index:9998;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;top:42%;left:50%;font-size:28px;animation:spark 1.2s ease-out forwards}@keyframes spark{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.3)}}@keyframes xpFly{0%{opacity:0;transform:translateY(20px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-55px) scale(1)}}@media(max-width:760px){.bar{min-height:174px}.frame{height:calc(100% - 174px)}.title{display:none}.btn.dash{display:none}.meta{width:100%;min-width:0;text-align:left}.toast{top:185px}.xp-pop{top:175px}}</style></head><body><div class="bar"><div class="links"><a class="btn" href="index.html">← Home</a><a class="btn dash" href="student-dashboard.html">Student Dashboard</a><button class="btn level-btn" data-level="1">Level 1</button><button class="btn level-btn" data-level="2">Level 2</button><button class="btn level-btn" data-level="3">Level 3</button><button class="btn level-btn" data-level="4">Level 4</button></div><div class="meta"><div class="title" id="label">Learning Module</div><div class="status" id="sync">Loading cloud progress…</div><div class="game"><b id="xp">0 XP</b> · Streak <b id="streak">0</b> · <span id="combo" class="combo">COMBO ×0</span> · <span id="mastery">Level 1 Mastery 0%</span></div><div class="rival" id="rival">Finding your nearest rival…</div></div></div><div id="toast" class="toast"><span id="toastMain"></span><span class="small" id="toastSub"></span></div><div id="burst" class="reward-burst"></div><iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const p=new URLSearchParams(location.search),file=p.get('file')||'';const frame=document.getElementById('frame'),sync=document.getElementById('sync'),label=document.getElementById('label');const allowed=/^[A-Za-z0-9_().%\-]+\.html$/;const sid=()=>localStorage.getItem('uasaStudentId')||'';const sname=()=>localStorage.getItem('uasaStudentName')||'';const m=file.match(/Book_(\d+)/i),BOOK_NO=m?Number(m[1]):0;const BOOK_TITLE=decodeURIComponent(file).replace(/_/g,' ').replace(/\.html$/,'');let CURRENT_LEVEL=Number(p.get('level')||sessionStorage.getItem('uasaCurrentLevel')||1);if(CURRENT_LEVEL<1||CURRENT_LEVEL>4)CURRENT_LEVEL=1;sessionStorage.setItem('uasaCurrentLevel',CURRENT_LEVEL);let CLOUD={total_xp:0,current_streak:0,best_streak:0,books_started:0,books_mastered:0},LEVELS={},COMBO=0,MY_RANK=0,RIVAL=null;localStorage.setItem('uasaApiBase',API);
const PRAISE=['Correct! Nice hit.','Clean answer. Keep moving.','That one had no chance.','Sharp. Another one.','Correct. You are warming up.','Easy XP. Keep it going.','Perfect. Do not break the combo.'];const TAUNTS=['Nope. That question just stole your combo.','Almost. The correct answer watched you walk past it.','Wrong. The question wins this round.','Combo destroyed. Revenge on the next one.','Not this time. Read the clue and hit back.','That answer took the scenic route away from correct.','The question survived. You get another shot.'];const REWARDS=[{xp:20,label:'Small XP Pack',w:55},{xp:35,label:'Rare XP Pack',w:28},{xp:50,label:'Golden XP Pack',w:13},{xp:100,label:'JACKPOT XP',w:4}];function pick(a){return a[Math.floor(Math.random()*a.length)]}function setStatus(t,type=''){sync.textContent=t;sync.className='status '+type}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function levelObj(l){return LEVELS[BOOK_NO+'-'+l]||{mastery:0,attempts:0,correct:0,unlocked:l===1?1:0,mastered:0}}function masteryFor(l){return Number(levelObj(l).mastery||0)}function unlocked(l){return l===1||Number(levelObj(l).unlocked)===1||masteryFor(l-1)>=80}function refreshHUD(){xp.textContent=Number(CLOUD.total_xp||0)+' XP';streak.textContent=Number(CLOUD.current_streak||0);combo.textContent='COMBO ×'+COMBO;mastery.textContent='Level '+CURRENT_LEVEL+' Mastery '+masteryFor(CURRENT_LEVEL)+'%';document.querySelectorAll('.level-btn').forEach(b=>{const n=+b.dataset.level;b.classList.toggle('active',n===CURRENT_LEVEL);b.classList.toggle('locked',!unlocked(n));b.textContent='Level '+n+(unlocked(n)?(masteryFor(n)>=80?' ✓':''):' 🔒')});renderRival()}function levelSlice(a){if(!Array.isArray(a)||!a.length)return a;const z=Math.ceil(a.length/4),s=(CURRENT_LEVEL-1)*z;return a.slice(s,Math.min(s+z,a.length))}
let toastTimer;function showToast(main,sub='',type='good',ms=1450){toastMain.textContent=main;toastSub.textContent=sub;toast.className='toast '+type+' show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),ms)}function xpPop(n){const e=document.createElement('div');e.className='xp-pop';e.textContent='+'+n+' XP';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}function burst(){burst.innerHTML='';for(let i=0;i<16;i++){const e=document.createElement('span');e.className='spark';e.textContent=['★','✦','◆','●'][i%4];e.style.setProperty('--x',(Math.random()*500-250)+'px');e.style.setProperty('--y',(Math.random()*300-170)+'px');e.style.setProperty('--r',(Math.random()*720-360)+'deg');burst.appendChild(e)}setTimeout(()=>burst.innerHTML='',1300)}function drawReward(){let r=Math.random()*100;for(const x of REWARDS){r-=x.w;if(r<=0)return x}return REWARDS[0]}async function luckyReward(){const chance=COMBO>=10?.12:COMBO>=5?.08:.05;if(Math.random()>chance)return 0;const rw=drawReward();CLOUD.total_xp=Number(CLOUD.total_xp||0)+rw.xp;xpPop(rw.xp);burst();showToast('LUCKY QUESTION!','Mystery Box → '+rw.label+' · +'+rw.xp+' XP','lucky',2600);await saveCloud();setTimeout(checkRankChange,500);return rw.xp}
async function loadRanking(){try{const r=await fetch(API+'/api/leaderboard?student_id='+encodeURIComponent(sid()));if(!r.ok)throw 0;const d=await r.json();MY_RANK=Number(d.my_rank||0);RIVAL=d.rival||null;renderRival()}catch(e){rival.textContent='Rival ranking activates after leaderboard sync.'}}function renderRival(){if(!RIVAL){rival.textContent=MY_RANK?'Rank #'+MY_RANK+' · Keep climbing.':'Ranking sync pending…';return}const gap=Math.abs(Number(RIVAL.total_xp||0)-Number(CLOUD.total_xp||0));if(Number(RIVAL.total_xp||0)>=Number(CLOUD.total_xp||0))rival.innerHTML=`Rank #${MY_RANK||'?'} · <strong>${gap} XP</strong> behind ${escapeHtml(RIVAL.name||'Rival')}`;else rival.innerHTML=`Rank #${MY_RANK||'?'} · ${escapeHtml(RIVAL.name||'Rival')} is <strong>${gap} XP</strong> behind you`}async function checkRankChange(){const before=MY_RANK;await loadRanking();if(before&&MY_RANK&&MY_RANK<before)showToast('YOU PASSED SOMEONE!','Rank #'+before+' → #'+MY_RANK,'rank',2100);else if(before&&MY_RANK&&MY_RANK>before)showToast('Someone passed you.','Rank #'+before+' → #'+MY_RANK+' · Take it back.','bad',2100)}
async function loadCloud(){if(!sid())return;try{const r=await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid()));if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();CLOUD=Object.assign(CLOUD,d.progress||{});(d.levels||[]).forEach(x=>LEVELS[x.book_no+'-'+x.level_no]=x);if(!unlocked(CURRENT_LEVEL)){CURRENT_LEVEL=1;sessionStorage.setItem('uasaCurrentLevel',1);setStatus('Assigned level is locked · Level 1 opened instead','bad')}refreshHUD();setStatus('Cloud progress loaded · '+(sname()||'student'),'ok');loadRanking()}catch(e){setStatus('Cloud progress unavailable','bad')}}async function saveCloud(levelData={}){if(!sid())return false;const payload={student_id:sid(),total_xp:Number(CLOUD.total_xp||0),current_streak:Number(CLOUD.current_streak||0),best_streak:Number(CLOUD.best_streak||0),books_started:Number(CLOUD.books_started||0),books_mastered:Number(CLOUD.books_mastered||0),...levelData};try{const r=await fetch(API+'/api/progress/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.ok}catch(e){setStatus('Cloud progress sync failed','bad');return false}}async function track(event_type,extra={}){if(!sid()||!BOOK_NO)return false;const mode=extra.quiz_mode?'Level '+CURRENT_LEVEL+' · '+extra.quiz_mode:'Level '+CURRENT_LEVEL;try{const r=await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid(),book_no:BOOK_NO,book_title:BOOK_TITLE,event_type,...extra,quiz_mode:mode})});return r.ok}catch(e){return false}}
function chooseLevel(n){if(!unlocked(n)){setStatus('Level '+n+' locked · Master Level '+(n-1)+' with 80% first','bad');return}CURRENT_LEVEL=n;sessionStorage.setItem('uasaCurrentLevel',n);refreshHUD();try{applyLevelHooks();installFullLevelQuizOverride()}catch(e){}}document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>chooseLevel(+b.dataset.level));async function boot(){if(!sid()){sessionStorage.setItem('uasaPendingBook',file);location.replace('index.html?login=1');return}if(!allowed.test(file)||['index.html','reader.html','reader-v2.html'].includes(file)){setStatus('Invalid module','bad');return}await loadCloud();frame.src=file;label.textContent=BOOK_TITLE}boot();refreshHUD();function applyLevelHooks(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;['WORDS','ENTRIES','QUESTIONS','Q'].forEach(n=>{try{if(Array.isArray(w[n])){const all='__ALL_'+n;if(!w[all])w[all]=[...w[n]];const sl=levelSlice(w[all]);w[n].splice(0,w[n].length,...sl);const counter=d.getElementById('wordCount')||d.getElementById('totalQuestions')||d.getElementById('questionCount');if(counter)counter.textContent=sl.length}}catch(e){}})}function installFullLevelQuizOverride(){const w=frame.contentWindow;if(!w)return;try{w.eval(`(function(){if(window.__UASA_FULL_LEVEL_QUIZ__)return;window.__UASA_FULL_LEVEL_QUIZ__=true;function source(){try{if(typeof WORDS!=='undefined'&&Array.isArray(WORDS)&&WORDS.length)return [...WORDS]}catch(e){}try{if(typeof ENTRIES!=='undefined'&&Array.isArray(ENTRIES)&&ENTRIES.length)return [...ENTRIES]}catch(e){}try{if(typeof QUESTIONS!=='undefined'&&Array.isArray(QUESTIONS)&&QUESTIONS.length)return [...QUESTIONS]}catch(e){}try{if(typeof Q!=='undefined'&&Array.isArray(Q)&&Q.length)return [...Q]}catch(e){}return []}function force(){try{const src=source();if(!src.length)return;if(typeof quiz!=='undefined'&&Array.isArray(quiz)){quiz=typeof shuffle==='function'?shuffle(src):[...src];if(typeof qi!=='undefined')qi=0;if(typeof score!=='undefined')score=0;if(typeof answered!=='undefined')answered=false;if(typeof showQuestion==='function')showQuestion()}else if(typeof questions!=='undefined'&&Array.isArray(questions)){questions=typeof shuffle==='function'?shuffle(src):[...src];if(typeof current!=='undefined')current=0;if(typeof currentQuestion!=='undefined')currentQuestion=0;if(typeof score!=='undefined')score=0;if(typeof renderQuestion==='function')renderQuestion();if(typeof showQuestion==='function')showQuestion()}}catch(e){}}['startQuiz','startTest','startPractice','startFinal','beginQuiz','beginTest'].forEach(function(name){try{const fn=window[name];if(typeof fn==='function'&&!fn.__uasaWrapped){const wrapped=function(){const out=fn.apply(this,arguments);setTimeout(force,0);return out};wrapped.__uasaWrapped=true;window[name]=wrapped}}catch(e){}});window.__uasaForceFullLevelQuiz=force;})();`)}catch(e){}}
frame.addEventListener('load',()=>{track('book_open');CLOUD.books_started=Math.max(Number(CLOUD.books_started||0),1);saveCloud();try{const w=frame.contentWindow,d=frame.contentDocument;applyLevelHooks();installFullLevelQuizOverride();let lastKey='',levelCorrect=0,levelAttempts=0;function txt(sel){const e=d.querySelector(sel);return e?(e.textContent||'').trim():''}function extractCorrect(){const result=txt('#result,.result');const mm=result.match(/Correct answer:\s*([^—\n]+)/i);if(mm)return mm[1].trim();try{if(Array.isArray(w.quiz)&&w.quiz[w.qi]){const q=w.quiz[w.qi];return String(q.en||q.answer||q.correct||q.correctAnswer||q.word||'').trim()}}catch(e){}try{if(Array.isArray(w.QUESTIONS)&&w.QUESTIONS[w.qi]){const q=w.QUESTIONS[w.qi];return String(q.answer||q.correct||q.correctAnswer||q.ans||'').trim()}}catch(e){}return ''}
async function reward(ok){levelAttempts++;let gain=0;if(ok){levelCorrect++;COMBO++;CLOUD.current_streak=Number(CLOUD.current_streak||0)+1;CLOUD.best_streak=Math.max(Number(CLOUD.best_streak||0),Number(CLOUD.current_streak||0));gain=COMBO>=10?20:COMBO>=5?15:COMBO>=3?12:10;CLOUD.total_xp=Number(CLOUD.total_xp||0)+gain;xpPop(gain);let msg=pick(PRAISE),sub='+'+gain+' XP';if(COMBO===3){msg='3 COMBO!';sub='You are warming up. +'+gain+' XP'}if(COMBO===5){msg='5 COMBO!';sub='Do not let the next question break it. +'+gain+' XP'}if(COMBO===10){msg='UNSTOPPABLE ×10';sub='Bonus XP activated. +'+gain+' XP'}showToast(msg,sub,'good');refreshHUD();await saveCloud();await luckyReward();setTimeout(checkRankChange,400)}else{const lost=COMBO;COMBO=0;CLOUD.current_streak=0;showToast(pick(TAUNTS),lost?'Your ×'+lost+' combo is gone. Win it back.':'Read the clue and try the next one.','bad');refreshHUD();await saveCloud()}}
async function finish(total){const pct=Math.round(levelCorrect/Math.max(levelAttempts,+total||levelAttempts)*100),old=levelObj(CURRENT_LEVEL),best=Math.max(Number(old.mastery||0),pct),mastered=best>=80;LEVELS[BOOK_NO+'-'+CURRENT_LEVEL]={...old,book_no:BOOK_NO,level_no:CURRENT_LEVEL,mastery:best,attempts:Math.max(Number(old.attempts||0),levelAttempts),correct:Math.max(Number(old.correct||0),levelCorrect),unlocked:1,mastered:mastered?1:Number(old.mastered||0)};if(mastered&&CURRENT_LEVEL<4){const nx=levelObj(CURRENT_LEVEL+1);LEVELS[BOOK_NO+'-'+(CURRENT_LEVEL+1)]={...nx,book_no:BOOK_NO,level_no:CURRENT_LEVEL+1,unlocked:1}}if(mastered&&CURRENT_LEVEL===4)CLOUD.books_mastered=Number(CLOUD.books_mastered||0)+1;refreshHUD();await saveCloud({book_no:BOOK_NO,level_no:CURRENT_LEVEL,mastery:best,attempts:levelAttempts,correct:levelCorrect,unlocked:true,mastered});if(pct===100)showToast('PERFECT CLEAR!','Level '+CURRENT_LEVEL+' · 100% · No mistakes','rank',3000);else if(mastered)showToast('LEVEL MASTERED!','Level '+CURRENT_LEVEL+' · '+best+'% · Next challenge unlocked','rank',2800);else showToast('LEVEL COMPLETE','Mastery '+best+'% · Reach 80% to unlock the next level','bad',2600);setStatus(mastered?'Level '+CURRENT_LEVEL+' Mastered · '+best+'% · Cloud saved':'Level '+CURRENT_LEVEL+' '+best+'% · Need 80%',mastered?'ok':'bad')}
function inspect(answerText=''){const counter=txt('#counter'),result=txt('#result,.result'),question=txt('#prompt,#qPrompt,.prompt,.qprompt')||txt('#instruction'),mode=txt('#quizTitle,#title,.top b');let correct=null;if(/Incorrect|答错了|Correct answer:/i.test(result))correct=false;else if(/Correct spelling|拼写正确|Correct!|答对了/i.test(result))correct=true;if(correct===null)return;const k=BOOK_NO+'|L'+CURRENT_LEVEL+'|'+counter+'|'+question;if(k===lastKey)return;lastKey=k;const correctAnswer=extractCorrect();reward(correct);track('answer',{question_key:k,question_text:question,answer_text:String(answerText||''),is_correct:correct,quiz_mode:mode,correct_answer:correctAnswer});const mm=counter.match(/(\d+)\s*\/\s*(\d+)/);if(mm&&+mm[1]===+mm[2]){finish(mm[2]);track('quiz_complete',{question_key:k+'|complete',quiz_mode:mode})}}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const inp=d.querySelector('#spellInput,#answerArea input,.textanswer,input.answer');const val=inp?inp.value:(b.textContent||'').trim();setTimeout(()=>inspect(val),180)},true);d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat){const a=d.activeElement,v=a&&'value'in a?a.value:'';setTimeout(()=>inspect(v),180)}},true);const re=d.querySelector('#result,.result');if(re)new MutationObserver(()=>{const inp=d.querySelector('#spellInput,#answerArea input,.textanswer,input.answer');setTimeout(()=>inspect(inp?inp.value:''),40)}).observe(re,{childList:true,subtree:true,characterData:true});setStatus('V2.4 · Combo · Rival · Lucky Rewards ON','ok')}catch(e){setStatus('Reader hook error: '+e.message,'bad')}});</script></body></html>
