let progress=JSON.parse(localStorage.getItem("uasa22fullProgress")||'{"done":[],"correct":[],"wrong":[]}');
questionCount.textContent=QUESTIONS.length;
function save(){localStorage.setItem("uasa22fullProgress",JSON.stringify(progress))}
function render(){
 const lv=levelFilter.value;content.innerHTML="";
 SETS.forEach((s,i)=>{
   if(lv&&s.level!==lv)return;
   const sec=document.createElement("section");sec.className="set";
   sec.innerHTML=`<h2>${s.title} <small>(${s.level})</small></h2><div class="passage">${s.passage}</div>`;
   QUESTIONS.filter(q=>q.setIndex===i).forEach(q=>{
     const card=document.createElement("div");card.className="question";
     card.innerHTML=`<h3>Blank (${q.blank})</h3><div class="choices"></div><div class="explain"></div>`;
     const box=card.querySelector(".choices");
     q.options.forEach((opt,idx)=>{
       const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+idx)+". "+opt;
       b.onclick=()=>answer(q,b,opt,card);box.appendChild(b)
     });
     sec.appendChild(card)
   });
   content.appendChild(sec)
 });
 renderStats()
}
function answer(q,btn,val,card){
 if(card.dataset.answered==="1")return;card.dataset.answered="1";
 card.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.answer)b.classList.add("correct")});
 const ok=val===q.answer;if(!ok)btn.classList.add("wrong");
 if(!progress.done.includes(q.id))progress.done.push(q.id);
 if(ok){if(!progress.correct.includes(q.id))progress.correct.push(q.id);progress.wrong=progress.wrong.filter(id=>id!==q.id)}
 else{progress.correct=progress.correct.filter(id=>id!==q.id);if(!progress.wrong.includes(q.id))progress.wrong.push(q.id)}
 const ex=card.querySelector(".explain");ex.style.display="block";ex.innerHTML=`<b>${ok?"Correct! 答对了。":"Incorrect. 答错了。"}</b><br>Correct answer: ${q.answer}<br>${q.explain}`;
 save();renderStats()
}
function renderStats(){
 const done=progress.done.length,correct=progress.correct.length,wrong=progress.wrong.length,pct=done?Math.round(correct/done*100):0;
 doneCount.textContent=done;wrongCount.textContent=wrong;accuracy.textContent=pct+"%";overall.style.width=Math.round(done/QUESTIONS.length*100)+"%";
 progressText.textContent=`${done}/${QUESTIONS.length} completed · ${correct} correct · ${wrong} wrong`;
 const arr=QUESTIONS.filter(q=>progress.wrong.includes(q.id));
 wrongList.innerHTML=arr.length?arr.map(q=>`<div class="wrongitem"><b>${q.setTitle} — Blank ${q.blank}</b><br><small>Answer: ${q.answer}<br>${q.explain}</small></div>`).join(""):"<p>No wrong answers yet.</p>"
}
function showAll(){levelFilter.value="";render()}
function showWrongOnly(){
 const arr=QUESTIONS.filter(q=>progress.wrong.includes(q.id));content.innerHTML="<section class='set'><h2>Wrong Book Practice</h2></section>";const sec=content.querySelector("section");
 arr.forEach(q=>{const card=document.createElement("div");card.className="question";card.innerHTML=`<div class="passage">${q.passage}</div><h3>${q.setTitle} — Blank (${q.blank})</h3><div class="choices"></div><div class="explain"></div>`;const box=card.querySelector(".choices");q.options.forEach((opt,idx)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+idx)+". "+opt;b.onclick=()=>answer(q,b,opt,card);box.appendChild(b)});sec.appendChild(card)})
}
function resetProgress(){progress={done:[],correct:[],wrong:[]};save();render()}
levelFilter.addEventListener("change",render);render();
</script></body></html>
