<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Intervention</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.btn,input,select,textarea{padding:11px 13px;border-radius:10px;border:1px solid #31516f}.btn{background:#1b5f96;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}.muted{color:#9db4cc}.good{color:#86efac}.pending{color:#fcd34d}.item{padding:12px 0;border-bottom:1px solid #294b6d}.code{font-family:monospace;color:#f8c65c}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1>Teacher Intervention 补救任务派发</h1><div class="muted">指定学生 · Book · Level · 错题重练 · 自定义任务</div></div><a class="btn" href="teacher-dashboard.html">返回 Teacher Dashboard</a></div><div class="card"><input id="key" type="password" placeholder="Teacher Key"><button class="btn" onclick="loadStudents()">进入</button></div><div id="main" style="display:none"><div class="card"><h2>新任务</h2><div class="row"><select id="student"></select><select id="type" onchange="typeChanged()"><option value="level">Book Level Practice</option><option value="wrong_retry">Wrong Question Retry</option><option value="boss">Boss Test</option><option value="custom">Custom Task</option></select><select id="book"></select></div><div class="row" style="margin-top:10px"><select id="level"><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option></select><input id="title" placeholder="Task title"><input id="instruction" placeholder="Instruction"></div><button class="btn" style="margin-top:12px" onclick="assign()">派发任务 Assign</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div class="card"><h2>任务记录</h2><div id="list" class="muted">暂无资料。</div></div></div></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';let teacherKey='';for(let i=1;i<=26;i++)book.innerHTML+=`<option value="${i}">Book ${i}</option>`;function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function typeChanged(){const t=type.value;book.disabled=t==='wrong_retry'||t==='custom';level.disabled=t!=='level';if(t==='wrong_retry')title.value='Complete Wrong Question Retry';else if(t==='boss')title.value='Complete Boss Test';else if(t==='level')title.value=`Practice Book ${book.value} Level ${level.value}`;else title.value=''}book.onchange=level.onchange=()=>{if(type.value==='level')title.value=`Practice Book ${book.value} Level ${level.value}`};async function loadStudents(){teacherKey=key.value.trim();if(!teacherKey)return;const r=await fetch(API+'/api/teacher/students?key='+encodeURIComponent(teacherKey));if(!r.ok)return alert('Unauthorized');const d=await r.json();student.innerHTML=(d.students||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.class_name||'')} · ${esc(x.student_code||'')}</option>`).join('');main.style.display='block';typeChanged();loadAssignments()}async function assign(){const payload={student_id:student.value,task_type:type.value,book_no:Number(book.value||0),level_no:Number(level.value||0),title:title.value.trim()||'Teacher Assignment',instruction:instruction.value.trim()};const r=await fetch(API+'/api/teacher/assignments/create?key='+encodeURIComponent(teacherKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();msg.textContent=r.ok?'任务已派发 ✓':(d.error||'Failed');if(r.ok)loadAssignments()}async function loadAssignments(){const r=await fetch(API+'/api/teacher/assignments?key='+encodeURIComponent(teacherKey));if(!r.ok)return;const d=await r.json();list.innerHTML=(d.assignments||[]).map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="code">${esc(x.student_code||'')}</span> · ${esc(x.title)}<div class="muted">${esc(x.instruction||'')} · ${x.status==='completed'?'<span class="good">Completed ✓</span>':'<span class="pending">Pending</span>'} · ${esc(x.created_at||'')}</div></div>`).join('')||'<p class="muted">暂无任务。</p>'}</script></body></html>
