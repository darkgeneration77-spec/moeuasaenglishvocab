<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Book 3 Battle Arena V4</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#071522,#17355c);color:#fff}body{padding:8px;display:flex;justify-content:center}.game{width:min(100%,940px);background:#0e2943;border:1px solid #416d8b;border-radius:22px;padding:12px}.top,.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title{flex:1;text-align:center;min-width:260px}.title b{font-size:20px}.title small{display:block;color:#a9cee8}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:900;background:#1b5f96;color:#fff;cursor:pointer}.btn.active{background:#f59e0b;color:#172033}.levels{justify-content:center;margin:9px 0}.levelBtn{min-width:58px}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:9px 0}.score,.left{background:#10253a;border:1px solid #31516f;border-radius:13px;padding:8px 11px;font-weight:900}.score.blue{text-align:right}.left{color:#fde68a;text-align:center}.question{background:#162b46;border:1px solid #31587c;border-radius:14px;padding:8px 11px;text-align:center}.type{font-size:11px;color:#9fc6e5;font-weight:900}.clue{font-size:18px;font-weight:900;margin-top:3px}.sub{font-size:12px;color:#bfdbfe;margin-top:3px}.status{text-align:center;min-height:24px;padding:4px;font-weight:900;color:#bfdbfe}.arena{display:block;width:100%;aspect-ratio:800/470;background:#234a61;border:2px solid #3f7191;border-radius:17px;touch-action:none}.bottom{display:grid;grid-template-columns:190px 1fr 190px;gap:12px;align-items:center;margin-top:10px}.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:6px;justify-content:center}.dpad button{border:0;border-radius:13px;background:#2563eb;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 4px 0 #123f8c;touch-action:none;cursor:pointer}.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #123f8c;background:#60a5fa}.blank{visibility:hidden}.help{text-align:center;color:#b6d6ed;font-size:12px;line-height:1.65}.p2pad{visibility:hidden}.two .p2pad{visibility:visible}.overlay{position:fixed;inset:0;background:#020617ee;display:none;align-items:center;justify-content:center;z-index:20}.overlay.show{display:flex}.card{background:#10253a;border:1px solid #4f7390;border-radius:18px;padding:22px;max-width:470px;text-align:center}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.resultGrid div{background:#071522;border-radius:10px;padding:10px}@media(max-width:720px){.bottom{grid-template-columns:1fr 1fr}.help{grid-column:1/-1;grid-row:1}.scorebar{grid-template-columns:1fr 1fr}.left{grid-column:1/-1;grid-row:2}.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,50px)}.title b{font-size:17px}.clue{font-size:16px}}</style></head><body><div class="game" id="game"><div class="top"><button class="btn" id="backBtn">← 返回</button><div class="title"><b>Book 3 · Confusing Words Battle Arena</b><small id="levelInfo">Level 1 · Words 1–20</small></div><button class="btn active" id="oneBtn">1P VS CPU</button><button class="btn" id="twoBtn">2 Players</button></div><div class="levels" id="levels"></div><div class="scorebar"><div class="score">YOU / P1 <span id="scoreRed">0</span></div><div class="left"><span id="claimed">0</span>/<span id="total">20</span> · <span id="remain">20</span> LEFT</div><div class="score blue"><span id="blueName">CPU</span> <span id="scoreBlue">0</span></div></div><div class="question"><div class="type" id="qType">CONTEXT</div><div class="clue" id="clue">Loading…</div><div class="sub" id="sub"></div></div><div class="status" id="status">用下面方向键移动 YOU。</div><canvas class="arena" id="arena" width="800" height="470"></canvas><div class="bottom"><div class="dpad"><button class="blank"></button><button data-p1="up">▲</button><button class="blank"></button><button data-p1="left">◀</button><button data-p1="down">▼</button><button data-p1="right">▶</button></div><div class="help"><b>P1：方向键 / WASD</b><br>CPU 每题等 3 秒才启动<br>词汇会缓慢移动 · 撞错冻结</div><div class="dpad p2pad"><button class="blank"></button><button data-p2="up">▲</button><button class="blank"></button><button data-p2="left">◀</button><button data-p2="down">▼</button><button data-p2="right">▶</button></div></div></div><div class="overlay" id="overlay"><div class="card"><h2 id="endTitle"></h2><div id="endText"></div><button class="btn" id="againBtn">再战一次</button></div></div><script>(()=>{const API='https://moe-uasa-english-api.darkgeneration77.workers.dev',qs=new URLSearchParams(location.search),file=qs.get('file')||'MOE_UASA_English_Vocabulary_Book_3_Confusing_Words_original.html',$=id=>document.getElementById(id),c=$('arena'),ctx=c.getContext('2d'),W=800,H=470;let groups=[],words=[],level=1,levelWords=[],queue=[],target=null,opts=[],mode=1,locked=false,over=false,scoreR=0,scoreB=0,wrongR=0,attemptR=0,correctR=0,raf=0,nextTimer=0,cpuStart=0,cpuGoal=null,cpuThink=0;const red={x:80,y:235,w:32,h:22,s:5.5,freeze:0},blue={x:720,y:235,w:32,h:22,s:2.45,freeze:0},p1={up:false,down:false,left:false,right:false},p2={up:false,down:false,left:false,right:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function safe(v){return String(v??'')}function rect(a,b){return !(b.x>a.x+a.w||b.x+b.w<a.x||b.y>a.y+a.h||b.y+b.h<a.y)}function msg(type,data={}){try{parent.postMessage({source:'uasa-ninja',game:'book3-battle',type,book_no:3,level,...data},location.origin)}catch(e){}}function topSafe(){try{const d=parent.parent?.document||parent.document;if(!d||d.getElementById('b3SafeToast'))return;const s=d.createElement('style');s.id='b3SafeToast';s.textContent='.toast{top:8px!important;left:auto!important;right:320px!important;transform:none!important;max-width:300px!important;padding:6px 10px!important;font-size:12px!important}.toast.show{transform:none!important}.xpPop{top:50px!important;right:320px!important;font-size:15px!important}@media(max-width:900px){.toast{right:8px!important;max-width:260px!important}.xpPop{right:8px!important}}';d.head.appendChild(s)}catch(e){}}topSafe();async function track(event_type,extra={}){const sid=localStorage.getItem('uasaStudentId')||'';if(!sid)return;try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,book_no:3,book_title:'Book 3 Confusing Words',event_type,quiz_mode:'Book 3 Battle L'+level,...extra})})}catch(e){}}function makeWords(){words=[];groups.forEach((g,gi)=>g.items.forEach((it,ii)=>words.push({word:it.word,use:it.use||'',example:it.example||'',group:g.title,zh:g.zh||'',ms:g.ms||'',rule:g.rule||'',gi,ii})))}function buildLevels(){levels.innerHTML='';for(let i=1;i<=7;i++){const b=document.createElement('button');b.className='btn levelBtn'+(i===level?' active':'');b.textContent='L'+i;b.onclick=()=>setLevel(i);levels.appendChild(b)}}function setLevel(n){level=n;const start=(n-1)*20,end=n<7?Math.min(start+20,words.length):words.length;levelWords=words.slice(start,end);levelInfo.textContent='Level '+n+' · Words '+(start+1)+'–'+end+' · '+levelWords.length+' words';buildLevels();reset()}function question(t){const types=['example','use','meaning'],type=types[Math.floor(Math.random()*types.length)];if(type==='example'&&t.example){let re=new RegExp('\\b'+safe(t.word).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),x=t.example.replace(re,'_____');qType.textContent='SENTENCE CLUE';clue.textContent=x;sub.textContent=t.group}else if(type==='use'&&t.use){qType.textContent='USE / 用法';clue.textContent=t.use;sub.textContent=t.group}else{qType.textContent='MEANING CLUE';clue.textContent=(t.zh?'华语：'+t.zh:'')+(t.ms?' · BM：'+t.ms:'');sub.textContent=t.use||t.group}}function spot(existing){for(let i=0;i<60;i++){const p={x:110+Math.random()*580,y:75+Math.random()*315};if(existing.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>110))return p}return{x:120+Math.random()*560,y:90+Math.random()*290}}function makeOpts(){let same=words.filter(x=>x.gi===target.gi&&x.word!==target.word),other=words.filter(x=>x.gi!==target.gi&&x.word!==target.word),pick=[];for(const x of [...shuffle(same),...shuffle(other)]){if(!pick.some(p=>p.word===x.word)){pick.push(x);if(pick.length===3)break}}opts=[];for(const x of shuffle([target,...pick])){const p=spot(opts),a=Math.random()*Math.PI*2,sp=.22+Math.random()*.24;opts.push({...x,x:p.x,y:p.y,w:82,h:29,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,correct:x.word===target.word})}}function resetPos(){red.x=80;red.y=235;blue.x=720;blue.y=235;red.freeze=blue.freeze=0}function newRound(){clearTimeout(nextTimer);if(!queue.length)return finish();locked=false;target=queue.shift();makeOpts();question(target);resetPos();cpuGoal=null;cpuStart=performance.now()+3000;cpuThink=cpuStart;status.textContent='Level '+level+'：你先行动 3 秒。'}function complete(side){if(locked)return;locked=true;const mine=side==='r';if(mine){scoreR++;correctR++;attemptR++;msg('answer',{ok:true,delta:10,question_key:'B3|L'+level+'|'+target.group+'|'+target.word,word:target.word});track('answer',{question_key:'B3|L'+level+'|'+target.group+'|'+target.word,question_text:clue.textContent,answer_text:target.word,is_correct:true})}else scoreB++;scoreRed.textContent=scoreR;scoreBlue.textContent=scoreB;const done=scoreR+scoreB;claimed.textContent=done;remain.textContent=Math.max(0,levelWords.length-done);status.textContent=(mine?'YOU':'CPU/P2')+' 抢到 '+target.word+'！';nextTimer=setTimeout(newRound,1200)}function wrong(side,word){if(locked)return;if(side==='r'){red.freeze=72;wrongR++;attemptR++;msg('answer',{ok:false,delta:-5,question_key:'B3|L'+level+'|'+target.group+'|'+target.word,word})}else blue.freeze=72;status.textContent=(side==='r'?'YOU':'CPU/P2')+' 撞错 '+word+'，冻结。'}function hit(car,side){if(locked)return;const cr={x:car.x-car.w/2,y:car.y-car.h/2,w:car.w,h:car.h};for(const o of opts){if(rect(cr,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})){o.correct?complete(side):wrong(side,o.word);car.x=side==='r'?80:720;car.y=235;break}}}function move(car,state){if(car.freeze>0){car.freeze--;return}let dx=(state.right?1:0)-(state.left?1:0),dy=(state.down?1:0)-(state.up?1:0);if(!dx&&!dy)return;const m=Math.max(1,Math.hypot(dx,dy));car.x=Math.max(20,Math.min(W-20,car.x+dx/m*car.s));car.y=Math.max(20,Math.min(H-20,car.y+dy/m*car.s))}function targets(){for(const o of opts){o.x+=o.vx;o.y+=o.vy;if(o.x-o.w/2<15||o.x+o.w/2>W-15)o.vx*=-1;if(o.y-o.h/2<42||o.y+o.h/2>H-15)o.vy*=-1;o.x=Math.max(15+o.w/2,Math.min(W-15-o.w/2,o.x));o.y=Math.max(42+o.h/2,Math.min(H-15-o.h/2,o.y))}}function chooseCpu(){const good=opts.find(o=>o.correct),bad=opts.filter(o=>!o.correct);cpuGoal=Math.random()<.23?(bad[Math.floor(Math.random()*bad.length)]||good):good;cpuThink=performance.now()+1300+Math.random()*1000}function cpu(){if(mode!==1||locked)return;if(blue.freeze>0){blue.freeze--;return}const now=performance.now();if(now<cpuStart)return;if(!cpuGoal||now>cpuThink)chooseCpu();if(!cpuGoal)return;const dx=cpuGoal.x-blue.x,dy=cpuGoal.y-blue.y,d=Math.hypot(dx,dy)||1;blue.x=Math.max(20,Math.min(W-20,blue.x+dx/d*blue.s));blue.y=Math.max(20,Math.min(H-20,blue.y+dy/d*blue.s))}function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function drawCar(car,label,color){ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle=car.freeze>0?'#64748b':color;rr(-16,-11,32,22,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,2);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#234a61';ctx.fillRect(0,0,W,H);for(const o of opts){ctx.fillStyle='#f5c542';ctx.strokeStyle='#b37b1a';ctx.lineWidth=2;rr(o.x-o.w/2,o.y-o.h/2,o.w,o.h,8);ctx.fill();ctx.stroke();ctx.fillStyle='#172531';ctx.font='bold 13px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.word.length>11?o.word.slice(0,11)+'…':o.word,o.x,o.y)}drawCar(red,'YOU','#e63e3e');drawCar(blue,mode===1?'CPU':'P2','#3a7bd5')}function loop(){if(!over){targets();move(red,p1);hit(red,'r');if(mode===2){move(blue,p2);hit(blue,'b')}else{cpu();hit(blue,'b')}draw()}raf=requestAnimationFrame(loop)}function finish(){over=true;const acc=Math.round(correctR/Math.max(1,attemptR)*100),win=scoreR>scoreB;endTitle.textContent=win?'YOU WIN!':scoreR===scoreB?'DRAW!':(mode===1?'CPU WINS':'P2 WINS');endText.innerHTML='<div class="resultGrid"><div><b>'+scoreR+'</b><br>YOU</div><div><b>'+scoreB+'</b><br>'+(mode===1?'CPU':'P2')+'</div><div><b>'+acc+'%</b><br>Accuracy</div><div><b>'+wrongR+'</b><br>Wrong Hits</div></div><div>Level '+level+' completed · '+levelWords.length+' words</div>';overlay.classList.add('show');msg('level_complete',{total:levelWords.length,correct:scoreR,wrong_cuts:wrongR,score:scoreR*10,accuracy:acc,mastered:acc>=80})}function reset(){clearTimeout(nextTimer);scoreR=scoreB=wrongR=attemptR=correctR=0;over=false;overlay.classList.remove('show');scoreRed.textContent=scoreBlue.textContent='0';queue=shuffle(levelWords);claimed.textContent='0';total.textContent=levelWords.length;remain.textContent=levelWords.length;newRound()}function bindPad(sel,state){document.querySelectorAll(sel).forEach(b=>{const k=b.dataset.p1||b.dataset.p2;const on=e=>{e.preventDefault();state[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();state[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)})}bindPad('[data-p1]',p1);bindPad('[data-p2]',p2);addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w')p1.up=true;if(k==='s')p1.down=true;if(k==='a')p1.left=true;if(k==='d')p1.right=true;if(e.key==='ArrowUp')p2.up=true;if(e.key==='ArrowDown')p2.down=true;if(e.key==='ArrowLeft')p2.left=true;if(e.key==='ArrowRight')p2.right=true});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w')p1.up=false;if(k==='s')p1.down=false;if(k==='a')p1.left=false;if(k==='d')p1.right=false;if(e.key==='ArrowUp')p2.up=false;if(e.key==='ArrowDown')p2.down=false;if(e.key==='ArrowLeft')p2.left=false;if(e.key==='ArrowRight')p2.right=false});oneBtn.onclick=()=>{mode=1;game.classList.remove('two');oneBtn.classList.add('active');twoBtn.classList.remove('active');blueName.textContent='CPU';reset()};twoBtn.onclick=()=>{mode=2;game.classList.add('two');twoBtn.classList.add('active');oneBtn.classList.remove('active');blueName.textContent='P2';reset()};againBtn.onclick=reset;backBtn.onclick=()=>history.back();async function load(){try{const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+GROUPS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('GROUPS not found');groups=Function('return '+m[1])();makeWords();buildLevels();setLevel(1);cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}catch(e){clue.textContent='无法读取 Book 3 词汇';status.textContent='Battle Arena 载入失败'}}load()})();</script></body></html>
