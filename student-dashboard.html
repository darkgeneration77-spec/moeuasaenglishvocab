<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1160px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{padding:11px 13px;border-radius:10px;border:1px solid #31516f;background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat b{font-size:27px;display:block}.muted{color:#9db4cc}.good{color:#86efac}.bad{color:#fca5a5}.gold{color:#f8c65c}.book{padding:14px 0;border-bottom:1px solid #294b6d}.bar{height:10px;background:#17314b;border-radius:999px;overflow:hidden;margin:7px 0}.fill{height:100%;background:#60a5fa}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.level{border:1px solid #31516f;background:#10253a;border-radius:11px;padding:10px}.level.mastered{border-color:#3d8b64;background:#102c25}.level.locked{opacity:.55}.level strong{display:block;margin-bottom:4px}.wrongItem{padding:14px;border:1px solid #5b2b35;background:#241922;border-radius:12px;margin:10px 0}.wrongQ{font-weight:800;line-height:1.5}.answer{margin-top:7px;color:#fca5a5}.mode{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#17283b;color:#9db4cc;font-size:12px}.recommend{border-left:5px solid #f8c65c}.empty{text-align:center;padding:34px;color:#9db4cc}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div><h1>学生学习 Dashboard</h1><div id="studentLabel" class="muted">Loading…</div></div><div><a class="btn" href="index.html">返回主页</a></div></div><div id="needLogin" class="card" style="display:none"><h2>请先从主页登记学生姓名</h2><p class="muted">Dashboard 只显示当前学生的资料。</p><a class="btn" href="index.html">回主页登记</a></div><div id="dash" style="display:none"><div class="stats"><div class="card stat"><b id="books">0</b><span class="muted">Books Started</span></div><div class="card stat"><b id="attempts">0</b><span class="muted">Attempts</span></div><div class="card stat"><b id="correct">0</b><span class="muted">Correct</span></div><div class="card stat"><b id="accuracy">0%</b><span class="muted">Accuracy</span></div><div class="card stat"><b id="xp" class="gold">0</b><span class="muted">XP</span></div><div class="card stat"><b id="streak" class="gold">0</b><span class="muted">Best Streak</span></div></div><div class="card recommend"><h2>Recommended Next Practice 推荐下一步</h2><div id="recommendation" class="muted">分析中…</div></div><div class="card"><h2>Book & Level Mastery</h2><div id="bookList"></div></div><div class="card"><h2>错题列表 Wrong Questions</h2><div id="wrongList"></div></div><div class="card"><h2>最近学习记录</h2><div id="recent"></div></div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const sidKey='uasaStudentId',nameKey='uasaStudentName';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function studentId(){return localStorage.getItem(sidKey)||''}
function masteryKey(book,level){return 'uasaMastery:'+studentId()+':'+book+':'+level}
function unlockKey(book,level){return 'uasaUnlock:'+studentId()+':'+book+':'+level}
function getMastery(book,level){return Number(localStorage.getItem(masteryKey(book,level))||0)}
function isUnlocked(book,level){return level===1||localStorage.getItem(unlockKey(book,level))==='1'||getMastery(book,level-1)>=80}
function getXP(){return Number(localStorage.getItem('uasaXP:'+studentId())||0)}
function getBestStreak(){return Number(localStorage.getItem('uasaBestStreak:'+studentId())||0)}
function parseLevel(mode){const m=String(mode||'').match(/Level\s*([1-4])/i);return m?Number(m[1]):0}
async function load(){const id=studentId();if(!id){needLogin.style.display='block';return}dash.style.display='block';studentLabel.textContent=(localStorage.getItem(nameKey)||id)+(localStorage.getItem('uasaStudentClass')?' · '+localStorage.getItem('uasaStudentClass'):'');xp.textContent=getXP();streak.textContent=getBestStreak();const r=await fetch(API+'/api/student/summary?student_id='+encodeURIComponent(id));if(!r.ok){bookList.innerHTML='<p class="bad">Dashboard API 读取失败。</p>';return}const d=await r.json(),bs=d.books||[],allRecent=d.recent||[];let a=0,c=0;bs.forEach(x=>{a+=Number(x.attempts||0);c+=Number(x.correct||0)});books.textContent=bs.length;attempts.textContent=a;correct.textContent=c;accuracy.textContent=a?Math.round(c/a*100)+'%':'0%';
bookList.innerHTML=bs.length?bs.map(x=>{const at=Number(x.attempts||0),co=Number(x.correct||0),wr=Number(x.wrong||0),pc=at?Math.round(co/at*100):0;const levels=[1,2,3,4].map(l=>{const m=getMastery(x.book_no,l),un=isUnlocked(x.book_no,l),cls=m>=80?'level mastered':un?'level':'level locked';return `<div class="${cls}"><strong>Level ${l} ${m>=80?'✓':un?'':'🔒'}</strong><span class="${m>=80?'good':'muted'}">${m}% Mastery</span></div>`}).join('');return `<div class="book"><b>Book ${x.book_no} ${esc(x.book_title||'')}</b><div class="bar"><div class="fill" style="width:${pc}%"></div></div><div class="muted">作答 ${at} · <span class="good">对 ${co}</span> · <span class="bad">错 ${wr}</span> · 正确率 ${pc}%</div><div class="levels">${levels}</div></div>`}).join(''):'<p class="muted">还没有学习记录。</p>';
const wrongs=allRecent.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===0);wrongList.innerHTML=wrongs.length?wrongs.map((x,i)=>`<div class="wrongItem"><div class="muted">#${i+1} · Book ${x.book_no} ${esc(x.book_title||'')}</div><div class="wrongQ">${esc(x.question_text||'题目资料未记录')}</div><div class="answer">学生答案：${esc(x.answer_text||'（没有记录答案）')}</div>${x.quiz_mode?`<span class="mode">${esc(x.quiz_mode)}</span>`:''}<div class="muted" style="margin-top:7px">${esc(x.created_at||'')}</div></div>`).join(''):'<p class="good">目前没有错题。</p>';
recent.innerHTML=allRecent.slice(0,20).map(x=>`<div class="book">Book ${x.book_no}${parseLevel(x.quiz_mode)?' · Level '+parseLevel(x.quiz_mode):''} · ${esc(x.event_type)}${Number(x.is_correct)===1?' · <span class="good">Correct</span>':Number(x.is_correct)===0?' · <span class="bad">Wrong</span>':''}<div class="muted">${esc(x.created_at||'')}</div></div>`).join('');
let rec='';if(wrongs.length){const byBook={};wrongs.forEach(x=>{byBook[x.book_no]=(byBook[x.book_no]||0)+1});const weak=Object.entries(byBook).sort((a,b)=>b[1]-a[1])[0];rec=`优先重做 <b>Book ${weak[0]}</b> 的错题，共 <span class="bad">${weak[1]} 题</span>。`;}
if(!rec&&bs.length){for(const b of bs){for(let l=1;l<=4;l++){const m=getMastery(b.book_no,l);if(isUnlocked(b.book_no,l)&&m<80){rec=`继续 <b>Book ${b.book_no} · Level ${l}</b>，目前 Mastery ${m}%，目标 ≥80%。`;break}}if(rec)break}}
if(!rec)rec=bs.length?'当前已没有明显弱项，可以继续下一本 Book。':'先完成 Book 1 · Level 1。';recommendation.innerHTML=rec;
}
load();
</script></body></html>
