<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn,input{padding:11px 13px;border-radius:10px;border:1px solid #31516f}.btn{background:#1b5f96;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input{background:#0d2237;color:#fff}.card{background:#0d2237;border:1px solid #294b6d;border-radius:16px;padding:16px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:28px;display:block}.muted{color:#9db4cc}.book{padding:12px 0;border-bottom:1px solid #294b6d}.bar{height:10px;background:#17314b;border-radius:999px;overflow:hidden}.fill{height:100%;background:#60a5fa}.good{color:#86efac}.bad{color:#fca5a5}.wrongItem{padding:14px;border:1px solid #5b2b35;background:#241922;border-radius:12px;margin:10px 0}.wrongQ{font-weight:800;line-height:1.5}.answer{margin-top:7px;color:#fca5a5}.mode{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#17283b;color:#9db4cc;font-size:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div><h1>学生学习 Dashboard</h1><div id="studentLabel" class="muted">尚未登录</div></div><div><a class="btn" href="index.html">返回主页</a></div></div><div class="card" id="login"><h2>学生登录</h2><p class="muted">第一次输入姓名即可，之后会记住。</p><input id="name" placeholder="Student name"><input id="className" placeholder="Class（optional）"><button class="btn" onclick="registerStudent()">进入 Dashboard</button></div><div id="dash" style="display:none"><div class="stats"><div class="card stat"><b id="books">0</b><span class="muted">Books Started</span></div><div class="card stat"><b id="attempts">0</b><span class="muted">Attempts</span></div><div class="card stat"><b id="correct">0</b><span class="muted">Correct</span></div><div class="card stat"><b id="accuracy">0%</b><span class="muted">Accuracy</span></div></div><div class="card"><h2>学习进度</h2><div id="bookList"></div></div><div class="card"><h2>错题列表 Wrong Questions</h2><div id="wrongList"></div></div><div class="card"><h2>最近学习记录</h2><div id="recent"></div></div></div></div><script>const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';localStorage.setItem('uasaApiBase',API);const sidKey='uasaStudentId',nameKey='uasaStudentName';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function registerStudent(){const name=document.getElementById('name').value.trim();if(!name)return alert('请输入学生姓名');const id=localStorage.getItem(sidKey)||crypto.randomUUID();const r=await fetch(API+'/api/student/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,class_name:document.getElementById('className').value.trim()})});if(!r.ok){const e=await r.text();return alert('登记失败：'+e)}const d=await r.json();localStorage.setItem(sidKey,d.id);localStorage.setItem(nameKey,d.name);load()}async function load(){const id=localStorage.getItem(sidKey);if(!id)return;document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('studentLabel').textContent=localStorage.getItem(nameKey)||id;const r=await fetch(API+'/api/student/summary?student_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('bookList').innerHTML='<p class="bad">Dashboard API 读取失败。</p>';return}const d=await r.json(),bs=d.books||[],allRecent=d.recent||[];let a=0,c=0;bs.forEach(x=>{a+=Number(x.attempts||0);c+=Number(x.correct||0)});books.textContent=bs.length;attempts.textContent=a;correct.textContent=c;accuracy.textContent=a?Math.round(c/a*100)+'%':'0%';bookList.innerHTML=bs.length?bs.map(x=>{const at=Number(x.attempts||0),co=Number(x.correct||0),wr=Number(x.wrong||0),pc=at?Math.round(co/at*100):0;return `<div class="book"><b>Book ${x.book_no} ${esc(x.book_title||'')}</b><div class="bar"><div class="fill" style="width:${pc}%"></div></div><div class="muted">作答 ${at} · <span class="good">对 ${co}</span> · <span class="bad">错 ${wr}</span> · 正确率 ${pc}%</div></div>`}).join(''):'<p class="muted">还没有学习记录。</p>';const wrongs=allRecent.filter(x=>x.event_type==='answer'&&Number(x.is_correct)===0);wrongList.innerHTML=wrongs.length?wrongs.map((x,i)=>`<div class="wrongItem"><div class="muted">#${i+1} · Book ${x.book_no} ${esc(x.book_title||'')}</div><div class="wrongQ">${esc(x.question_text||'题目资料未记录')}</div><div class="answer">学生答案：${esc(x.answer_text||'（没有记录答案）')}</div>${x.quiz_mode?`<span class="mode">${esc(x.quiz_mode)}</span>`:''}<div class="muted" style="margin-top:7px">${esc(x.created_at||'')}</div></div>`).join(''):'<p class="good">目前没有错题。</p>';recent.innerHTML=allRecent.slice(0,20).map(x=>`<div class="book">Book ${x.book_no} · ${esc(x.event_type)}${Number(x.is_correct)===1?' · <span class="good">Correct</span>':Number(x.is_correct)===0?' · <span class="bad">Wrong</span>':''}<div class="muted">${esc(x.created_at||'')}</div></div>`).join('')}if(localStorage.getItem(sidKey))load();</script></body></html>
