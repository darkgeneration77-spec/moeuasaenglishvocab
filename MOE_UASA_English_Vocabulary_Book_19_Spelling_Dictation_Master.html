let quiz=[],qi=0,score=0,current=null,answered=false,englishVoice=null;
wordCount.textContent=ITEMS.length;questionCount.textContent=QUESTIONS.length;

function loadVoice(){const v=speechSynthesis.getVoices();englishVoice=v.find(x=>x.lang==="en-GB"&&/Google|Microsoft|Daniel|Serena/i.test(x.name))||v.find(x=>x.lang==="en-GB")||v.find(x=>/^en/i.test(x.lang))||null}

const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g," ");

function render(){
 const done=[...new Set(progress.done)].length,pct=Math.round(done/QUESTIONS.length*100);
 doneCount.textContent=done;wrongCount.textContent=wrong.size;bestScore.textContent=(progress.best||0)+"%";overall.style.width=pct+"%";progressText.textContent=`${pct}% completed (${done}/${QUESTIONS.length})`;

 wordBank.innerHTML=ITEMS.map(x=>`<div class="card"><h3>${x.word}</h3><div><b>华语：</b>${x.zh}</div><div><b>BM：</b>${x.ms}</div><div class="example">${x.example}</div><button class="soft" onclick="speak('${x.word.replace(/'/g,"\\'")}')">🔊 Word</button></div>`).join("");
 const arr=QUESTIONS.filter(q=>wrong.has(q.id));wrongList.innerHTML=arr.length?arr.slice(0,80).map(q=>`<div class="wrongitem"><b>${q.type}</b> — ${q.word}<br><small>${q.explain}</small></div>`).join(""):"<p>No wrong answers yet.</p>"
}
render();

function begin(titleText,list){quiz=shuffle(list);qi=0;score=0;title.textContent=titleText;modal.classList.remove("hidden");show()}
function startModule(type){const n=Number(qCount.value);begin(type,shuffle(QUESTIONS.filter(q=>q.type===type)).slice(0,n))}
function startFinal(){begin("Final Spelling Test",shuffle(QUESTIONS).slice(0,100))}
function startWrong(){const pool=QUESTIONS.filter(q=>wrong.has(q.id));if(!pool.length){alert("No wrong answers yet.");return}begin("Wrong Book Correction",pool)}

function show(){

   answerArea.innerHTML='<input id="typed" class="answer" autocomplete="off" placeholder="Type the correct word">';

   if(current.type==="dictation"){display.innerHTML='<button class="primary" onclick="speak(current.word)">🔊 Play Word</button>'}

}
function update(ok){
 if(!progress.done.includes(current.id))progress.done.push(current.id);
 if(ok){if(!progress.correct.includes(current.id))progress.correct.push(current.id);wrong.delete(current.id)}
 else{progress.correct=progress.correct.filter(x=>x!==current.id);wrong.add(current.id)}
 save();render()
}
function gradeChoice(btn,val){if(answered)return;answered=true;const ok=val===current.answer;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.textContent===current.answer)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");if(ok)score++;update(ok);result.textContent=(ok?"Correct! ":"Incorrect. ")+current.explain;nextBtn.classList.remove("hidden")}
function checkTyped(){if(answered)return;const val=typed.value;if(!val.trim())return;answered=true;const ok=norm(val)===norm(current.answer);typed.disabled=true;typed.style.borderColor=ok?"#087f5b":"#b42318";if(ok)score++;update(ok);result.innerHTML=(ok?"Correct! 答对了。<br>":`Incorrect. Correct answer: <b>${current.answer}</b><br>`)+current.explain;checkBtn.classList.add("hidden");nextBtn.classList.remove("hidden")}
