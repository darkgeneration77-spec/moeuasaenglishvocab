roves."}, {"id": 28, "pi": 9, "q": "What does “flexibility” mean?", "options": ["freedom to adjust", "strict rules", "high cost", "slow internet"], "answer": "freedom to adjust", "explain": "Flexibility means being able to adjust easily（灵活性）."}, {"id": 29, "pi": 9, "q": "What does “distractions” mean?", "options": ["things that take attention away", "helpful notes", "school subjects", "computer files"], "answer": "things that take attention away", "explain": "Distractions prevent concentration（干扰）."}, {"id": 30, "pi": 9, "q": "What is the main idea?", "options": ["Online learning is useful but requires self-discipline.", "Online learning is always easy.", "Pupils should stop using computers.", "Home is best for every lesson."], "answer": "Online learning is useful but requires self-discipline.", "explain": "The passage presents both benefits and responsibilities."}],S=[["Definition clue", "The meaning is explained nearby.", "定义线索", "petunjuk definisi"], ["Example clue", "Examples help reveal meaning.", "举例线索", "petunjuk contoh"], ["Contrast clue", "but, however and although show opposite ideas.", "转折线索", "petunjuk pertentangan"], ["Cause and effect", "because, so and as a result show reasons and outcomes.", "因果线索", "sebab dan akibat"], ["Reference word", "it, they, he and she refer to earlier nouns.", "指代词", "kata rujukan"], ["Main idea", "Find the idea repeated across the passage.", "主旨", "idea utama"], ["Inference", "Combine text clues with logic.", "推断", "inferens"], ["Synonym clue", "A nearby word may have a similar meaning.", "同义线索", "petunjuk sinonim"]];let prog=JSON.parse(localStorage.getItem("uasa18p")||'{"done":[],"correct":[],"best":0}'),wrong=new Set(JSON.parse(localStorage.getItem("uasa18w")||"[]"));let quiz=[],qi=0,score=0,current=null,answered=false;
