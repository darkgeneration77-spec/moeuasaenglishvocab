<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#071522;color:#eef6ff}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{padding:11px 15px;border:1px solid #3c6b91;border-radius:11px;background:#1b5f96;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.card{background:#0d2237;border:1px solid #294b6d;border-radius:18px;padding:20px;margin-top:16px}.muted{color:#9db4cc}.good{color:#86efac}.bad{color:#fca5a5}.question{font-size:22px;font-weight:900;line-height:1.55;margin:18px 0}.answer{width:100%;padding:14px;border-radius:12px;border:1px solid #416685;background:#081827;color:#fff;font-size:17px}.progress{height:12px;background:#17314b;border-radius:999px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#60a5fa}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#162d44;color:#b9d4ea;font-size:12px}.result{padding:13px;border-radius:12px;margin-top:12px}.result.good{background:#102c25}.result.bad{background:#2d1820}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#10253a;border:1px solid #31516f;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px}.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.group{padding:12px;border:1px solid #31516f;border-radius:12px;background:#10253a;color:#fff;font-weight:900;cursor:pointer}.group.locked{opacity:.45;cursor:not-allowed}.group.pass{border-color:#3d8b64;background:#102c25}@media(max-width:700px){.groups{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Boss Test 综合掌握测试</h1><div id="student" class="muted"></div></div><a class="btn" href="student-dashboard.html">返回 Dashboard</a></div><div class="card"><h2>Boss Groups</h2><div id="groups" class="groups"></div><p class="muted">必须完成该组所有 Book 的 Level 1–4，并达到 ≥80% Mastery 才能解锁。Boss Test 使用云端已记录且有标准答案的全部题目。</p></div><div id="box" class="card"><div class="muted">正在读取云端进度…</div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';const sid=localStorage.getItem('uasaStudentId')||'',sname=localStorage.getItem('uasaStudentName')||'';student.textContent=sname||'Student';const ranges=[[1,5],[6,10],[11,15],[16,20],[21,26]];let levels=[],bosses=[],bank=[],i=0,correct=0,wrong=0,current=null;function norm(s){return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function levelRec(b,l){return levels.find(x=>Number(x.book_no)===b&&Number(x.level_no)===l)||null}function bookMastered(b){return [1,2,3,4].every(l=>{const x=levelRec(b,l);return x&&Number(x.mastery)>=80&&Number(x.mastered)===1})}function rangeUnlocked(a,b){for(let n=a;n<=b;n++)if(!bookMastered(n))return false;return true}function bossPassed(a,b){const x=bosses.find(x=>Number(x.books_from)===a&&Number(x.books_to)===b);return !!(x&&Number(x.passed)===1)}function renderGroups(){groups.innerHTML=ranges.map(([a,b])=>{const un=rangeUnlocked(a,b),pass=bossPassed(a,b);return `<button class="group ${!un?'locked':''} ${pass?'pass':''}" onclick="startBoss(${a},${b})">Books ${a}–${b}${pass?'<br>✓ PASSED':un?'<br>OPEN':'<br>🔒'}</button>`}).join('')}async function loadCloud(){if(!sid){box.innerHTML='<h2>请先从主页登记学生。</h2>';return false}const r=await fetch(API+'/api/progress/get?student_id='+encodeURIComponent(sid));if(!r.ok){box.innerHTML='<p class="bad">无法读取云端进度。</p>';return false}const d=await r.json();levels=d.levels||[];bosses=d.bosses||[];renderGroups();box.innerHTML='<div class="muted">选择一个已解锁 Boss Test。</div>';return true}async function loadSummary(){const r=await fetch(API+'/api/student/summary?student_id='+encodeURIComponent(sid));if(!r.ok)return null;return await r.json()}
async function startBoss(a,b){if(!rangeUnlocked(a,b)){box.innerHTML=`<h2 class="bad">Boss Test Locked</h2><p>必须先 Master Books ${a}–${b} 的 Level 1–4。</p>`;return}current=[a,b];box.innerHTML='<div class="muted">正在建立完整 Boss 题库…</div>';const d=await loadSummary();if(!d){box.innerHTML='<p class="bad">无法读取学习记录。</p>';return}const seen=new Set();bank=(d.recent||[]).filter(x=>Number(x.book_no)>=a&&Number(x.book_no)<=b&&x.event_type==='answer'&&x.question_text&&x.correct_answer&&!String(x.quiz_mode||'').includes('Boss Test')).filter(x=>{const k=x.book_no+'|'+(x.question_key||x.question_text)+'|'+x.correct_answer;if(seen.has(k))return false;seen.add(k);return true}).reverse();if(!bank.length){box.innerHTML=`<h2 class="bad">没有可测试题库</h2><p class="muted">Books ${a}–${b} 目前没有带标准答案的完整学习记录。</p>`;return}i=0;correct=0;wrong=0;renderQuestion()}
function renderQuestion(){if(i>=bank.length){finish();return}const x=bank[i],pc=Math.round(i/bank.length*100);box.innerHTML=`<div class="tag">Boss Books ${current[0]}–${current[1]} · Book ${x.book_no}</div><div class="progress"><div class="fill" style="width:${pc}%"></div></div><div class="stats"><div class="stat"><b>${i+1}/${bank.length}</b><span class="muted">Progress</span></div><div class="stat"><b class="good">${correct}</b><span class="muted">Correct</span></div><div class="stat"><b class="bad">${wrong}</b><span class="muted">Wrong</span></div><div class="stat"><b>${i?Math.round(correct/i*100):0}%</b><span class="muted">Accuracy</span></div></div><div class="question">${esc(x.question_text)}</div><input id="ans" class="answer" placeholder="Type your answer and press Enter" autocomplete="off"><div id="result"></div><button id="checkBtn" class="btn" style="margin-top:12px" onclick="check()">Check Answer</button>`;ans.focus();ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
async function logBoss(x,ok,a){await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,book_no:Number(x.book_no),book_title:x.book_title||'',event_type:'answer',question_key:'boss|'+(x.question_key||i),question_text:x.question_text||'',answer_text:a,correct_answer:x.correct_answer||'',is_correct:ok,recovered:false,quiz_mode:`Boss Test Books ${current[0]}-${current[1]}`})}).catch(()=>{})}
async function check(){const x=bank[i],a=ans.value.trim();if(!a)return;const ok=norm(a)===norm(x.correct_answer);ans.disabled=true;checkBtn.disabled=true;if(ok){correct++;result.innerHTML='<div class="result good"><b>Correct ✓</b></div>'}else{wrong++;result.innerHTML=`<div class="result bad"><b>Wrong</b><br>Correct answer: <b>${esc(x.correct_answer)}</b></div>`}await logBoss(x,ok,a);setTimeout(()=>{i++;renderQuestion()},850)}
async function finish(){const total=bank.length,pct=total?Math.round(correct/total*100):0,pass=pct>=80;await fetch(API+'/api/boss/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,boss_group:`books-${current[0]}-${current[1]}`,books_from:current[0],books_to:current[1],score:correct,total})}).catch(()=>{});if(pass){await fetch(API+'/api/achievement/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,achievement_key:`boss-${current[0]}-${current[1]}`,achievement_name:`Boss ${current[0]}-${current[1]} Cleared`})}).catch(()=>{})}await loadCloud();box.innerHTML=`<h2 class="${pass?'good':'bad'}">${pass?'BOSS CLEARED ✓':'BOSS NOT CLEARED'}</h2><div class="stats"><div class="stat"><b>${total}</b><span class="muted">Total Questions</span></div><div class="stat"><b class="good">${correct}</b><span class="muted">Correct</span></div><div class="stat"><b class="bad">${wrong}</b><span class="muted">Wrong</span></div><div class="stat"><b>${pct}%</b><span class="muted">Score</span></div></div><p>${pass?'达到 80%，结果已保存到云端。':'未达到 80%，建议先重做错题，再重新挑战。'}</p><button class="btn" onclick="startBoss(${current[0]},${current[1]})">Retry Boss</button> <a class="btn" href="student-dashboard.html">Dashboard</a>`}
loadCloud();
</script></body></html>
