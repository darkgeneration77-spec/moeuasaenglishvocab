<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Book 3 Confusing Words Battle Arena</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(145deg,#071522,#17355c);color:#fff}body{padding:8px;display:flex;justify-content:center}.game{width:min(100%,920px);background:#0e2943;border:1px solid #416d8b;border-radius:24px;padding:12px;box-shadow:0 20px 45px #0008}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer;background:#1b5f96;color:#fff}.btn.active{background:#f59e0b;color:#172033}.title{flex:1;text-align:center;min-width:260px}.title b{font-size:21px}.title small{display:block;color:#a9cee8;margin-top:2px}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}.score{border-radius:14px;padding:9px 12px;font-weight:900;background:#10253a;border:1px solid #31516f}.score.red{color:#fecaca}.score.blue{color:#bfdbfe;text-align:right}.left{font-weight:1000;color:#fde68a;background:#10253a;border:1px solid #31516f;padding:8px 14px;border-radius:999px}.question{background:#162b46;border:1px solid #31587c;border-radius:15px;padding:9px 12px;text-align:center}.question .type{font-size:11px;color:#9fc6e5;font-weight:900}.question .clue{font-size:19px;font-weight:900;margin-top:4px}.question .sub{font-size:12px;color:#bfdbfe;margin-top:4px}.status{min-height:24px;text-align:center;padding:4px;font-weight:900;color:#bfdbfe}.status.good{color:#86efac}.status.bad{color:#fca5a5}.arenaWrap{position:relative}.arena{display:block;width:100%;height:auto;aspect-ratio:800/500;background:#234a61;border:2px solid #3f7191;border-radius:18px;touch-action:none;outline:none}.arena:focus{box-shadow:0 0 0 3px #60a5fa66}.overlay{position:absolute;inset:0;border-radius:18px;background:#020617eF;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.card{background:#10253a;border:1px solid #4f7390;border-radius:18px;padding:22px;max-width:480px}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:13px 0}.resultGrid div{background:#071522;border-radius:10px;padding:10px}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:9px;color:#b6d6ed;font-size:12px}.pill{background:#173141;border:1px solid #3f7193;border-radius:999px;padding:7px 12px}.mobile{display:none;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center;margin-top:8px}.mobile button{height:46px;border:0;border-radius:10px;background:#1b5f96;color:#fff;font-weight:900}.mobile .blank{visibility:hidden}@media(max-width:700px){.title b{font-size:17px}.question .clue{font-size:16px}.mobile{display:grid}.scorebar{grid-template-columns:1fr 1fr}.left{grid-column:1/-1;text-align:center;grid-row:2}.arena{aspect-ratio:800/560}}
</style></head>
<body><div class="game">
<div class="top"><button class="btn" id="backBtn">← 返回</button><div class="title"><b>Book 3 · Confusing Words Battle Arena</b><small>抢完 127 个词汇 · 1P 挑战 CPU · 2P 本机对战</small></div><button class="btn active" id="oneBtn">1P VS CPU</button><button class="btn" id="twoBtn">2 Players</button></div>
<div class="scorebar"><div class="score red">🔴 YOU / P1 <span id="scoreRed">0</span></div><div class="left"><span id="claimed">0</span> / <span id="total">127</span> CLAIMED · <span id="remain">127</span> LEFT</div><div class="score blue"><span id="blueName">CPU</span> <span id="scoreBlue">0</span> 🔵</div></div>
<div class="question"><div class="type" id="qType">CONTEXT CLUE</div><div class="clue" id="clue">Loading Book 3…</div><div class="sub" id="sub"></div></div><div id="status" class="status">点击游戏区后，用 WASD 上下左右抢正确词。</div>
<div class="arenaWrap"><canvas class="arena" id="arena" width="800" height="500" tabindex="0"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="endTitle">BATTLE COMPLETE</h2><div id="endText"></div><button class="btn" id="againBtn">再战一次</button></div></div></div>
<div class="controls"><span class="pill">P1: W A S D 自由移动</span><span class="pill" id="p2Help">CPU 有反应延迟</span><span class="pill">词会移动 · 撞错冻结 1.2 秒 · 抢对 +10 XP</span></div>
<div class="mobile"><button class="blank"></button><button data-m="up">▲</button><button class="blank"></button><button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button></div>
</div>
<script>
(()=>{
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev';
const qs=new URLSearchParams(location.search),file=qs.get('file')||'MOE_UASA_English_Vocabulary_Book_3_Confusing_Words_original.html';
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=800,H=500;
const scoreRedEl=document.getElementById('scoreRed'),scoreBlueEl=document.getElementById('scoreBlue'),claimedEl=document.getElementById('claimed'),remainEl=document.getElementById('remain'),totalEl=document.getElementById('total'),clueEl=document.getElementById('clue'),subEl=document.getElementById('sub'),qTypeEl=document.getElementById('qType'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay');
let groups=[],words=[],queue=[],target=null,options=[],mode=1,roundLocked=false,over=false,raf=0,wrongRed=0,wrongBlue=0,cleanRed=0,attemptRed=0,scoreRed=0,scoreBlue=0;
const red={x:120,y:250,w:38,h:25,s:4.9,freeze:0,color:'#e63e3e'},blue={x:680,y:250,w:38,h:25,s:3.7,freeze:0,color:'#3a7bd5'};
const keys={w:0,a:0,s:0,d:0,up:0,down:0,left:0,right:0};let cpuGoal=null,cpuThinkAt=0,cpuStartAt=0;
function safe(v){return String(v==null?'':v)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setStatus(t,c=''){statusEl.textContent=t;statusEl.className='status '+c}function rect(a,b){return !(b.x>a.x+a.w||b.x+b.w<a.x||b.y>a.y+a.h||b.y+b.h<a.y)}
function tell(type,data={}){try{parent.postMessage({source:'uasa-ninja',game:'book3-battle',type,book_no:3,level:1,...data},location.origin)}catch(e){}}
async function track(event_type,extra={}){const sid=localStorage.getItem('uasaStudentId')||'';if(!sid)return;try{await fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,book_no:3,book_title:'Book 3 Confusing Words',event_type,quiz_mode:'Book 3 Battle Arena',...extra})})}catch(e){}}
function makeWords(){words=[];groups.forEach((g,gi)=>g.items.forEach((it,ii)=>words.push({word:it.word,use:it.use||'',example:it.example||'',group:g.title,zh:g.zh||'',ms:g.ms||'',rule:g.rule||'',tip:g.tip||'',gi,ii})))}
function buildQuestion(t){const types=['example','use','rule','meaning'];const type=types[Math.floor(Math.random()*types.length)];let clue='',sub='';if(type==='example'&&t.example){let re=new RegExp('\\b'+safe(t.word).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');clue=t.example.replace(re,'_____');if(clue===t.example)clue='Which word best matches this sentence? '+t.example;qTypeEl.textContent='SENTENCE CLUE';sub=t.group}else if(type==='use'&&t.use){clue=t.use;qTypeEl.textContent='USE / 用法';sub='Choose the correct English word.'}else if(type==='rule'&&t.rule){clue=t.rule;qTypeEl.textContent='RULE BATTLE';sub='Target group: '+t.group}else{clue=(t.zh?'华语：'+t.zh:'')+(t.ms?' · BM：'+t.ms:'');qTypeEl.textContent='MEANING CLUE';sub=t.use||t.group}clueEl.textContent=clue;subEl.textContent=sub}
function freeSpot(existing){for(let n=0;n<60;n++){let p={x:95+Math.random()*610,y:85+Math.random()*330};if(existing.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>125))return p}return{x:120+Math.random()*560,y:90+Math.random()*320}}
function makeOptions(){let same=words.filter(x=>x.gi===target.gi&&x.word!==target.word),other=words.filter(x=>x.word!==target.word&&x.gi!==target.gi),pool=[...shuffle(same).slice(0,3),...shuffle(other)],picks=[];for(const x of pool){if(!picks.some(p=>p.word===x.word)){picks.push(x);if(picks.length===3)break}}let arr=shuffle([target,...picks]);options=[];arr.forEach(x=>{let p=freeSpot(options),ang=Math.random()*Math.PI*2,sp=.45+Math.random()*.45;options.push({...x,x:p.x,y:p.y,w:96,h:36,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,correct:x.word===target.word})})}
function newRound(){if(!queue.length){finish();return}roundLocked=false;target=queue.shift();makeOptions();buildQuestion(target);red.x=110;red.y=250;blue.x=690;blue.y=250;red.freeze=blue.freeze=0;cpuGoal=null;cpuStartAt=performance.now()+900+Math.random()*700;cpuThinkAt=cpuStartAt;setStatus('抢正确词！词会移动，CPU 会先观察再追。');focusGame()}
function claim(side){if(roundLocked)return;roundLocked=true;const mine=side==='red';if(mine){scoreRed++;cleanRed++;attemptRed++;tell('answer',{ok:true,delta:10,clean:true,question_key:'B3|'+target.group+'|'+target.word,word:target.word});track('answer',{question_key:'B3|'+target.group+'|'+target.word,question_text:clueEl.textContent,answer_text:target.word,is_correct:true})}else scoreBlue++;scoreRedEl.textContent=scoreRed;scoreBlueEl.textContent=scoreBlue;const done=scoreRed+scoreBlue;claimedEl.textContent=done;remainEl.textContent=Math.max(0,words.length-done);setStatus((mine?'YOU':'CPU/P2')+' 抢到 '+target.word+'！','good');setTimeout(newRound,650)}
function wrong(side,word){if(roundLocked)return;if(side==='red'){red.freeze=72;wrongRed++;attemptRed++;tell('answer',{ok:false,delta:-5,clean:false,question_key:'B3|'+target.group+'|'+target.word,word});track('book3_battle_wrong',{question_key:'B3|'+target.group+'|'+target.word,question_text:clueEl.textContent,answer_text:word,is_correct:false})}else{blue.freeze=72;wrongBlue++}setStatus((side==='red'?'YOU':'CPU/P2')+' 撞错 '+word+'，冻结 1.2 秒。','bad')}
function hitCar(car,side){const cr={x:car.x-car.w/2,y:car.y-car.h/2,w:car.w,h:car.h};for(const o of options){const or={x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h};if(rect(cr,or)){if(o.correct)claim(side);else wrong(side,o.word);car.x=side==='red'?110:690;car.y=250;break}}}
function move(car,dx,dy){if(car.freeze>0)return;let mag=Math.hypot(dx,dy)||1;dx/=Math.max(1,mag);dy/=Math.max(1,mag);car.x=Math.max(24,Math.min(W-24,car.x+dx*car.s));car.y=Math.max(24,Math.min(H-24,car.y+dy*car.s))}
function moveTargets(){for(const o of options){o.x+=o.vx;o.y+=o.vy;if(o.x-o.w/2<18||o.x+o.w/2>W-18){o.vx*=-1;o.x=Math.max(18+o.w/2,Math.min(W-18-o.w/2,o.x))}if(o.y-o.h/2<55||o.y+o.h/2>H-18){o.vy*=-1;o.y=Math.max(55+o.h/2,Math.min(H-18-o.h/2,o.y))}}}
function chooseCpuGoal(){if(!target)return;let correct=options.find(o=>o.correct),decoys=options.filter(o=>!o.correct);cpuGoal=Math.random()<.16?decoys[Math.floor(Math.random()*decoys.length)]||correct:correct;cpuThinkAt=performance.now()+1100+Math.random()*900}
function cpu(){if(mode!==1||roundLocked||blue.freeze>0||!target)return;let now=performance.now();if(now<cpuStartAt)return;if(!cpuGoal||now>cpuThinkAt)chooseCpuGoal();if(!cpuGoal)return;const dx=cpuGoal.x-blue.x,dy=cpuGoal.y-blue.y,d=Math.hypot(dx,dy)||1;move(blue,dx/d*.82,dy/d*.82)}
function update(){if(over)return;moveTargets();if(red.freeze>0)red.freeze--;if(blue.freeze>0)blue.freeze--;move(red,(keys.d?1:0)-(keys.a?1:0),(keys.s?1:0)-(keys.w?1:0));if(mode===2)move(blue,(keys.right?1:0)-(keys.left?1:0),(keys.down?1:0)-(keys.up?1:0));else cpu();hitCar(red,'red');hitCar(blue,'blue')}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawCar(c,label){ctx.save();ctx.translate(c.x,c.y);ctx.shadowColor='#0008';ctx.shadowBlur=10;ctx.fillStyle=c.freeze>0?'#64748b':c.color;roundRect(-19,-12.5,38,25,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#dbeafe';roundRect(-7,-9,14,8,3);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,3);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#234a61';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff18';ctx.lineWidth=1.5;ctx.setLineDash([12,18]);for(let x=100;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.setLineDash([]);options.forEach(o=>{ctx.shadowColor='#0006';ctx.shadowBlur=8;ctx.fillStyle='#f5c542';ctx.strokeStyle='#b37b1a';ctx.lineWidth=2;roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,10);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#172531';ctx.font='bold 15px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';let txt=o.word.length>12?o.word.slice(0,12)+'…':o.word;ctx.fillText(txt,o.x,o.y)});drawCar(red,'YOU');drawCar(blue,mode===1?'CPU':'P2');if(red.freeze>0){ctx.fillStyle='#fecaca';ctx.font='bold 13px Segoe UI';ctx.fillText('FROZEN',red.x,red.y-24)}if(blue.freeze>0){ctx.fillStyle='#bfdbfe';ctx.font='bold 13px Segoe UI';ctx.fillText('FROZEN',blue.x,blue.y-24)}}
function loop(){update();draw();raf=requestAnimationFrame(loop)}
function finish(){over=true;cancelAnimationFrame(raf);const total=words.length,acc=Math.round(cleanRed/Math.max(1,attemptRed)*100),win=scoreRed>scoreBlue;document.getElementById('endTitle').textContent=win?'YOU WIN!':scoreRed===scoreBlue?'DRAW!':(mode===1?'CPU WINS':'P2 WINS');document.getElementById('endText').innerHTML=`<div class="resultGrid"><div><b>${scoreRed}</b><br>YOU / P1</div><div><b>${scoreBlue}</b><br>${mode===1?'CPU':'P2'}</div><div><b>${acc}%</b><br>Your Accuracy</div><div><b>${wrongRed}</b><br>Your Wrong Hits</div></div><div>${total}-word battle completed.</div>`;overlay.classList.add('show');tell('level_complete',{game:'book3-battle',total,correct:scoreRed,wrong_cuts:wrongRed,score:scoreRed*10,accuracy:acc,mastered:acc>=80});track('book3_battle_complete',{question_key:'B3|BATTLE|SUMMARY',question_text:total+'-word battle',answer_text:`YOU ${scoreRed}; OPP ${scoreBlue}; accuracy ${acc}%`,is_correct:win})}
function reset(){scoreRed=scoreBlue=wrongRed=wrongBlue=cleanRed=attemptRed=0;over=false;overlay.classList.remove('show');scoreRedEl.textContent=scoreBlueEl.textContent='0';queue=shuffle(words);claimedEl.textContent='0';remainEl.textContent=words.length;totalEl.textContent=words.length;newRound();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);track('book3_battle_start',{question_key:'B3|BATTLE|START',question_text:words.length+'-word battle',answer_text:mode===1?'YOU vs CPU':'P1 vs P2',is_correct:true})}
async function load(){try{const html=await fetch(file,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const\s+GROUPS\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('GROUPS not found');groups=Function('return '+m[1])();makeWords();reset()}catch(e){clueEl.textContent='无法读取 Book 3 词汇';subEl.textContent='请返回 Book 3 再进入 Battle';setStatus('Battle Arena 载入失败','bad')}}
function setMode(n){mode=n;document.getElementById('oneBtn').classList.toggle('active',n===1);document.getElementById('twoBtn').classList.toggle('active',n===2);document.getElementById('blueName').textContent=n===1?'CPU':'P2';document.getElementById('p2Help').textContent=n===1?'CPU 有反应延迟':'P2: 方向键';if(words.length)reset();focusGame()}
function down(e){const k=e.key.toLowerCase();if(k==='w'||k==='a'||k==='s'||k==='d'){keys[k]=1;e.preventDefault()}if(e.key==='ArrowUp'){keys.up=1;e.preventDefault()}if(e.key==='ArrowDown'){keys.down=1;e.preventDefault()}if(e.key==='ArrowLeft'){keys.left=1;e.preventDefault()}if(e.key==='ArrowRight'){keys.right=1;e.preventDefault()}}
function up(e){const k=e.key.toLowerCase();if(k==='w'||k==='a'||k==='s'||k==='d')keys[k]=0;if(e.key==='ArrowUp')keys.up=0;if(e.key==='ArrowDown')keys.down=0;if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0}
function focusGame(){try{window.focus();canvas.focus({preventScroll:true})}catch(e){canvas.focus()}}
window.addEventListener('keydown',down,true);window.addEventListener('keyup',up,true);document.addEventListener('keydown',down,true);document.addEventListener('keyup',up,true);canvas.addEventListener('pointerdown',focusGame);document.body.addEventListener('pointerdown',()=>setTimeout(focusGame,0));
document.querySelectorAll('[data-m]').forEach(b=>{const map={up:'w',down:'s',left:'a',right:'d'},k=map[b.dataset.m];b.onpointerdown=e=>{e.preventDefault();keys[k]=1;focusGame()};b.onpointerup=b.onpointercancel=()=>keys[k]=0});
document.getElementById('oneBtn').onclick=()=>setMode(1);document.getElementById('twoBtn').onclick=()=>setMode(2);document.getElementById('againBtn').onclick=reset;document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href=file;
setTimeout(focusGame,100);setTimeout(focusGame,500);load();
})();
</script>
</body></html>
