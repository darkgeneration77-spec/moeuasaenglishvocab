<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UASA Game Shop</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#071522;color:#fff}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;color:#fff;background:#1b5f96;border:1px solid #6fc8e5;padding:10px 13px;border-radius:10px;font-weight:900}.wallet{padding:12px 16px;border-radius:14px;background:#102c46;border:1px solid #355b79;font-weight:900}.hero{margin-top:18px;display:grid;grid-template-columns:150px 1fr;gap:18px;padding:20px;background:linear-gradient(135deg,#10243b,#231b45);border:1px solid #4b5c89;border-radius:18px}.avatar{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:1000;background:#173b5d;border:5px solid #7dd3fc}.name{font-size:26px;font-weight:1000}.title{margin-top:6px;color:#fde68a;font-weight:900}.muted{color:#9fb4c8;font-size:13px}.section{margin-top:24px}.section h2{margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{padding:15px;border-radius:15px;background:#0d2236;border:1px solid #34526d}.item.owned{border-color:#22c55e}.item.equipped{box-shadow:0 0 0 2px #facc15 inset}.icon{font-size:38px}.item h3{margin:7px 0}.price{color:#fde68a;font-weight:900}.action{margin-top:10px;width:100%;border:0;border-radius:9px;padding:9px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.action[disabled]{opacity:.45;cursor:not-allowed}.ownedTag{font-size:11px;color:#86efac;font-weight:900}.msg{margin-top:10px;min-height:22px;color:#86efac;font-weight:800}@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}}</style></head><body><div class="wrap"><div class="top"><div><a class="btn" href="index.html">← Home</a> <a class="btn" href="student-dashboard.html">Dashboard</a></div><div class="wallet">Coins: <span id="coins">0</span></div></div><div class="hero"><div id="avatar" class="avatar">A</div><div><div id="studentName" class="name">Student</div><div id="equippedTitle" class="title">Vocabulary Rookie</div><div class="muted">Your XP stays untouched. Coins are only for cosmetics.</div><div id="msg" class="msg"></div></div></div><div class="section"><h2>Avatars</h2><div id="avatarGrid" class="grid"></div></div><div class="section"><h2>Titles</h2><div id="titleGrid" class="grid"></div></div></div><script>
const API='https://moe-uasa-english-api.darkgeneration77.workers.dev',sid=localStorage.getItem('uasaStudentId')||'';const AVATARS=[{key:'rookie-blue',name:'Blue Rookie',icon:'A',price:0},{key:'fox-orange',name:'Quick Fox',icon:'F',price:120},{key:'owl-purple',name:'Wise Owl',icon:'O',price:180},{key:'tiger-gold',name:'Golden Tiger',icon:'T',price:260},{key:'dragon-red',name:'Word Dragon',icon:'D',price:400},{key:'crown-black',name:'Vocabulary King',icon:'K',price:600}],TITLES=[{key:'Vocabulary Rookie',name:'Vocabulary Rookie',price:0},{key:'Combo Hunter',name:'Combo Hunter',price:120},{key:'Rival Breaker',name:'Rival Breaker',price:180},{key:'Perfect Speller',name:'Perfect Speller',price:250},{key:'Book Master',name:'Book Master',price:350},{key:'UASA Legend',name:'UASA Legend',price:600}];let profile={coins:0,equipped_avatar:'rookie-blue',equipped_title:'Vocabulary Rookie'},owned=new Set(['rookie-blue','Vocabulary Rookie']);if(!sid)location.replace('index.html?login=1');studentName.textContent=localStorage.getItem('uasaStudentName')||'Student';function note(t,bad=false){msg.textContent=t;msg.style.color=bad?'#fca5a5':'#86efac'}function render(){coins.textContent=profile.coins||0;const av=AVATARS.find(x=>x.key===profile.equipped_avatar)||AVATARS[0];avatar.textContent=av.icon;equippedTitle.textContent=profile.equipped_title||'Vocabulary Rookie';avatarGrid.innerHTML=AVATARS.map(x=>card(x,'avatar')).join('');titleGrid.innerHTML=TITLES.map(x=>card(x,'title')).join('')}function card(x,type){const isOwned=owned.has(x.key),eq=type==='avatar'?profile.equipped_avatar===x.key:profile.equipped_title===x.key;let action=isOwned?(eq?'Equipped':'Equip'):'Buy';return `<div class="item ${isOwned?'owned':''} ${eq?'equipped':''}"><div class="icon">${type==='avatar'?x.icon:'🏷️'}</div><h3>${x.name}</h3><div class="price">${x.price===0?'Free':x.price+' Coins'}</div><div class="ownedTag">${isOwned?'OWNED':''}</div><button class="action" ${eq?'disabled':''} onclick="act('${x.key}','${type}',${x.price},${isOwned})">${action}</button></div>`}async function load(){try{const r=await fetch(API+'/api/game/profile?student_id='+encodeURIComponent(sid));if(!r.ok)throw new Error('Game API not ready');const d=await r.json();profile=d.profile||profile;(d.inventory||[]).forEach(x=>owned.add(x.item_key));render()}catch(e){note('Game cloud API is not active yet. Update Worker to V2.8.',true);render()}}async function act(key,type,price,isOwned){try{if(!isOwned){const r=await fetch(API+'/api/game/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,item_key:key,item_type:type,item_name:key,price})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Purchase failed');profile.coins=d.coins;owned.add(key);note('Purchased successfully.')}else{const r=await fetch(API+'/api/game/equip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,item_key:key,item_type:type})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Equip failed');profile=d.profile;note('Equipped.')}render()}catch(e){note(e.message,true)}}load();</script></body></html>
