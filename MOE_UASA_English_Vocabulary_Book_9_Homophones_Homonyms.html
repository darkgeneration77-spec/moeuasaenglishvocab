let voice=null;function loadVoice(){let v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==="en-GB"&&/Google|Microsoft|Daniel|Serena/i.test(x.name))||v.find(x=>x.lang==="en-GB")||v.find(x=>/^en/i.test(x.lang))||null}if("speechSynthesis"in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function speak(t){let clean=String(t).replace(/[／/|]/g,", ").replace(/\s+/g," ").trim();if(!clean)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(clean);u.lang="en-GB";u.rate=.76;if(voice)u.voice=voice;speechSynthesis.speak(u)}

function filtered(){let q=search.value.toLowerCase(),s=section.value,v=view.value;return ITEMS.filter(x=>(!q||Object.values(x).join(" ").toLowerCase().includes(q))&&(!s||x.section===s)&&(v!=="saved"||saved.has(key(x))))}
function render(){let list=filtered();content.innerHTML="";sections.forEach(s=>{let arr=list.filter(x=>x.section===s);if(!arr.length)return;let sec=document.createElement("section");sec.innerHTML=`<h2 class="title">${s} <small>(${arr.length})</small></h2><div class="grid"></div>`;let g=sec.querySelector(".grid");arr.forEach(x=>{let words=[x.a,x.b,x.c].filter(Boolean),examples=[x.ex1,x.ex2,x.ex3].filter(Boolean);let c=document.createElement("article");c.className="card";c.innerHTML=`<button class="star ${saved.has(key(x))?"on":""}">★</button><h3>${words.join(" · ")}</h3><div class="words">${words.map((w,i)=>`<div><b>${i+1}.</b> ${w}</div>`).join("")}</div><div><b>华语：</b>${x.zh}</div><div><b>BM：</b>${x.ms}</div>${examples.map(e=>`<div class="ex"><b>Example:</b> ${e}</div>`).join("")}<div class="actions"><button class="speak">🔊 English Words</button><button class="soft">🔊 Examples</button></div>`;c.querySelector(".star").onclick=()=>toggle(x);let b=c.querySelectorAll(".actions button");b[0].onclick=()=>speak(words.join(". "));b[1].onclick=()=>speak(examples.join(" "));g.appendChild(c)});content.appendChild(sec)});empty.classList.toggle("hidden",list.length>0);savedCount.textContent=saved.size}
["search","section","view"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));render();
let quiz=[],qi=0,score=0,answered=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);

function showQuestion(){answered=false;let q=quiz[qi],words=[q.a,q.b,q.c].filter(Boolean),examples=[q.ex1,q.ex2,q.ex3].filter(Boolean),idx=Math.floor(Math.random()*Math.min(words.length,examples.length)),correct=words[idx],sent=examples[idx];counter.textContent=`Question ${qi+1} / ${quiz.length}`;bar.style.width=(qi/quiz.length*100)+"%";prompt.textContent=words.join(" / ");sentence.textContent=sent.replace(new RegExp("\\b"+correct.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"),"_____");result.textContent="";next.classList.add("hidden");options.innerHTML="";shuffle(words).forEach(w=>{let b=document.createElement("button");b.className="option";b.textContent=w;b.onclick=()=>answer(b,w===correct,correct);options.appendChild(b)})}
function answer(btn,ok,correct){if(answered)return;answered=true;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("correct")});if(ok){score++;result.textContent="Correct! 答对了。"}else{btn.classList.add("wrong");result.textContent="Correct answer: "+correct}next.classList.remove("hidden")}
function nextQuestion(){qi++;if(qi<quiz.length){showQuestion();return}let pct=Math.round(score/quiz.length*100),b=Math.max(pct,Number(localStorage.getItem("uasaBook9Best")||0));localStorage.setItem("uasaBook9Best",b);best.textContent=b+"%";bar.style.width="100%";prompt.textContent=`${score} / ${quiz.length} (${pct}%)`;sentence.textContent=pct>=80?"Excellent!":"Review and try again.";options.innerHTML="";result.textContent="";next.classList.add("hidden")}
